<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときの種</title>
<style>
  :root{
    --ink:#4a3322; --ink-soft:#8a6a4c;
    --frame:#5a3a22; --panel:#f6ead0; --panel-hi:#fffaf0; --panel-lo:#dcc59c;
    --sel:#ffe3a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2f4a2c;color:var(--ink);
    font-family:"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none}
  #world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #world.grabbing{cursor:grabbing}
  img.px{image-rendering:pixelated;image-rendering:crisp-edges}

  /* ドット絵風の枠（角を欠いた4px線） */
  .pix{background:var(--panel);margin:4px;
    box-shadow:0 -4px 0 0 var(--frame),0 4px 0 0 var(--frame),-4px 0 0 0 var(--frame),4px 0 0 0 var(--frame),
      inset 0 4px 0 0 var(--panel-hi),inset 0 -4px 0 0 var(--panel-lo),0 8px 0 0 #0003}

  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud > *{pointer-events:auto}
  #topbar{position:absolute;top:8px;left:12px;right:12px;display:flex;align-items:center;gap:12px}
  #title{padding:4px 12px;font-size:20px;font-weight:bold;letter-spacing:.14em;display:flex;align-items:center;gap:8px;white-space:nowrap}
  #title img{width:24px;height:24px}
  #fastBadge{background:#b8503c;color:#fff4e4;padding:1px 6px;font-size:11px;letter-spacing:.05em;display:none}
  #town{margin-right:auto;display:flex;align-items:center;gap:8px;padding:4px 12px;font-weight:bold;font-size:17px;white-space:nowrap}
  #expBar{display:block;width:84px;height:12px;background:#5a3a22;padding:2px}
  #expFill{display:block;height:100%;width:0;background:#7fc24a;box-shadow:inset 0 -3px 0 #5c9c36,inset 0 2px 0 #b6e07a}
  #expText{font-size:13px;color:var(--ink-soft);min-width:42px}
  #gold{display:flex;align-items:center;gap:6px;padding:4px 14px;font-weight:bold;font-size:20px}
  #gold img{width:26px;height:26px}
  #warehouse{display:flex;align-items:center;gap:9px;padding:4px 12px;font-weight:bold;font-size:18px;
    border:0;font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  #warehouse .ttl{font-size:13px;color:var(--ink-soft);letter-spacing:.12em}
  .stock{display:flex;align-items:center;gap:4px}
  .stock img{width:26px;height:26px}

  #palette{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
  .tool{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;border:0;
    padding:6px 16px 6px 10px;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;
    transition:transform .12s}
  .tool img{width:36px;height:36px}
  .tool small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft);text-align:left}
  .tool.sel{background:var(--sel);transform:translateY(-5px)}
  .tool.locked{opacity:.55;cursor:default;filter:grayscale(.6)}
  .tool:disabled{cursor:default}
  .tool.act{padding:8px 16px;min-width:96px;justify-content:center;font-size:17px}
  .tool.act:disabled{opacity:.6;background:#e5d6b6;color:var(--ink-soft)}
  .tool.small{padding:5px 12px;font-size:15px}

  .overlay{position:fixed;inset:0;background:#2a1a1040;display:none;align-items:center;justify-content:center;z-index:10}
  .overlay .box{padding:14px 22px;text-align:center;max-width:94vw;max-height:88vh;overflow:auto}
  .overlay .q{font-weight:bold;letter-spacing:.1em}
  #popup .row{display:flex;gap:16px;margin:14px 0 8px}
  .overlay .cancel{background:none;border:none;font-size:14px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-family:inherit}
  .panelhd{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:10px}
  .panelhd b{font-size:20px;letter-spacing:.14em}
  .panelhd button{font-family:inherit;font-size:20px;color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:0 6px}
  .orow{display:flex;align-items:center;gap:16px;padding:8px 6px;border-top:3px dotted #c9ad7c;text-align:left}
  .orow:first-child{border-top:0}
  .ocrop{display:flex;align-items:center;gap:8px;flex:1;min-width:190px;font-weight:bold;font-size:19px}
  .ocrop img{width:36px;height:36px}
  .ocrop small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .orew{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:bold;min-width:120px}
  .orew span{display:flex;align-items:center;gap:4px}
  .orew img{width:18px;height:18px}
  .orew .xp{color:#4c8a34}
  .wrow{display:flex;align-items:center;gap:14px;padding:8px 6px;border-top:3px dotted #c9ad7c;text-align:left}
  .wrow:first-child{border-top:0}
  .wrow .nm{display:flex;align-items:center;gap:8px;min-width:170px;font-weight:bold;font-size:19px}
  .wrow .nm img{width:34px;height:34px}
  .wrow .nm small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .wrow .cnt{min-width:64px;font-size:20px;font-weight:bold;text-align:right}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .pgauge{height:18px;background:#5a3a22;padding:3px;margin:8px 0 4px;min-width:280px}
  .pgauge i{display:block;height:100%;width:0;background:#f2d27a;box-shadow:inset 0 -3px 0 #d9b24c,inset 0 2px 0 #fff0b0}
  .mline{margin:6px 0;font-size:17px;font-weight:bold;text-align:left}
  .mline.sub{font-size:14px;font-weight:normal;color:var(--ink-soft)}
  .mline img{width:22px;height:22px;vertical-align:middle}
  .mrow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:3px dotted #c9ad7c;text-align:left;flex-wrap:wrap}
  .mrow .recipe{display:flex;align-items:center;gap:8px;flex:1;min-width:250px;font-weight:bold;font-size:16px}
  .mrow .recipe img{width:30px;height:30px}
  .mrow .recipe small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .mrow .short{color:#b8503c}
  .mact{margin-top:10px;display:flex;justify-content:center}
  #toast{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:12;display:none;padding:8px 18px;
    font-weight:bold;letter-spacing:.06em;pointer-events:none}
</style>
</head>
<body>
<canvas id="world" aria-label="ときの種の町（畑と時計塔）"></canvas>

<div class="hud" style="inset:0">
  <div id="topbar">
    <div id="title" class="pix"><img class="px" data-icon="ic_sprout" alt="">ときの種<span id="fastBadge"></span></div>
    <div id="town" class="pix" title="町レベル"><span id="lvText">町Lv1</span><span id="expBar"><i id="expFill"></i></span><span id="expText">0/30</span></div>
    <div id="gold" class="pix" title="ゴールド"><img class="px" data-icon="ic_gold" alt="ゴールド"><span id="sGold">0</span></div>
    <button id="warehouse" class="pix" aria-label="倉庫（タップで売却パネルを開く）">
      <span class="ttl">倉庫</span>
      <span id="stocks" style="display:contents"></span>
    </button>
  </div>
  <div id="palette" style="position:absolute"></div>
</div>
<div id="popup" class="overlay"><div class="box pix">
  <div class="q">なにを植える？</div>
  <div class="row" id="popupRow"></div>
  <button class="cancel" id="popupCancel">やめる</button>
</div></div>
<div id="ordersPanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b>注文掲示板</b><button id="ordersClose" aria-label="閉じる">×</button></div>
  <div id="orderList"></div>
  <div class="hint">納品すると倉庫から作物を消費し、ゴールドと町経験値がもらえます（報酬ゴールド＝単価×個数×1.3）</div>
</div></div>
<div id="warehousePanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b>倉庫</b><button id="warehouseClose" aria-label="閉じる">×</button></div>
  <div id="warehouseList"></div>
  <div class="hint">生のまま売ると単価どおりのゴールドになります</div>
</div></div>
<div id="facPanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b id="facTitle">製粉所</b><button id="facClose" aria-label="閉じる">×</button></div>
  <div id="facBody"></div>
</div></div>
<div id="toast" class="pix"></div>

<script>
(() => {
  'use strict';
  const SAVE_KEY = 'clockseed.save';
  const SAVE_VERSION = 4;
  const MAX_PLOTS = 9;                 // 区画の最大数（町Lv2で 6 → 9）
  const BASE_PLOTS = 6;
  const ORDER_COUNT = 3;               // 同時に出る注文の数
  const ORDER_MIN = 3, ORDER_MAX = 9;  // 生の作物の注文の個数の範囲
  const TOWN_LV_EXP = [0, 30];         // 町経験値の累計がこの値に達するとLv(添字+1)。Lv2が現在の最大

  // デバッグ：?fast=N で育成・建設・加工の時間をN分の1に（開始時点の倍速で終了時刻を確定）
  const FAST = (() => {
    const v = parseFloat(new URLSearchParams(location.search).get('fast'));
    return isFinite(v) && v > 0 ? v : 1;
  })();

  // 作物データ（チェーン表）。price＝生売り単価、orderExp＝注文1件あたりの町経験値
  const CROPS = {
    wheat:  { name: '小麦',      icon: 'ic_wheat',  growMs: 2 * 60 * 1000, yield: 3, price: 10, orderExp: 10, unlockLv: 1 },
    carrot: { name: 'にんじん',  icon: 'ic_carrot', growMs: 4 * 60 * 1000, yield: 3, price: 16, orderExp: 10, unlockLv: 1 },
    potato: { name: 'じゃがいも', icon: 'ic_potato', growMs: 6 * 60 * 1000, yield: 2, price: 30, orderExp: 14, unlockLv: 2 },
  };
  const CROP_KEYS = Object.keys(CROPS);

  // 施設データ。cost＝建設費(G)、buildMs＝建設時間
  const BUILDINGS = {
    mill:    { name: '製粉所',   unlockLv: 2, cost: 100, buildMs: 3 * 60 * 1000, buildText: '石を積んでいます…' },
    kitchen: { name: 'キッチン', unlockLv: 2, cost: 150, buildMs: 5 * 60 * 1000, buildText: '板を打っています…' },
  };
  // レシピデータ（材料・個数・加工時間・製品・単価）。UIはこの定義から生成する
  const RECIPES = {
    flour: { building: 'mill', inputs: { wheat: 2 }, ms: 2 * 60 * 1000,
             product: { key: 'flour', name: '小麦粉', icon: 'ic_flour', qty: 1, price: 35, orderExp: 20, orderQty: [2, 6] } },
    juice: { building: 'kitchen', inputs: { carrot: 3 }, ms: 3 * 60 * 1000,
             product: { key: 'juice', name: 'にんじんジュース', icon: 'ic_juice', qty: 1, price: 75, orderExp: 20, orderQty: [2, 6] } },
    fries: { building: 'kitchen', inputs: { potato: 2 }, ms: 4 * 60 * 1000,
             product: { key: 'fries', name: 'ポテトフライ', icon: 'ic_fries', qty: 1, price: 95, orderExp: 20, orderQty: [2, 6] } },
  };
  // 倉庫に入るもの全て（作物＋加工品）
  const ITEMS = {};
  for (const k of CROP_KEYS) ITEMS[k] = Object.assign({ orderQty: [ORDER_MIN, ORDER_MAX] }, CROPS[k]);
  for (const r of Object.values(RECIPES)) {
    const pr = r.product;
    ITEMS[pr.key] = { name: pr.name, icon: pr.icon, price: pr.price, orderExp: pr.orderExp, orderQty: pr.orderQty, building: r.building };
  }
  const ITEM_KEYS = Object.keys(ITEMS);
  const BUILDING_KEYS = Object.keys(BUILDINGS);

  const townLevelOf = exp => { let lv = 1; TOWN_LV_EXP.forEach((need, i) => { if (exp >= need) lv = i + 1; }); return lv; };
  const plotsForLevel = lv => (lv >= 2 ? MAX_PLOTS : BASE_PLOTS);
  const buildingBuilt = (bs, key, t = Date.now()) => !!(bs && bs[key] && t >= bs[key].builtAt);
  // 注文・倉庫に出せるか：作物は町Lv、加工品は施設の完成が条件
  const itemAvailable = (k, lv, bs) => { const it = ITEMS[k]; return it.building ? buildingBuilt(bs, it.building) : it.unlockLv <= lv; };

  // ---------- セーブ ----------
  function newOrder(lv, bs) {
    const open = ITEM_KEYS.filter(k => itemAvailable(k, lv, bs));
    const k = open[Math.floor(Math.random() * open.length)], [lo, hi] = ITEMS[k].orderQty;
    return { crop: k, qty: lo + Math.floor(Math.random() * (hi - lo + 1)) };
  }
  function freshState() {
    const st = { saveVersion: SAVE_VERSION, plots: Array(MAX_PLOTS).fill(null),
                 storage: {}, gold: 0, townExp: 0, orders: [], buildings: {} };
    for (const k of ITEM_KEYS) st.storage[k] = 0;
    for (const k of BUILDING_KEYS) st.buildings[k] = null;
    while (st.orders.length < ORDER_COUNT) st.orders.push(newOrder(1, st.buildings));
    return st;
  }
  const nat = n => (Number.isInteger(n) && n >= 0 ? n : 0);
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshState();
      const d = JSON.parse(raw);
      if (!d || typeof d.saveVersion !== 'number') return freshState();
      if (d.saveVersion < SAVE_VERSION) {            // 旧セーブからの移行：念のため原本を退避
        try { localStorage.setItem(SAVE_KEY + '.v' + d.saveVersion + '.backup', raw); } catch (e) {}
      }
      const s = freshState();
      s.townExp = nat(d.townExp);
      s.gold = nat(d.gold);
      const lv = townLevelOf(s.townExp), open = plotsForLevel(lv);
      for (let i = 0; i < open; i++) {
        const p = d.plots && d.plots[i];
        if (p && CROPS[p.crop] && CROPS[p.crop].unlockLv <= lv && isFinite(p.plantedAt) && isFinite(p.readyAt)) {
          s.plots[i] = { crop: p.crop, plantedAt: p.plantedAt, readyAt: p.readyAt };
        }
      }
      for (const k of ITEM_KEYS) s.storage[k] = nat(d.storage && d.storage[k]);
      for (const k of BUILDING_KEYS) {                // 施設：建設と加工は終了時刻（timestamp）で持つ
        const b = d.buildings && d.buildings[k];
        if (b && isFinite(b.startedAt) && isFinite(b.builtAt)) {
          const j = b.job, okJob = j && RECIPES[j.recipe] && RECIPES[j.recipe].building === k && isFinite(j.startedAt) && isFinite(j.readyAt);
          s.buildings[k] = { startedAt: b.startedAt, builtAt: b.builtAt,
                             job: okJob ? { recipe: j.recipe, startedAt: j.startedAt, readyAt: j.readyAt } : null };
        }
      }
      s.orders = [];
      for (let i = 0; i < ORDER_COUNT; i++) {
        const o = Array.isArray(d.orders) ? d.orders[i] : null;
        const ok = o && ITEMS[o.crop] && itemAvailable(o.crop, lv, s.buildings) && Number.isInteger(o.qty) &&
                   o.qty >= ITEMS[o.crop].orderQty[0] && o.qty <= ITEMS[o.crop].orderQty[1];
        s.orders.push(ok ? { crop: o.crop, qty: o.qty } : newOrder(lv, s.buildings));
      }
      return s;
    } catch (e) { return freshState(); }
  }
  let state = load();
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- ロジック（常に現在時刻との差分で判定） ----------
  const now = () => Date.now();
  const townLevel = () => townLevelOf(state.townExp);
  const activePlots = () => plotsForLevel(townLevel());
  function progress(p, t) {           // 0..1
    const total = p.readyAt - p.plantedAt;
    if (total <= 0) return 1;
    return Math.min(1, Math.max(0, (t - p.plantedAt) / total));
  }
  const isReady = (p, t) => !!p && t >= p.readyAt;
  function plant(i, crop) {
    if (i < 0 || i >= activePlots() || state.plots[i] || !CROPS[crop] || CROPS[crop].unlockLv > townLevel()) return false;
    const t = now();
    state.plots[i] = { crop, plantedAt: t, readyAt: t + CROPS[crop].growMs / FAST };
    save(); return true;
  }
  function harvest(i) {
    const p = state.plots[i];
    if (!p || !isReady(p, now())) return false;
    state.storage[p.crop] += CROPS[p.crop].yield;
    state.plots[i] = null;
    save(); return true;
  }
  const stageOf = (p, t) => !p ? 0 : t >= p.readyAt ? 3 : progress(p, t) >= 0.5 ? 2 : 1;

  // ---------- 施設：建設と加工（どちらも終了時刻ベース） ----------
  const bState = (key, t = now()) => { const b = state.buildings[key]; return !b ? 'none' : t >= b.builtAt ? 'built' : 'building'; };
  function startBuild(key) {
    const B = BUILDINGS[key];
    if (!B || townLevel() < B.unlockLv || state.buildings[key] || state.gold < B.cost) return false;
    const t = now();
    state.gold -= B.cost;
    state.buildings[key] = { startedAt: t, builtAt: t + B.buildMs / FAST, job: null };
    save(); return true;
  }
  const canCraft = rk => Object.entries(RECIPES[rk].inputs).every(([k, n]) => state.storage[k] >= n);
  function startJob(key, rk) {                       // 加工は1施設につき同時に1件。材料は開始時に消費
    const r = RECIPES[rk], b = state.buildings[key];
    if (!r || r.building !== key || bState(key) !== 'built' || b.job || !canCraft(rk)) return false;
    for (const [k, n] of Object.entries(r.inputs)) state.storage[k] -= n;
    const t = now();
    b.job = { recipe: rk, startedAt: t, readyAt: t + r.ms / FAST };
    save(); return true;
  }
  function collectJob(key) {                         // 完了した製品は施設に留まり、受け取ると倉庫へ
    const b = state.buildings[key];
    if (!b || !b.job || now() < b.job.readyAt) return false;
    const r = RECIPES[b.job.recipe];
    state.storage[r.product.key] += r.product.qty;
    b.job = null;
    save(); return true;
  }

  // ---------- 注文・町経験値・売却 ----------
  let onLevelUp = () => {};
  function gainExp(n) {
    const before = townLevel();
    state.townExp += n;
    if (townLevel() > before) onLevelUp(townLevel());
  }
  // 報酬ゴールド＝単価×個数×1.3（端数切り上げ）。小数誤差を避けるため整数で ceil(x*13/10) を計算
  const orderReward = o => ({ gold: Math.floor((ITEMS[o.crop].price * o.qty * 13 + 9) / 10), exp: ITEMS[o.crop].orderExp });
  function deliver(i) {
    const o = state.orders[i];
    if (!o || state.storage[o.crop] < o.qty) return false;
    const r = orderReward(o);
    state.storage[o.crop] -= o.qty;
    state.gold += r.gold;
    gainExp(r.exp);                                  // 先に経験値を加算（Lvが上がれば新作物も注文に出る）
    state.orders[i] = newOrder(townLevel(), state.buildings);
    save(); return true;
  }
  function sell(item, n) {
    const c = ITEMS[item];
    if (!c) return 0;
    n = Math.min(n, state.storage[item]);
    if (n <= 0) return 0;
    state.storage[item] -= n;
    state.gold += c.price * n;
    save(); return n;
  }

  /* =====================================================================
     描画エンジン（Canvas・タイル制・ドット絵スプライト）
     ここから下は見た目と操作だけ。ゲーム状態は上のロジックだけが変更する。
     ===================================================================== */
  const $ = id => document.getElementById(id);

  // ---------- 設定値（将来の町レベルで拡張） ----------
  const T = 16;                       // 1タイル = 16ドット
  const MAP = { w: 24, h: 18 };       // タイル数
  const WORLD_SEED = 20261127;        // 自然物の配置シード（セーブには含めない）
  const ZOOM_MIN = 0.7, ZOOM_MAX = 1.5;
  const LAYOUT = {
    plaza: { x: 1, y: 5, w: 5, h: 4 },                 // 広場（タイル）
    path:  [{ x: 6, y: 7, w: 3, h: 1 }],               // 石畳の道
    aisle: [{ x: 9, y: 7, w: 8, h: 1, lv: 1 }, { x: 9, y: 10, w: 8, h: 1, lv: 2 }], // 畑の中の土の通路
    tower: { x: 56, y: 118 },                          // 時計塔の足元（ドット座標）
    board: { x: 82, y: 138 },                          // 注文掲示板の足元（ドット座標）
    facilities: {                                      // 施設（建設予定地）の足元。bubble＝完成品の吹き出しを出す側
      mill:    { x: 256, y: 62, bubble: 1 },             // 畑の北東
      kitchen: { x: 204, y: 62, bubble: -1 },            // 製粉所の隣（西）
    },
    fence: lv => ({ x0: 136, x1: 280, y0: 76, y1: lv >= 2 ? 220 : 172, gateFrom: 108, gateTo: 140 }),
    plots: [[9, 5], [12, 5], [15, 5], [9, 8], [12, 8], [15, 8],      // 区画左上（タイル）、2×2。
            [9, 11], [12, 11], [15, 11]],                            // 末尾3つは町Lv2で現れる

  // 時計塔：屋根・壁の陰影つき縦長スプライト（文字列マップを行単位で組み立てる）
  const TOWER = (() => {
    const TW = 30, rows = [];
    const pad = s => { const l = Math.floor((TW - s.length) / 2); return '.'.repeat(l) + s + '.'.repeat(TW - l - s.length); };
    const body = (front, side) => '...m' + front + side + 'm...';   // 正面18 + 側面4（暗い面）
    const overlay = (base, top, at) => {
      const a = base.split('');
      for (let k = 0; k < top.length; k++) if (top[k] !== '.') a[at + k] = top[k];
      return a.join('');
    };
    let course = 0;
    const brick = () => {
      const r = course++, c = Math.floor(r / 3);
      if (r % 3 === 2) return body('B'.repeat(18), 'mmmm');
      let f = '';
      for (let k = 0; k < 18; k++) f += (k + (c % 2) * 3) % 6 === 5 ? 'B' : k < 6 ? 'a' : k < 14 ? 'b' : 'B';
      const sd = (c % 2) ? 'nmnn' : 'nnnm';
      return body(f, sd);
    };
    // 尖塔の飾り
    rows.push(pad('zz'), pad('zwzz'), pad('zzzz'), pad('zz'), pad('nn'), pad('nn'));
    // 屋根（左が光、右が影。瓦の段）
    const RH = 18;
    for (let k = 0; k < RH; k++) {
      const wd = 2 + 2 * Math.round(k * 14 / (RH - 1)), half = wd / 2, sh = k % 4 === 3;
      let s = '';
      for (let q = 0; q < wd; q++) {
        if (q === 0 || q === wd - 1) { s += 'x'; continue; }
        if (q < half) s += sh ? 'R' : (q === 1 || q === 2) ? 'l' : 'r';
        else s += sh ? 'x' : 'R';
      }
      // 屋根窓
      if (k >= 10 && k <= 13) {
        const win = ['.xx.', 'xvvx', 'xvix', 'xvvx'][k - 10];
        s = overlay(s, win, half - 2);
      }
      rows.push(pad(s));
    }
    rows.push('x'.repeat(TW));
    rows.push(pad('m' + 'n'.repeat(22) + 'Bm'));
    // 軒下の帯
    rows.push(pad('m' + 'a'.repeat(19) + 'B'.repeat(6) + 'm'));
    rows.push(pad('m' + 'b'.repeat(19) + 'n'.repeat(6) + 'm'));
    rows.push(brick(), brick());
    // 時計盤（針は実時刻で別描画）
    const FACE = [
      '.....mmmmm.....',
      '...mmFFFFFmm...',
      '..mFFfffffFFm..',
      '.mFfffffffffFm.',
      '.mFfffffffffFm.',
      'mFfffffffffffFm',
      'mFfffffffffffFm',
      'mFfffffffffffFm',
      'mFfffffffffffFm',
      'mFfffffffffffFm',
      '.mFfffffffffFm.',
      '.mFfffffffffFm.',
      '..mFFfffffFFm..',
      '...mmFFFFFmm...',
      '.....mmmmm.....',
    ];
    const faceTop = rows.length;
    for (const fr of FACE) rows.push(overlay(brick(), fr, 4 + 1));
    rows.push(brick(), brick());
    // 中段の帯
    rows.push(body('a'.repeat(18), 'BBBB'), body('B'.repeat(18), 'nnnn'));
    rows.push(brick(), brick(), brick());

      '..mmmm..', '.muuuUm.', 'muuuuuUm', 'muUuuuUm', 'muUuuuUm', 'muuuuuUm',
      'muUuuzUm', 'muUuuuUm', 'muUuuuUm', 'muuuuuUm', 'muUuuuUm', 'muUuuuUm',
    ];

    // 台座
    rows.push('m' + 'a'.repeat(21) + 'B'.repeat(7) + 'm');
    rows.push('m' + 'b'.repeat(21) + 'n'.repeat(7) + 'm');
    rows.push('m'.repeat(TW));
    return { rows, faceCx: 4 + 1 + 7, faceCy: faceTop + 7 };
  })();

  // ---- 製粉所（風車小屋）：建設予定地／建設中／完成。羽根は別スプライトで回す ----
  const mkGrid = (W, H) => Array.from({ length: H }, () => Array(W).fill('.'));
  const gridRows = g => g.map(r => r.join(''));
  function millTower(g, top, bot, cx, hwTop, hwBot) {      // 石積みの塔（左が明るく右が影）
    for (let y = top; y <= bot; y++) {
      const hw = Math.round(hwTop + (y - top) * (hwBot - hwTop) / Math.max(1, bot - top)), row = y - top;
      for (let x = cx - hw; x < cx + hw; x++) {
        const u = (x - (cx - hw)) / (2 * hw);
        let ch = u < .35 ? 'a' : u < .7 ? 'b' : 'n';
        if (row % 4 === 3) ch = u < .35 ? 'b' : u < .7 ? 'B' : 'm';
        else if ((x + (Math.floor(row / 4) % 2) * 3) % 6 === 5) ch = u < .7 ? 'B' : 'm';
        g[y][x] = ch;
      }
      g[y][cx - hw] = 'm'; g[y][cx + hw - 1] = 'm';
    }
  }
  const millPlinth = (g, cx, y0) => { for (const [dy, ch] of [[0, 'B'], [1, 'm']]) for (let x = cx - 14; x < cx + 14; x++) g[y0 + dy][x] = ch; };
  SPR_SRC.mill = (() => {
    const W = 36, H = 44, cx = 18, g = mkGrid(W, H);
    millTower(g, 17, 41, cx, 8, 13); millPlinth(g, cx, 42);
    for (let y = 4; y <= 16; y++) {                              // 屋根（キャップ）
      const hw = Math.max(1, Math.round(1 + (y - 4) * 11 / 12));
      for (let x = cx - hw; x < cx + hw; x++) {
        const u = (x - (cx - hw)) / (2 * hw);
        g[y][x] = (y % 3 === 0) ? 'R' : u < .3 ? 'l' : u < .65 ? 'r' : 'R';
      }
      g[y][cx - hw] = 'x'; g[y][cx + hw - 1] = 'x';
    }
    for (let x = cx - 12; x < cx + 12; x++) g[16][x] = 'x';
    for (const y of [1]) { g[y][cx - 1] = 'z'; g[y][cx] = 'z'; }
    for (const y of [2, 3]) { g[y][cx - 1] = 'x'; g[y][cx] = 'x'; }
    for (let y = 24; y <= 28; y++) for (let x = 16; x <= 19; x++) g[y][x] = 'm';          // 窓

    for (let y = 33; y <= 41; y++) {                                                          // 扉
      const half = y === 33 ? 2 : y === 34 ? 3 : 4;
      for (let x = cx - half; x < cx + half; x++) g[y][x] = (x === cx - half || x === cx + half - 1 || y === 33) ? 'm' : (x === cx ? 'U' : 'u');

    for (const x of [8, 11, 15, 20, 24]) { g[31][x] = 'b'; g[31][x + 1] = 'a'; }
    for (let y = 16; y <= 41; y++) { g[y][3] = 'W'; g[y][4] = 'V'; g[y][31] = 'W'; g[y][32] = 'V'; }
    for (const y of [24, 33]) for (let x = 3; x <= 32; x++) { g[y][x] = 'W'; g[y + 1][x] = 'V'; }
    for (let k = 0; k < 9; k++) { g[32 - k][5 + k] = 'V'; g[32 - k][30 - k] = 'V'; }       // 筋交い
    for (let y = 12; y <= 13; y++) for (let x = 33; x <= 35; x++) g[y][x] = 'r';           // 旗
    for (let y = 38; y <= 41; y++) for (let x = 24; x <= 28; x++) g[y][x] = (y === 38 || x === 24 || x === 28) ? 'X' : 'W';

    const keep = { x: cam.x, y: cam.y, zoom: cam.zoom };
    // 時計塔と畑の両方が入る範囲（上下は UI の分だけ余白）
    const x0 = 30, x1 = 290, y0 = townLevel() >= 2 ? FAC.mill.top - 6 : LAYOUT.tower.y - SPR.tower.height - 4, y1 = LAYOUT.fence(townLevel()).y1 + 6, padTop = 64, padBot = 84;
    const S = Math.min((VW - 32) / (x1 - x0), (VH - padTop - padBot) / (y1 - y0));
    cam.zoom = S / BASE;
    clampCam();
    const s2 = scale();
    cam.x = (x0 + x1) / 2;
    cam.y = (y0 + y1) / 2 - (padTop - padBot) / 2 / s2;
    clampCam();
    const r = { x: cam.x, y: cam.y, zoom: cam.zoom };

  }
  const initialCamera = () => Object.assign(cam, framing());
  let camTarget = null;           // 町Lvアップ時に、広がった畑が入る位置へゆっくり寄せる

  // ---------- 光（画面全体） ----------
  let LIGHT = null;
  function buildLightCache() {
    const W = VW, H = VH;
    const warm = ctx.createLinearGradient(0, 0, W, H);
    warm.addColorStop(0, 'rgba(255,206,140,0.55)'); warm.addColorStop(.55, 'rgba(255,190,130,0.18)');
    warm.addColorStop(1, 'rgba(110,80,160,0.30)');
    const sun = ctx.createRadialGradient(W * .12, -H * .15, 0, W * .12, -H * .15, Math.max(W, H) * .95);
    sun.addColorStop(0, 'rgba(255,232,180,0.42)'); sun.addColorStop(1, 'rgba(255,232,180,0)');
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .38, W / 2, H / 2, Math.hypot(W, H) * .58);
    vig.addColorStop(0, 'rgba(40,24,18,0)'); vig.addColorStop(1, 'rgba(40,24,18,0.48)');
    const haze = ctx.createLinearGradient(0, 0, 0, H * .3);
    haze.addColorStop(0, 'rgba(255,246,228,0.16)'); haze.addColorStop(1, 'rgba(255,246,228,0)');
    LIGHT = { warm, sun, vig, haze };
  }

  // ---------- 施設（製粉所・キッチン）の描画 ----------
  const FAC = {};
  for (const k of BUILDING_KEYS) {
    const F = LAYOUT.facilities[k], H = SPR[k].height;
    FAC[k] = { x: F.x, y: F.y, left: F.x - (SPR[k].width >> 1), top: F.y - H, bubble: F.bubble };
  }
  const MILL_HUB = { x: 18, y: 19 };                              // 風車の羽根の中心（製粉所スプライト内）
  const KITCHEN_CHIMNEY = { x: 27, y: 2 };                        // 煙突の口（キッチンスプライト内）
  let millAngle = 0;
  const facUnlocked = k => townLevel() >= BUILDINGS[k].unlockLv;
  const facRunning = (k, t) => { const b = state.buildings[k]; return !!(b && t >= b.builtAt && b.job && t < b.job.readyAt); };
  function facRect(k) {            // タップ判定（ワールド座標）
    const f = FAC[k];
    return bState(k) === 'none' ? { x: f.left - 2, y: f.y - 32, w: 40, h: 36 } : { x: f.left - 2, y: f.top - 2, w: 40, h: f.y - f.top + 6 };
  }
  function pushFacilities(objs, t) {
    for (const k of BUILDING_KEYS) {
      if (!facUnlocked(k)) continue;
      const f = FAC[k], st = bState(k, t), spr = st === 'none' ? SPR[k + '_site'] : st === 'building' ? SPR[k + '_wip'] : SPR[k];
      const x = f.left, y = f.y - spr.height;
      objs.push({ y: f.y, shadow: st === 'none' ? null : [f.x, f.y - 1, 15, 3.5],
        draw: c => {
          c.drawImage(spr, x, y);
          if (st === 'built' && k === 'mill') {                  // 風車の羽根（加工中だけ回る）
            const q = Math.PI / 16, a = Math.round(millAngle / q) * q;
            c.save(); c.translate(f.left + MILL_HUB.x + .5, f.top + MILL_HUB.y + .5); c.rotate(a);
            c.drawImage(SPR.blades, -15.5, -15.5); c.restore();
          }
        } });
    }
  }
  function gaugeBar(x, y, w, frac) {
    px(ctx, x - 1, y - 1, 'rgba(40,25,15,.75)', w + 2, 4); px(ctx, x, y, '#7a5a3a', w, 2);
    px(ctx, x, y, '#f2d27a', Math.round(w * Math.min(1, Math.max(0, frac))), 2);
  }
  function drawSmoke(x, y, ts) {                                  // 煙突の煙（加工中）
    for (let i = 0; i < 4; i++) {
      const ph = (ts * 0.45 + i / 4) % 1, a = (1 - ph) * .75, r = 1 + Math.round(ph * 2);
      ctx.fillStyle = 'rgba(245,242,235,' + a.toFixed(2) + ')';

  }
  function drawFacilityMarkers(ts, t) {
    const bob = Math.round(Math.sin(ts * 4) * 1.5);

      if (!facUnlocked(k)) continue;
      const f = FAC[k], st = bState(k, t), b = state.buildings[k];
      if (st === 'none') {                                       // 建設予定地：金貨が跳ねる（足りないときは薄く）

      } else if (b.job) {

          const bx = f.bubble > 0 ? f.x + 15 : f.x - 31, by = f.y - 36 + bob;
          px(ctx, bx, by, '#5a3a22', 16, 16); px(ctx, bx + 1, by + 1, '#fff6e0', 14, 14);

          const tx = f.bubble > 0 ? bx + 2 : bx + 10;

        } else {

          if (k === 'kitchen') drawSmoke(f.left + KITCHEN_CHIMNEY.x, f.top + KITCHEN_CHIMNEY.y, ts);
        }

    }
  }

  // ---------- 描画 ----------
  let GROUND = null, builtLevel = 0;
  function rebuildWorld() {            // 町レベルが変わったとき：地面・柵を作り直す
    const lv = townLevel();
    layoutGround(lv);
    GROUND = bakeGround();
    fenceObjs = buildFence(lv);
    builtLevel = lv;
  }
  rebuildWorld();
  const shadow = (c, x, y, rx, ry, a = .26) => {
    c.fillStyle = `rgba(48,30,20,${a})`; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
  };
  function setWorldTransform() {
    const S = scale() * DPR;
    const tx = Math.round((VW / 2 - cam.x * scale()) * DPR), ty = Math.round((VH / 2 - cam.y * scale()) * DPR);
    ctx.setTransform(S, 0, 0, S, tx, ty);
    ctx.imageSmoothingEnabled = false;
  }
  let lastT = performance.now();
  function frame(tms) {
    const dt = Math.min(.1, (tms - lastT) / 1000); lastT = tms;
    const t = now(), ts = tms / 1000;
    if (townLevel() !== builtLevel) rebuildWorld();
    const AP = activePlots();
    if (facRunning('mill', t)) millAngle += dt * 0.55;
    stepParticles(dt, ts);
    if (camTarget) {
      const k = 1 - Math.exp(-dt * 4);
      cam.x += (camTarget.x - cam.x) * k; cam.y += (camTarget.y - cam.y) * k; cam.zoom += (camTarget.zoom - cam.zoom) * k;
      clampCam();
      if (Math.abs(camTarget.x - cam.x) + Math.abs(camTarget.y - cam.y) + Math.abs(camTarget.zoom - cam.zoom) * 100 < 0.3) camTarget = null;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#2f4a2c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    setWorldTransform();
    ctx.drawImage(GROUND, 0, 0);

    // 区画の土
    const objs = statics.concat(fenceObjs);
    pushFacilities(objs, t);
    state.plots.forEach((p, i) => {
      if (i >= AP) return;
      const R = plotRect(i), st = stageOf(p, t);
      ctx.drawImage(p ? PLOT_IMG[i].wet : PLOT_IMG[i].dry, R.x, R.y);
      if (!p) return;
      const s = SPR[p.crop + st];
      SLOTS.forEach(([bx, by], k) => {
        const fx = R.x + bx + SLOT_JIT[i][k], fy = R.y + by;
        objs.push({ y: fy, shadow: [fx, fy, st === 1 ? 3 : 5, st === 1 ? 1 : 1.6],
          draw: c => c.drawImage(s, fx - (s.width >> 1), fy - s.height + 1) });
      });
    });
    // 足元の影 → y ソートで立つ物
    for (const o of objs) if (o.shadow) shadow(ctx, ...o.shadow);
    objs.sort((a, b) => a.y - b.y);
    for (const o of objs) o.draw(ctx);

    // 納品できる注文があれば掲示板の上に「！」
    if (state.orders.some(o => state.storage[o.crop] >= o.qty)) {
      const bob = Math.round(Math.sin(ts * 4) * 1.5), bx = BOARD.cx - 4, by = BOARD.top - 14 + bob;
      px(ctx, bx, by, '#5a3a22', 9, 11); px(ctx, bx + 1, by + 1, '#fff6e0', 7, 9);
      px(ctx, bx + 4, by + 2, '#c8503a', 1, 4); px(ctx, bx + 4, by + 7, '#c8503a', 1, 1);
      px(ctx, bx + 3, by + 11, '#5a3a22', 3, 1); px(ctx, bx + 4, by + 12, '#5a3a22', 1, 1);
    }
    drawFacilityMarkers(ts, t);

    // 区画の上のしるし（空き：＋、育成中：ゲージ、収穫可：きらめき）
    state.plots.forEach((p, i) => {
      if (i >= AP) return;
      const R = plotRect(i), st = stageOf(p, t);
      if (!p) {
        ctx.globalAlpha = .55 + .25 * Math.sin(ts * 2.4 + i);
        const cx = R.x + 16, cy = R.y + 16;
        px(ctx, cx - 3, cy - 1, '#5e3c24', 7, 3); px(ctx, cx - 1, cy - 3, '#5e3c24', 3, 7);
        px(ctx, cx - 2, cy, '#fff3d6', 5, 1); px(ctx, cx, cy - 2, '#fff3d6', 1, 5);
        ctx.globalAlpha = 1;
      } else if (st < 3) {
        px(ctx, R.x + 3, R.y + PLOT_PX - 5, 'rgba(40,25,15,.75)', 26, 4);
        px(ctx, R.x + 4, R.y + PLOT_PX - 4, '#7a5a3a', 24, 2);
        px(ctx, R.x + 4, R.y + PLOT_PX - 4, '#f2d27a', Math.round(24 * progress(p, t)), 2);
      } else {
        for (let k = 0; k < 4; k++) {
          const r = hash2(i, k, 5), ph = r() * 6.28;
          if (Math.sin(ts * 3 + ph) < .55) continue;
          const sx = R.x + 3 + Math.floor(r() * 26), sy = R.y - 4 + Math.floor(r() * 30);
          px(ctx, sx - 1, sy, '#fff6c8', 3, 1); px(ctx, sx, sy - 1, '#fff6c8', 1, 3);
        }
      }
    });
    // 花びら
    for (const p of particles) if (p.kind === 'petal') {
      const flip = Math.sin(ts * 3 + p.ph) > 0;
      px(ctx, Math.round(p.x), Math.round(p.y), p.col, flip ? 2 : 1, flip ? 1 : 2);
    }

    // 光の演出（画面空間）

    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = LIGHT.warm; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = LIGHT.sun; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = LIGHT.haze; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = LIGHT.vig; ctx.fillRect(0, 0, VW, VH);
    // 光の粒（ふんわり発光）

    for (const p of particles) if (p.kind === 'mote') {
      const s = toScreen(p.x, p.y), a = .18 + .14 * Math.sin(ts * 1.7 + p.ph), rr = 1.6 * scale();
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr * 2.2);
      g.addColorStop(0, `rgba(255,236,180,${a})`); g.addColorStop(1, 'rgba(255,236,180,0)');
      ctx.fillStyle = g; ctx.fillRect(s.x - rr * 2.2, s.y - rr * 2.2, rr * 4.4, rr * 4.4);

  if (FAST !== 1) { const b = $('fastBadge'); b.style.display = 'inline'; b.textContent = '×' + FAST + ' DEBUG'; }

  // ---------- HUD（ゴールド・町Lv・経験値ゲージ・倉庫） ----------
  let hudSig = '';

  const itemVisible = k => ITEMS[k].building ? (bState(ITEMS[k].building) === 'built' || state.storage[k] > 0) : ITEMS[k].unlockLv <= townLevel();
  function updateHud() {
    const lv = townLevel(), exp = state.townExp, st = state.storage;

  let toastTimer = 0;

  // ---------- 作物パレット／作物選択ポップアップ ----------
  let selected = null;
  const pal = $('palette');
  const iconImg = k => `<img class="px" src="${iconURL(ITEMS[k].icon)}" alt="">`;

  // ---------- 注文パネル ----------
  const goldImg = `<img class="px" src="${iconURL('ic_gold')}" alt="G">`;
  function renderOrders() {

  // ---------- 施設パネル（建設予定地／建設中／加工）。建物・レシピ定義から生成 ----------
  const fmtTime = ms => { const sec = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const facRecipes = k => Object.keys(RECIPES).filter(rk => RECIPES[rk].building === k);
  let curFac = 'mill', facRenderedSig = '';
  function facSig(k) {
    const st = bState(k), b = state.buildings[k], t = now();
    const job = b && b.job ? (t >= b.job.readyAt ? 'done' : 'run') : 'none';
    return [k, st, job, state.gold >= BUILDINGS[k].cost, facRecipes(k).map(canCraft).join()].join('|');
  }
  function mkBtn(label, disabled, onclick) {
    const b = document.createElement('button'); b.className = 'tool pix act'; b.textContent = label; b.disabled = disabled;
    if (!disabled) b.onclick = onclick; return b;
  }
  function renderFac() {
    const k = curFac, body = $('facBody'), B = BUILDINGS[k], st = bState(k), b = state.buildings[k];
    facRenderedSig = facSig(k);
    body.innerHTML = '';
    const add = (html, cls) => { const d = document.createElement('div'); d.className = cls || 'mline'; d.innerHTML = html; body.appendChild(d); return d; };
    const gauge = '<div class="pgauge"><i id="mFill"></i></div><div class="mline sub" id="mTime"></div>';
    if (st === 'none') {
      $('facTitle').textContent = '建設予定地';

      add('建設費 ' + goldImg + B.cost + 'G ／ 建設時間 ' + (B.buildMs / 60000) + '分');
      add('所持金 ' + goldImg + state.gold + 'G', 'mline sub');
      const act = add('', 'mact');
      act.appendChild(state.gold >= B.cost ? mkBtn('建設開始', false, () => { if (startBuild(k)) renderFac(); })
                                           : mkBtn('あと' + (B.cost - state.gold) + 'G 必要', true));
    } else if (st === 'building') {
      $('facTitle').textContent = B.name + '（建設中）';
      add(B.buildText);
      add(gauge, 'mline');
    } else {
      $('facTitle').textContent = B.name;
      if (b.job) {
        const r = RECIPES[b.job.recipe], pr = r.product, done = now() >= b.job.readyAt;
        add((done ? '完成！ ' : '加工中： ') + iconImg(pr.key) + ' ' + pr.name + ' ×' + pr.qty);
        if (done) add('', 'mact').appendChild(mkBtn('受け取る', false, () => { if (collectJob(k)) renderFac(); }));
        else add(gauge, 'mline');
      }
      for (const rk of facRecipes(k)) {
        const r = RECIPES[rk], pr = r.product, ok = canCraft(rk), busy = !!b.job;
        const ins = Object.entries(r.inputs).map(([ik, n]) => iconImg(ik) + ITEMS[ik].name + ' <span class="' +
          (state.storage[ik] >= n ? '' : 'short') + '">' + state.storage[ik] + '/' + n + '</span>').join(' ＋ ');
        const row = document.createElement('div'); row.className = 'mrow';
        row.innerHTML = '<div class="recipe">' + ins + ' → ' + iconImg(pr.key) + '<span>' + pr.name + ' ×' + pr.qty +
          '<small>加工 ' + (r.ms / 60000) + '分 ／ 単価 ' + pr.price + 'G</small></span></div>';
        row.appendChild(mkBtn(busy ? (now() >= b.job.readyAt ? '受け取り待ち' : '加工中') : ok ? '加工開始' : '材料が足りません', busy || !ok, () => { if (startJob(k, rk)) renderFac(); }));
        body.appendChild(row);
      }
    }
    tickFac(true);
  }
  function tickFac(force) {             // パネルの表示だけを更新（状態は時刻との差分で計算）
    if ($('facPanel').style.display !== 'flex') return;
    if (!force && facSig(curFac) !== facRenderedSig) { renderFac(); return; }
    const b = state.buildings[curFac], t = now(), f = $('mFill');
    if (!f || !b) return;
    let from, to;
    if (t < b.builtAt) { from = b.startedAt; to = b.builtAt; }
    else if (b.job && t < b.job.readyAt) { from = b.job.startedAt; to = b.job.readyAt; }
    else return;
    f.style.width = (100 * Math.min(1, (t - from) / (to - from))).toFixed(1) + '%';
    $('mTime').textContent = 'あと ' + fmtTime(to - t);
  }
  function openFac(k) { curFac = k; renderFac(); $('facPanel').style.display = 'flex'; }
  $('facClose').onclick = () => { $('facPanel').style.display = 'none'; };

  for (const id of ['popup', 'ordersPanel', 'warehousePanel', 'facPanel']) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { if (e.target === el) { el.style.display = 'none'; if (id === 'popup') popupPlot = -1; } });
  }

  onLevelUp = lv => {
    hudSig = '';
    buildPalette(); buildPopupRow();
    rebuildWorld(); camTarget = framing();
    toast('町Lv' + lv + '！ じゃがいも・畑の3区画・製粉所とキッチンの建設予定地が解放されました');
  };

  // ---------- 操作：区画のなぞり／カメラ移動／ズーム ----------
  function plotAt(sx, sy) {
    const w = toWorld(sx, sy);
    for (let i = 0, n = activePlots(); i < n; i++) {
      const R = plotRect(i);   // 背の高い穂も押せるよう上に少し広げる
      if (w.x >= R.x - 1 && w.x < R.x + R.w + 1 && w.y >= R.y - 6 && w.y < R.y + R.h + 1) return i;
    }
    return -1;
  }
  let mode = null, touched = new Set();
  function apply(i) {
    if (i < 0 || touched.has(i)) return;
    touched.add(i);
    const p = state.plots[i];
    if (mode === 'plant' && !p && selected) plant(i, selected);
    else if (mode === 'harvest' && p) harvest(i);
  }
  const ptrs = new Map();
  let gesture = null;          // 'farm' | 'pan' | 'pinch'
  let pan = null, pinch = null;
  const mid = () => { const a = [...ptrs.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
  function startPan(x, y, tap = false) { gesture = 'pan'; pan = { sx: x, sy: y, cx: cam.x, cy: cam.y, moved: 0, tap }; canvas.classList.add('grabbing'); }
  function hitFac(sx, sy) {         // タップした施設のキー（なければ null）
    const w = toWorld(sx, sy);
    for (const k of BUILDING_KEYS) {
      if (!facUnlocked(k)) continue;
      const R = facRect(k);
      if (w.x >= R.x && w.x < R.x + R.w && w.y >= R.y && w.y < R.y + R.h) return k;
    }
    return null;
  }
  function hitBoard(sx, sy) { const w = toWorld(sx, sy); return w.x >= BOARD.x && w.x < BOARD.x + BOARD.w && w.y >= BOARD.y && w.y < BOARD.y + BOARD.h; }
  function startPinch() {
    mode = null; gesture = 'pinch';
    const m = mid(); pinch = { d0: Math.max(10, m.d), z0: cam.zoom, w: toWorld(m.x, m.y) };
  }
  function zoomAround(sx, sy, w, z) {
    cam.zoom = Math.min(ZOOM_MAX, Math.max(zoomMin(), z));
    cam.x = w.x - (sx - VW / 2) / scale(); cam.y = w.y - (sy - VH / 2) / scale();
    clampCam();
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); camTarget = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { startPinch(); return; }
    if (ptrs.size > 2) return;
    const i = plotAt(e.clientX, e.clientY);
    if (i < 0) { startPan(e.clientX, e.clientY, hitBoard(e.clientX, e.clientY) ? 'board' : (hitFac(e.clientX, e.clientY) ? 'fac:' + hitFac(e.clientX, e.clientY) : false)); return; }   // 区画の外 → カメラ（掲示板の上のタップは注文パネル）
    gesture = 'farm';                                         // 区画の上 → なぞり優先（カメラは動かさない）
    touched = new Set();
    const p = state.plots[i];
    if (!p) {
      if (!selected) { openPopup(i); mode = null; return; }
      mode = 'plant';
    } else if (isReady(p, now())) mode = 'harvest';
    else { mode = null; return; }
    apply(i);
  });
  canvas.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture === 'pinch' && ptrs.size >= 2) {
      const m = mid(); zoomAround(m.x, m.y, pinch.w, pinch.z0 * m.d / pinch.d0);
    } else if (gesture === 'pan') {
      pan.moved = Math.max(pan.moved, Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy));
      cam.x = pan.cx - (e.clientX - pan.sx) / scale(); cam.y = pan.cy - (e.clientY - pan.sy) / scale(); clampCam();
    } else if (gesture === 'farm' && mode) {
      apply(plotAt(e.clientX, e.clientY));
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {
      const tapped = e.type === 'pointerup' && gesture === 'pan' && pan && pan.tap && pan.moved < 8 ? pan.tap : null;
      gesture = null; mode = null; touched = new Set(); canvas.classList.remove('grabbing');
      if (tapped === 'board') openOrders(); else if (tapped && tapped.startsWith('fac:')) openFac(tapped.slice(4));
    }
    else if (gesture === 'pinch' && ptrs.size === 1) { const [q] = ptrs.values(); startPan(q.x, q.y); }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); camTarget = null;
    zoomAround(e.clientX, e.clientY, toWorld(e.clientX, e.clientY), cam.zoom * Math.exp(-e.deltaY * .0015));
  }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', resize);

  // 検品用（読み取り専用の座標変換。ゲーム状態は触らない）
  window.__clockseed = {
    plotCenter: i => { const R = plotRect(i); return toScreen(R.x + R.w / 2, R.y + R.h / 2); },
    worldToScreen: toScreen,
    boardCenter: () => toScreen(BOARD.cx, BOARD.top + 10),
    facCenter: k => toScreen(FAC[k].x, FAC[k].y - (bState(k) === 'none' ? 8 : 20)),
    millCenter: () => window.__clockseed.facCenter('mill'),
    kitchenCenter: () => window.__clockseed.facCenter('kitchen'),
    viewport: () => ({ w: VW, h: VH, mapW: MAP.w * T, mapH: MAP.h * T, zoomMin: zoomMin() }),
    camera: () => ({ x: cam.x, y: cam.y, zoom: cam.zoom }),
    spriteSizes: () => Object.fromEntries(Object.entries(SPR).map(([k, v]) => [k, [v.width, v.height]])),
  };

  resize();
  initialCamera();
  save();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
