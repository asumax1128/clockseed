<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときの種</title>
<style>
  :root{
    --ink:#5a4030; --ink-soft:#8a6c55;
    --panel:#fbf3e0; --panel-edge:#b48c64; --panel-shadow:#9c7a5833;
    --accent:#e7b864; --accent-soft:#f6e2b4;
    --grass:#a7cb86;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3df;color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Rounded Mplus 1c",system-ui,sans-serif;touch-action:none}
  #defs{position:absolute;width:0;height:0;overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}

  header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px;gap:12px}
  h1{margin:0;font-size:22px;letter-spacing:.12em;display:flex;align-items:center;gap:8px;
    color:#6b4a33;text-shadow:0 2px 0 #fff8}
  h1 svg{width:26px;height:26px}
  #fastBadge{background:#c9705a;color:#fff6ea;border-radius:8px;padding:2px 8px;font-size:11px;
    letter-spacing:.05em;display:none}
  .panel{background:var(--panel);border:3px solid var(--panel-edge);border-radius:16px;
    box-shadow:0 4px 0 var(--panel-shadow),inset 0 0 0 2px #fffaf0}
  #warehouse{display:flex;align-items:center;gap:14px;padding:5px 14px;font-weight:bold;font-size:18px}
  #warehouse .ttl{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  .stock{display:flex;align-items:center;gap:4px}
  .stock svg{width:26px;height:26px}

  main{flex:1;display:flex;min-height:0;padding:0 18px 4px;gap:10px}
  #towerBox{flex:0 0 24%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
  #tower{height:100%;width:100%;max-width:240px}
  #farm{flex:1;position:relative;padding:22px;min-height:0}
  #fence{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #field{position:relative;height:100%;display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);gap:10px}
  .plot{position:relative;min-width:0;min-height:0;cursor:pointer;touch-action:none}
  .plot > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .plot.ready > svg{animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #fff3c0)}50%{filter:drop-shadow(0 0 9px #ffe9a0)}}
  .plot.empty:hover .plus{opacity:.95}
  .plus{opacity:.75;transition:opacity .2s}

  footer{display:flex;justify-content:center;gap:14px;padding:4px 16px 12px}
  .tool{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;
    padding:6px 18px 6px 10px;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;
    transition:transform .15s,background .15s}
  .tool svg{width:34px;height:34px}
  .tool small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft);text-align:left}
  .tool.sel{border-color:#d49a45;background:var(--accent-soft);transform:translateY(-4px);
    box-shadow:0 6px 0 #c48a3a44,inset 0 0 0 2px #fff6dc}

  #popup{position:fixed;inset:0;background:#4a36262e;display:none;align-items:center;justify-content:center;z-index:10}
  #popup .box{padding:16px 22px;text-align:center}
  #popup .q{font-weight:bold;letter-spacing:.08em}
  #popup .row{display:flex;gap:14px;margin:12px 0 6px}
  #popup .cancel{background:none;border:none;font-size:14px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="popup"><div class="box panel">

  <div class="row" id="popupRow"></div>
  <button class="cancel" id="popupCancel">やめる</button>

<script>
(() => {
  'use strict';
  const SAVE_KEY = 'clockseed.save';
  const SAVE_VERSION = 1;
  const PLOT_COUNT = 6;
  const SVGNS = 'http://www.w3.org/2000/svg';

  // デバッグ：?fast=N で育成時間をN分の1に
  const FAST = (() => {
    const v = parseFloat(new URLSearchParams(location.search).get('fast'));
    return isFinite(v) && v > 0 ? v : 1;
  })();

  // 作物データ（チェーン表 v0.1）
  const CROPS = {
    wheat:  { name: '小麦',   icon: 'ic-wheat',  growMs: 2 * 60 * 1000, yield: 3 },
    carrot: { name: 'にんじん', icon: 'ic-carrot', growMs: 4 * 60 * 1000, yield: 3 },
  };

  // ---------- セーブ ----------
  function freshState() {
    return { saveVersion: SAVE_VERSION, plots: Array(PLOT_COUNT).fill(null),
             storage: { wheat: 0, carrot: 0 } };
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshState();
      const d = JSON.parse(raw);
      if (!d || typeof d.saveVersion !== 'number') return freshState();
      const s = freshState();
      for (let i = 0; i < PLOT_COUNT; i++) {
        const p = d.plots && d.plots[i];
        if (p && CROPS[p.crop] && isFinite(p.plantedAt) && isFinite(p.readyAt)) {
          s.plots[i] = { crop: p.crop, plantedAt: p.plantedAt, readyAt: p.readyAt };
        }
      }
      for (const k of Object.keys(CROPS)) {
        const n = d.storage && d.storage[k];
        s.storage[k] = Number.isInteger(n) && n >= 0 ? n : 0;
      }
      return s;
    } catch (e) { return freshState(); }
  }
  let state = load();
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- ロジック（常に現在時刻との差分で判定） ----------
  const now = () => Date.now();
  function progress(p, t) {           // 0..1
    const total = p.readyAt - p.plantedAt;
    if (total <= 0) return 1;
    return Math.min(1, Math.max(0, (t - p.plantedAt) / total));
  }
  const isReady = (p, t) => !!p && t >= p.readyAt;
  function plant(i, crop) {
    if (state.plots[i] || !CROPS[crop]) return false;
    const t = now();
    state.plots[i] = { crop, plantedAt: t, readyAt: t + CROPS[crop].growMs / FAST };
    save(); return true;
  }
  function harvest(i) {
    const p = state.plots[i];
    if (!p || !isReady(p, now())) return false;
    state.storage[p.crop] += CROPS[p.crop].yield;
    state.plots[i] = null;
    save(); return true;
  }

  // ---------- 画面：区画 ----------
  const $ = id => document.getElementById(id);
  const field = $('field');
  // 2本の畝 × 3株
  const RIDGES = [40, 76];
  const COLS = [30, 60, 90];
  const SPOTS = [];
  RIDGES.forEach((ry, r) => COLS.forEach((cx, c) =>
    SPOTS.push({ x: cx + (r ? 3 : -3) + (c - 1) * 0.5, y: ry + 2 })));

  function bedSvg() {
    // 草の縁取り
    let s = '<rect x="1" y="1" width="118" height="98" rx="16" fill="#a3c983"/>' +
      '<rect x="1" y="1" width="118" height="98" rx="16" fill="none" stroke="#88b169" stroke-width="2"/>' +
      '<g stroke="#7ea65f" stroke-width="1.1" stroke-linecap="round">' +
      '<path d="M10 4 l-1 -3 M12 4 l1 -3 M58 3 l-1 -2.5 M60 3 l1 -2.5 M104 4 l-1 -3 M106 4 l1 -3' +
      ' M3 50 l-2 -1 M117 30 l2 -1 M117 70 l2 -1 M40 98 l-1 2 M80 98 l1 2"/></g>';
    // 土
    s += '<rect class="soil" x="8" y="8" width="104" height="84" rx="12" fill="url(#g-soil)"/>' +
      '<rect x="8" y="8" width="104" height="84" rx="12" fill="none" stroke="#6b4a30" stroke-opacity=".35" stroke-width="2"/>';
    // 畝（ふんわり盛り上がり）
    for (const y of RIDGES) {
      s += `<ellipse cx="60" cy="${y + 8}" rx="47" ry="7" fill="#5a3b26" opacity=".28"/>` +
        `<rect class="ridge" x="13" y="${y - 10}" width="94" height="20" rx="10" fill="url(#g-ridge)"/>` +
        `<path d="M22 ${y - 6} Q60 ${y - 11} 98 ${y - 6}" stroke="#fff" stroke-opacity=".18" stroke-width="2.4" fill="none" stroke-linecap="round"/>` +
        `<g fill="#6e4a32" opacity=".45"><circle cx="20" cy="${y + 3}" r="1"/><circle cx="47" cy="${y + 5}" r=".9"/>` +
        `<circle cx="74" cy="${y + 4}" r="1.1"/><circle cx="101" cy="${y + 2}" r=".9"/></g>`;
    }
    // 空き：種まき目印
    s += '<g class="plus"><circle cx="60" cy="58" r="10" fill="#fbf3e0" fill-opacity=".55" stroke="#fbf3e0" stroke-width="1.5" stroke-dasharray="3 2.4"/>' +
      '<path d="M60 53 V63 M55 58 H65" stroke="#8a6449" stroke-width="2.2" stroke-linecap="round"/></g>';
    s += '<g class="plants"></g>';
    // 残り時間ゲージ
    s += '<g class="gauge"><rect x="30" y="91" width="60" height="6" rx="3" fill="#5a3b26" fill-opacity=".55"/>' +
      '<rect class="bar" x="31" y="92" width="0" height="4" rx="2" fill="#f0d27a"/></g>';
    return '<svg viewBox="0 0 120 100" preserveAspectRatio="xMidYMid meet">' + s + '</svg>';
  }

  const plotEls = [];
  for (let i = 0; i < PLOT_COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'plot empty'; el.dataset.i = i;
    el.innerHTML = bedSvg();
    const svg = el.firstElementChild;
    el._ui = {
      key: null,
      soil: svg.querySelector('.soil'),
      ridges: svg.querySelectorAll('.ridge'),
      plus: svg.querySelector('.plus'),
      plants: svg.querySelector('.plants'),
      gauge: svg.querySelector('.gauge'),
      bar: svg.querySelector('.bar'),
    };
    field.appendChild(el); plotEls.push(el);
  }
  if (FAST !== 1) { const b = $('fastBadge'); b.style.display = 'inline'; b.textContent = '×' + FAST + ' DEBUG'; }

  function setPlants(ui, sym) {
    ui.plants.textContent = '';
    if (!sym) return;
    for (const p of SPOTS) {
      const u = document.createElementNS(SVGNS, 'use');
      u.setAttribute('href', '#' + sym);
      u.setAttribute('x', p.x - 15); u.setAttribute('y', p.y - 36);
      u.setAttribute('width', 30); u.setAttribute('height', 40);
      ui.plants.appendChild(u);
    }
  }
  const STAGE_NAME = ['', '芽', '成長中', '収穫できる'];

  function render() {
    const t = now();
    state.plots.forEach((p, i) => {
      const el = plotEls[i], ui = el._ui;
      let st = 0;
      if (p) st = t >= p.readyAt ? 3 : progress(p, t) >= 0.5 ? 2 : 1;
      const key = p ? p.crop + st : 'empty';
      if (ui.key !== key) {
        ui.key = key;
        const empty = !p;
        el.className = 'plot ' + (empty ? 'empty' : 'st' + st + (st === 3 ? ' ready' : ''));
        ui.soil.setAttribute('fill', empty ? 'url(#g-soil-dry)' : 'url(#g-soil)');
        ui.ridges.forEach(r => r.setAttribute('fill', empty ? 'url(#g-ridge-dry)' : 'url(#g-ridge)'));
        ui.plus.style.display = empty ? '' : 'none';
        setPlants(ui, empty ? null : p.crop + '-' + st);
        el.setAttribute('aria-label', empty ? 'あき区画（タップで植える）' : CROPS[p.crop].name + '：' + STAGE_NAME[st]);
      }
      ui.gauge.style.display = p && st < 3 ? '' : 'none';
      if (p && st < 3) ui.bar.setAttribute('width', (58 * progress(p, t)).toFixed(2));
    });
    $('sWheat').textContent = state.storage.wheat;
    $('sCarrot').textContent = state.storage.carrot;
    drawClock();
  }

  // ---------- 時計塔の針（現在時刻） ----------
  (() => {
    const g = $('ticks');
    for (let k = 0; k < 12; k++) {
      const a = k * Math.PI / 6, big = k % 3 === 0;
      const r1 = big ? 27 : 30, r2 = 33;
      const l = document.createElementNS(SVGNS, 'line');
      l.setAttribute('x1', 100 + r1 * Math.sin(a)); l.setAttribute('y1', 206 - r1 * Math.cos(a));
      l.setAttribute('x2', 100 + r2 * Math.sin(a)); l.setAttribute('y2', 206 - r2 * Math.cos(a));
      l.setAttribute('stroke-width', big ? 3 : 1.6);
      g.appendChild(l);
    }
  })();
  function drawClock() {
    const d = new Date();
    const m = d.getMinutes() + d.getSeconds() / 60;
    const h = (d.getHours() % 12) + m / 60;
    $('hHour').setAttribute('transform', `rotate(${h * 30} 100 206)`);
    $('hMin').setAttribute('transform', `rotate(${m * 6} 100 206)`);
  }

  // ---------- 背景・小道・柵（画面サイズに合わせて描く） ----------
  function smoothHill(W, base, amp, seed) {
    const n = 6, pts = [];
    for (let k = 0; k <= n; k++) {
      const x = W * k / n;
      pts.push([x, base - amp * (0.55 + 0.45 * Math.sin(k * 1.7 + seed))]);
    }
    let d = `M0 ${base + 40} L0 ${pts[0][1]}`;
    for (let k = 0; k < n; k++) {
      const [x0, y0] = pts[k], [x1, y1] = pts[k + 1];
      d += ` C${x0 + (x1 - x0) / 2} ${y0} ${x0 + (x1 - x0) / 2} ${y1} ${x1} ${y1}`;
    }
    return d + ` L${W} ${base + 40} Z`;
  }
  function layoutScene() {
    const W = innerWidth, H = innerHeight, hz = Math.round(H * 0.3);
    const scene = $('scene');
    scene.setAttribute('viewBox', `0 0 ${W} ${H}`);
    // 小道：塔の扉 → 畑の入口
    const tw = $('tower'), ctm = tw.getScreenCTM();
    const pt = tw.createSVGPoint(); pt.x = 100; pt.y = 456;
    const door = pt.matrixTransform(ctm);
    const fr = $('farm').getBoundingClientRect();
    const gate = { x: fr.left + gateX(fr.width), y: fr.bottom - 8 };
    const pathD = `M${door.x} ${door.y - 4} C${door.x + 50} ${door.y + 14} ${gate.x - 40} ${gate.y + 30} ${gate.x} ${gate.y - 14}`;
    scene.innerHTML =
      `<rect width="${W}" height="${hz + 40}" fill="url(#g-sky)"/>` +
      `<g fill="#fffaf0" opacity=".75"><ellipse cx="${W * .18}" cy="${hz * .35}" rx="46" ry="13"/>` +
      `<ellipse cx="${W * .18 + 30}" cy="${hz * .35 - 8}" rx="26" ry="12"/>` +
      `<ellipse cx="${W * .62}" cy="${hz * .22}" rx="60" ry="14"/><ellipse cx="${W * .62 - 28}" cy="${hz * .22 - 9}" rx="28" ry="12"/></g>` +
      `<path d="${smoothHill(W, hz - 4, 46, 0.4)}" fill="#b9d3b0" opacity=".85"/>` +
      `<path d="${smoothHill(W, hz + 6, 30, 2.3)}" fill="#a3c58f"/>` +
      `<rect y="${hz + 4}" width="${W}" height="${H - hz}" fill="url(#g-grass)"/>` +
      `<rect y="${hz + 4}" width="${W}" height="${H - hz}" fill="url(#p-grass)"/>` +
      `<path d="${pathD}" stroke="#cbb488" stroke-width="34" fill="none" stroke-linecap="round"/>` +
      `<path d="${pathD}" stroke="url(#g-path)" stroke-width="27" fill="none" stroke-linecap="round"/>` +
      `<path d="${pathD}" stroke="#cdb68b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="2 22" opacity=".9"/>`;
    drawFence(fr.width, fr.height);
  }
  // 柵の入口（下辺の左寄り）
  const gateX = w => Math.max(60, w * 0.1);
  function drawFence(w, h) {
    const m = 8, gate = 22, gx = gateX(w);
    const rail = (d) => `<path d="${d}" stroke="#8c6542" stroke-width="5" fill="none" stroke-linecap="round"/>` +
      `<path d="${d}" stroke="#c4996a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    let s = '';
    for (const o of [-3, 3]) {
      const a = m + o, b = w - m - o, c = m + o, e = h - m - o;
      s += rail(`M${gx + gate} ${e} H${b} V${c} H${a} V${e} H${gx - gate}`);
    }
    const posts = [];
    const nx = Math.max(2, Math.round((w - 2 * m) / 46)), ny = Math.max(2, Math.round((h - 2 * m) / 46));
    for (let k = 0; k <= nx; k++) {
      const x = m + (w - 2 * m) * k / nx;
      posts.push([x, m]);
      if (Math.abs(x - gx) > gate + 10) posts.push([x, h - m]);
    }
    for (let k = 1; k < ny; k++) { const y = m + (h - 2 * m) * k / ny; posts.push([m, y], [w - m, y]); }
    posts.push([gx - gate, h - m], [gx + gate, h - m]);
    for (const [x, y] of posts) {
      s += `<rect x="${x - 5.5}" y="${y - 5.5}" width="11" height="11" rx="2.5" fill="#b78a5c" stroke="#7a5638" stroke-width="1.6"/>` +
        `<rect x="${x - 3.5}" y="${y - 3.5}" width="5" height="3" rx="1" fill="#d6b086"/>`;
    }
    const f = $('fence');
    f.setAttribute('viewBox', `0 0 ${w} ${h}`);
    f.innerHTML = s;
  }
  window.addEventListener('resize', layoutScene);

  // 表示更新専用（状態は減算しない。値は毎回 Date.now() との差分で計算）
  setInterval(render, 200);
  document.addEventListener('visibilitychange', render);
  window.addEventListener('pageshow', render);

  // ---------- 作物パレット ----------
  let selected = null;
  const pal = $('palette');
  const iconSvg = k => `<svg><use href="#${CROPS[k].icon}"/></svg>`;
  function buildPalette() {
    pal.innerHTML = '';
    for (const k of Object.keys(CROPS)) {
      const b = document.createElement('button');
      b.className = 'tool panel' + (selected === k ? ' sel' : '');
      b.innerHTML = iconSvg(k) + '<span>' + CROPS[k].name +
        '<small>' + (CROPS[k].growMs / 60000) + '分 / ' + CROPS[k].yield + '個</small></span>';
      b.onclick = () => { selected = selected === k ? null : k; buildPalette(); };
      pal.appendChild(b);
    }
  }
  buildPalette();

  // ---------- ポップアップ（空き区画タップ→作物選択） ----------
  const popup = $('popup');
  let popupPlot = -1;
  const row = $('popupRow');
  for (const k of Object.keys(CROPS)) {
    const b = document.createElement('button');
    b.className = 'tool panel'; b.innerHTML = iconSvg(k) + '<span>' + CROPS[k].name + '</span>';
    b.onclick = () => {
      const i = popupPlot; closePopup();
      selected = k; buildPalette();
      if (i >= 0 && plant(i, k)) render();
    };
    row.appendChild(b);
  }
  function openPopup(i) { popupPlot = i; popup.style.display = 'flex'; }
  function closePopup() { popup.style.display = 'none'; popupPlot = -1; }
  $('popupCancel').onclick = closePopup;
  popup.addEventListener('pointerdown', e => { if (e.target === popup) closePopup(); });

  // ---------- なぞり操作 ----------
  let mode = null, touched = new Set();
  function plotAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const pl = el && el.closest && el.closest('.plot');
    return pl ? +pl.dataset.i : -1;
  }
  function apply(i) {
    if (i < 0 || touched.has(i)) return;
    touched.add(i);
    const p = state.plots[i];
    if (mode === 'plant' && !p && selected) plant(i, selected);
    else if (mode === 'harvest' && p) harvest(i);
    render();
  }
  field.addEventListener('pointerdown', e => {
    const i = plotAt(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    const p = state.plots[i];
    touched = new Set();
    if (!p) {
      if (!selected) { openPopup(i); mode = null; return; }
      mode = 'plant';
    } else if (isReady(p, now())) mode = 'harvest';
    else { mode = null; return; }
    apply(i);
  });
  field.addEventListener('pointermove', e => {
    if (!mode) return;
    apply(plotAt(e.clientX, e.clientY));
  });
  const end = () => { mode = null; touched = new Set(); };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  field.addEventListener('contextmenu', e => e.preventDefault());

  layoutScene();
  render();
  save();
})();
</script>
</body>
</html>
