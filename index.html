<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときの種</title>
<style>
  :root{
    --sky:#bfe6f5; --grass:#8fcf72; --grass2:#7bc05f; --soil:#8a5a35; --soil2:#6f4627;
    --ink:#3b2a1a; --panel:#fff8e6; --accent:#f2a93b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    background:linear-gradient(var(--sky) 0 38%,var(--grass) 38% 100%)}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px}
  h1{margin:0;font-size:20px;letter-spacing:.1em}
  #warehouse{display:flex;gap:10px;background:var(--panel);border:3px solid var(--soil);
    border-radius:14px;padding:6px 12px;font-weight:bold;font-size:18px}
  #warehouse span.lbl{font-size:12px;display:block;line-height:1}
  .stock{display:flex;align-items:center;gap:4px}
  #fastBadge{background:#d33;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;display:none}
  main{flex:1;display:flex;min-height:0;padding:0 16px 8px;gap:16px}
  #plaza{flex:0 0 28%;position:relative;border-radius:16px;
    background:radial-gradient(ellipse at 50% 80%,#d9c7a0 0 55%,transparent 56%)}
  #tower{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:44%;max-width:150px;
    aspect-ratio:1/2.4;background:#c9b48e;border:4px solid #8c7447;border-radius:6px 6px 0 0}
  #tower::before{content:"";position:absolute;left:-12%;right:-12%;top:-26%;height:28%;
    background:#b8473a;clip-path:polygon(50% 0,100% 100%,0 100%)}
  #tower::after{content:"";position:absolute;left:50%;top:14%;width:56%;aspect-ratio:1;
    transform:translateX(-50%);border-radius:50%;background:#fffdf0;border:4px solid #8c7447;
    background-image:linear-gradient(#3b2a1a,#3b2a1a),linear-gradient(#3b2a1a,#3b2a1a);
    background-size:3px 36%,28% 3px;background-position:50% 50%,50% 50%;background-repeat:no-repeat}
  #plazaLabel{position:absolute;bottom:2%;width:100%;text-align:center;font-size:12px;opacity:.6}
  #field{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    gap:12px;background:var(--grass2);border:4px solid #5a8f44;border-radius:18px;padding:14px;min-height:0}
  .plot{position:relative;background:var(--soil);border:4px solid var(--soil2);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
    touch-action:none}
  .plot.empty{background:repeating-linear-gradient(0deg,var(--soil) 0 10px,#7d5030 10px 12px)}
  .plot.ready{box-shadow:0 0 0 4px #ffe36a inset;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px #fff2a0 inset}}
  .icon{line-height:1;transition:font-size .3s}
  .st1 .icon{font-size:clamp(26px,5vw,40px)}
  .st2 .icon{font-size:clamp(40px,8vw,64px)}
  .st3 .icon{font-size:clamp(54px,11vw,90px)}
  .hint{font-size:12px;opacity:.7;color:#f4e2c4}
  .gauge{position:absolute;left:10%;right:10%;bottom:8px;height:10px;background:#0004;border-radius:6px;overflow:hidden}
  .gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8be05a,#e9f55a)}
  .stlabel{position:absolute;top:6px;left:8px;font-size:11px;background:#fff8;border-radius:6px;padding:1px 6px}
  footer{display:flex;justify-content:center;gap:14px;padding:6px 16px 12px}
  .tool{background:var(--panel);border:4px solid var(--soil);border-radius:14px;padding:8px 18px;
    font-size:18px;font-weight:bold;font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation}
  .tool small{display:block;font-size:11px;font-weight:normal}
  .tool.sel{border-color:var(--accent);background:#ffe9b0;transform:translateY(-3px)}
  #popup{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10}
  #popup .box{background:var(--panel);border-radius:18px;padding:18px 22px;text-align:center;border:4px solid var(--soil)}
  #popup .row{display:flex;gap:14px;margin:12px 0}
  #popup .cancel{background:none;border:none;font-size:14px;text-decoration:underline;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌱 ときの種 <span id="fastBadge"></span></h1>
    <div id="warehouse" aria-label="倉庫">
      <div>倉庫</div>
      <div class="stock">🌾 <span id="sWheat">0</span></div>
      <div class="stock">🥕 <span id="sCarrot">0</span></div>
    </div>
  </header>
  <main>
    <div id="plaza"><div id="tower"></div><div id="plazaLabel">ひろば</div></div>
    <div id="field"></div>
  </main>
  <footer id="palette"></footer>
</div>
<div id="popup"><div class="box">
  <div>なにを植える？</div>
  <div class="row" id="popupRow"></div>
  <button class="cancel" id="popupCancel">やめる</button>
</div></div>

<script>
(() => {
  'use strict';
  const SAVE_KEY = 'clockseed.save';
  const SAVE_VERSION = 1;
  const PLOT_COUNT = 6;

  // デバッグ：?fast=N で育成時間をN分の1に
  const FAST = (() => {
    const v = parseFloat(new URLSearchParams(location.search).get('fast'));
    return isFinite(v) && v > 0 ? v : 1;
  })();

  // 作物データ（チェーン表 v0.1）
  const CROPS = {
    wheat:  { name: '小麦',   icon: '🌾', growMs: 2 * 60 * 1000, yield: 3 },
    carrot: { name: 'にんじん', icon: '🥕', growMs: 4 * 60 * 1000, yield: 3 },
  };

  // ---------- セーブ ----------
  function freshState() {
    return { saveVersion: SAVE_VERSION, plots: Array(PLOT_COUNT).fill(null),
             storage: { wheat: 0, carrot: 0 } };
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshState();
      const d = JSON.parse(raw);
      if (!d || typeof d.saveVersion !== 'number') return freshState();
      const s = freshState();
      for (let i = 0; i < PLOT_COUNT; i++) {
        const p = d.plots && d.plots[i];
        if (p && CROPS[p.crop] && isFinite(p.plantedAt) && isFinite(p.readyAt)) {
          s.plots[i] = { crop: p.crop, plantedAt: p.plantedAt, readyAt: p.readyAt };
        }
      }
      for (const k of Object.keys(CROPS)) {
        const n = d.storage && d.storage[k];
        s.storage[k] = Number.isInteger(n) && n >= 0 ? n : 0;
      }
      return s;
    } catch (e) { return freshState(); }
  }
  let state = load();
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- ロジック（常に現在時刻との差分で判定） ----------
  const now = () => Date.now();
  function progress(p, t) {           // 0..1
    const total = p.readyAt - p.plantedAt;
    if (total <= 0) return 1;
    return Math.min(1, Math.max(0, (t - p.plantedAt) / total));
  }
  const isReady = (p, t) => !!p && t >= p.readyAt;
  function plant(i, crop) {
    if (state.plots[i] || !CROPS[crop]) return false;
    const t = now();
    state.plots[i] = { crop, plantedAt: t, readyAt: t + CROPS[crop].growMs / FAST };
    save(); return true;
  }
  function harvest(i) {
    const p = state.plots[i];
    if (!p || !isReady(p, now())) return false;
    state.storage[p.crop] += CROPS[p.crop].yield;
    state.plots[i] = null;
    save(); return true;
  }

  // ---------- 画面 ----------
  const $ = id => document.getElementById(id);
  const field = $('field');
  const plotEls = [];
  for (let i = 0; i < PLOT_COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'plot empty'; el.dataset.i = i;
    el.innerHTML = '<div class="icon"></div><div class="hint">あき</div>' +
      '<div class="stlabel" style="display:none"></div><div class="gauge" style="display:none"><i></i></div>';
    field.appendChild(el); plotEls.push(el);
  }
  if (FAST !== 1) { const b = $('fastBadge'); b.style.display = 'inline'; b.textContent = '×' + FAST + ' DEBUG'; }

  function render() {
    const t = now();
    state.plots.forEach((p, i) => {
      const el = plotEls[i];
      const icon = el.children[0], hint = el.children[1], lab = el.children[2], g = el.children[3];
      if (!p) {
        el.className = 'plot empty'; icon.textContent = ''; hint.style.display = '';
        lab.style.display = 'none'; g.style.display = 'none'; return;
      }
      const c = CROPS[p.crop], pr = progress(p, t);
      let st, glyph, text;
      if (t >= p.readyAt) { st = 3; glyph = c.icon; text = '収穫できる！'; }
      else if (pr >= 0.5) { st = 2; glyph = '🌿'; text = '成長中'; }
      else { st = 1; glyph = '🌱'; text = '芽'; }
      el.className = 'plot st' + st + (st === 3 ? ' ready' : '');
      icon.textContent = glyph; hint.style.display = 'none';
      lab.style.display = ''; lab.textContent = c.name + '：' + text;
      g.style.display = st === 3 ? 'none' : '';
      g.firstElementChild.style.width = (pr * 100).toFixed(1) + '%';
    });
    $('sWheat').textContent = state.storage.wheat;
    $('sCarrot').textContent = state.storage.carrot;
  }
  // 表示更新専用（状態は減算しない。値は毎回 Date.now() との差分で計算）
  setInterval(render, 200);
  document.addEventListener('visibilitychange', render);
  window.addEventListener('pageshow', render);

  // ---------- 作物パレット ----------
  let selected = null;
  const pal = $('palette');
  function buildPalette() {
    pal.innerHTML = '';
    for (const k of Object.keys(CROPS)) {
      const b = document.createElement('button');
      b.className = 'tool' + (selected === k ? ' sel' : '');
      b.innerHTML = CROPS[k].icon + ' ' + CROPS[k].name +
        '<small>' + (CROPS[k].growMs / 60000) + '分 / ' + CROPS[k].yield + '個</small>';
      b.onclick = () => { selected = selected === k ? null : k; buildPalette(); };
      pal.appendChild(b);
    }
  }
  buildPalette();

  // ---------- ポップアップ（空き区画タップ→作物選択） ----------
  const popup = $('popup');
  let popupPlot = -1;
  const row = $('popupRow');
  for (const k of Object.keys(CROPS)) {
    const b = document.createElement('button');
    b.className = 'tool'; b.innerHTML = CROPS[k].icon + ' ' + CROPS[k].name;
    b.onclick = () => {
      const i = popupPlot; closePopup();
      selected = k; buildPalette();
      if (i >= 0 && plant(i, k)) render();
    };
    row.appendChild(b);
  }
  function openPopup(i) { popupPlot = i; popup.style.display = 'flex'; }
  function closePopup() { popup.style.display = 'none'; popupPlot = -1; }
  $('popupCancel').onclick = closePopup;
  popup.addEventListener('pointerdown', e => { if (e.target === popup) closePopup(); });

  // ---------- なぞり操作 ----------
  let mode = null, touched = new Set();
  function plotAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const pl = el && el.closest && el.closest('.plot');
    return pl ? +pl.dataset.i : -1;
  }
  function apply(i) {
    if (i < 0 || touched.has(i)) return;
    touched.add(i);
    const p = state.plots[i];
    if (mode === 'plant' && !p && selected) plant(i, selected);
    else if (mode === 'harvest' && p) harvest(i);
    render();
  }
  field.addEventListener('pointerdown', e => {
    const i = plotAt(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    const p = state.plots[i];
    touched = new Set();
    if (!p) {
      if (!selected) { openPopup(i); mode = null; return; }
      mode = 'plant';
    } else if (isReady(p, now())) mode = 'harvest';
    else { mode = null; return; }
    apply(i);
  });
  field.addEventListener('pointermove', e => {
    if (!mode) return;
    apply(plotAt(e.clientX, e.clientY));
  });
  const end = () => { mode = null; touched = new Set(); };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  field.addEventListener('contextmenu', e => e.preventDefault());

  render();
  save();
})();
</script>
</body>
</html>
