<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ときの種</title>
<style>
  :root{
    --ink:#4a3322; --ink-soft:#8a6a4c;
    --frame:#5a3a22; --panel:#f6ead0; --panel-hi:#fffaf0; --panel-lo:#dcc59c;
    --sel:#ffe3a0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#2f4a2c;color:var(--ink);
    font-family:"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;touch-action:none}
  #world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #world.grabbing{cursor:grabbing}
  img.px{image-rendering:pixelated;image-rendering:crisp-edges}

  /* ドット絵風の枠（角を欠いた4px線） */
  .pix{background:var(--panel);margin:4px;
    box-shadow:0 -4px 0 0 var(--frame),0 4px 0 0 var(--frame),-4px 0 0 0 var(--frame),4px 0 0 0 var(--frame),
      inset 0 4px 0 0 var(--panel-hi),inset 0 -4px 0 0 var(--panel-lo),0 8px 0 0 #0003}

  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud > *{pointer-events:auto}
  #topbar{position:absolute;top:8px;left:12px;right:12px;display:flex;align-items:center;gap:12px}
  #title{padding:4px 12px;font-size:20px;font-weight:bold;letter-spacing:.14em;display:flex;align-items:center;gap:8px;white-space:nowrap}
  #title img{width:24px;height:24px}
  #fastBadge{background:#b8503c;color:#fff4e4;padding:1px 6px;font-size:11px;letter-spacing:.05em;display:none}
  #town{margin-right:auto;display:flex;align-items:center;gap:8px;padding:4px 12px;font-weight:bold;font-size:17px;white-space:nowrap}
  #expBar{display:block;width:84px;height:12px;background:#5a3a22;padding:2px}
  #expFill{display:block;height:100%;width:0;background:#7fc24a;box-shadow:inset 0 -3px 0 #5c9c36,inset 0 2px 0 #b6e07a}
  #expText{font-size:13px;color:var(--ink-soft);min-width:42px}
  #gold{display:flex;align-items:center;gap:6px;padding:4px 14px;font-weight:bold;font-size:20px}
  #gold img{width:26px;height:26px}
  #warehouse{display:flex;align-items:center;gap:9px;padding:4px 12px;font-weight:bold;font-size:18px;
    border:0;font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  #warehouse .ttl{font-size:13px;color:var(--ink-soft);letter-spacing:.12em}
  .stock{display:flex;align-items:center;gap:4px}
  .stock img{width:26px;height:26px}

  #palette{bottom:12px;left:0;right:0;display:flex;gap:10px;flex-wrap:nowrap;justify-content:center;pointer-events:none}
  #palette > *{pointer-events:auto}
  #variantBar{position:fixed;bottom:66px;left:0;right:0;display:none;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none;z-index:5}
  #variantBar > *{pointer-events:auto}
  .vbtn{padding:3px 10px 3px 6px;font-size:14px;gap:5px}
  .vbtn img{width:24px;height:24px}
  .vbtn small{display:block;font-size:10px;opacity:.8}
  #popup .vlabel{font-size:13px;color:#7a5a30;margin-top:4px;text-align:center}
  #popup #popupVar{margin:6px 0 8px;gap:8px}
  .onote{font-size:13px;padding:6px 10px;margin:4px 0;border-radius:6px;background:#f6ecd0;display:flex;align-items:center;gap:6px}
  .onote img{width:22px;height:22px}
  .onote.forecast{background:#e4eef6;color:#2f4a66}
  .onote.boost{background:#f8e0c8;color:#7a3e12}
  .orow.peddler{background:#fbe8b8;outline:2px solid #d8a040}
  .ptag{background:#c0702a;color:#fff;font-size:11px;padding:1px 5px;border-radius:4px;margin-right:4px}
  .vtag{background:#7c62d8;color:#fff;font-size:10px;padding:0 4px;border-radius:4px;margin-left:4px}
  .dexbuff{font-size:12px;color:#7a5a30;margin:2px 0 6px}
  .sbtns .keeper{background:#e8dcff}
  #palette .tool span,#warehouse .ttl,.stock{white-space:nowrap}
  #warehouse.compact{gap:6px;font-size:15px;padding:4px 10px}
  #warehouse.compact .stock{gap:2px}
  #warehouse.compact .stock img{width:20px;height:20px}
  #palette .tool{padding:4px 12px 4px 8px;font-size:16px;gap:6px}
  #palette .tool img{width:30px;height:30px}
  #popup .row{flex-wrap:wrap;justify-content:center}
  .tool{font-family:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;border:0;
    padding:6px 16px 6px 10px;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;
    transition:transform .12s}
  .tool img{width:36px;height:36px}
  .tool small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft);text-align:left}
  .tool.sel{background:var(--sel);transform:translateY(-5px)}
  .tool.locked{opacity:.55;cursor:default;filter:grayscale(.6)}
  .tool:disabled{cursor:default}
  .tool.act{padding:8px 16px;min-width:96px;justify-content:center;font-size:17px}
  .tool.act:disabled{opacity:.6;background:#e5d6b6;color:var(--ink-soft)}
  .tool.small{padding:5px 12px;font-size:15px}

  .overlay{position:fixed;inset:0;background:#2a1a1040;display:none;align-items:center;justify-content:center;z-index:10}
  .overlay .box{padding:14px 22px;text-align:center;max-width:94vw;max-height:88vh;overflow:auto}
  .overlay .q{font-weight:bold;letter-spacing:.1em}
  #popup .row{display:flex;gap:16px;margin:14px 0 8px}
  .overlay .cancel{background:none;border:none;font-size:14px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;font-family:inherit}
  .panelhd{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:10px}
  .panelhd b{font-size:20px;letter-spacing:.14em}
  .panelhd button{font-family:inherit;font-size:20px;color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:0 6px}
  .orow{display:flex;align-items:center;gap:16px;padding:8px 6px;border-top:3px dotted #c9ad7c;text-align:left}
  .orow:first-child{border-top:0}
  .ocrop{display:flex;align-items:center;gap:8px;flex:1;min-width:190px;font-weight:bold;font-size:19px}
  .ocrop img{width:36px;height:36px}
  .ocrop small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .orew{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:bold;min-width:120px}
  .orew span{display:flex;align-items:center;gap:4px}
  .orew img{width:18px;height:18px}
  .orew .xp{color:#4c8a34}
  .wrow{display:flex;align-items:center;gap:14px;padding:8px 6px;border-top:3px dotted #c9ad7c;text-align:left}
  .wrow:first-child{border-top:0}
  .wrow .nm{display:flex;align-items:center;gap:8px;min-width:170px;font-weight:bold;font-size:19px}
  .wrow .nm img{width:34px;height:34px}
  .wrow .nm small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .wrow .cnt{min-width:64px;font-size:20px;font-weight:bold;text-align:right}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .pgauge{height:18px;background:#5a3a22;padding:3px;margin:8px 0 4px;min-width:280px}
  .pgauge i{display:block;height:100%;width:0;background:#f2d27a;box-shadow:inset 0 -3px 0 #d9b24c,inset 0 2px 0 #fff0b0}
  .mline{margin:6px 0;font-size:17px;font-weight:bold;text-align:left}
  .mline.sub{font-size:14px;font-weight:normal;color:var(--ink-soft)}
  .mline img{width:22px;height:22px;vertical-align:middle}
  .mrow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:3px dotted #c9ad7c;text-align:left;flex-wrap:wrap}
  .mrow .recipe{display:flex;align-items:center;gap:8px;flex:1;min-width:250px;font-weight:bold;font-size:16px}
  .mrow .recipe img{width:30px;height:30px}
  .mrow .recipe small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft)}
  .mrow .short{color:#b8503c}
  .mact{margin-top:10px;display:flex;justify-content:center}
  #subHud{position:absolute;top:66px;left:12px;display:flex;gap:6px;align-items:flex-start}
  #drillHud,#dexHud{display:flex;align-items:center;gap:12px;padding:3px 12px;font-weight:bold;font-size:15px;
    cursor:pointer;border:0;font-family:inherit;color:inherit;touch-action:manipulation}
  #drillHud span,#dexHud span{display:flex;align-items:center;gap:4px}
  #drillHud img,#dexHud img{width:20px;height:20px}
  #drillHud.pulse{animation:hudpulse .6s ease-out}
  @keyframes hudpulse{40%{background:#fff0b8;transform:scale(1.06)}}
  .dbox{width:min(700px,95vw)}
  .dstat{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:14px;font-weight:bold;margin-bottom:10px}
  .dstat span{display:flex;align-items:center;gap:4px}
  .dstat img{width:20px;height:20px}
  .lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 4px 10px}
  .lvbtn{flex-direction:column;padding:8px 4px;gap:2px;justify-content:center;font-size:13px}
  .lvbtn b{font-size:28px;line-height:1}
  .lvbtn small{font-size:10px;text-align:center}
  .tstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:12px;color:var(--ink-soft);text-align:left;margin:4px 8px 12px}
  .tstats span{display:flex;justify-content:space-between}
  .tstats b{color:var(--ink)}
  .dacts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .dq-head{display:flex;align-items:center;gap:10px;font-weight:bold;justify-content:space-between;font-size:15px}
  .lvtag{background:#5a3a22;color:#fff6e0;padding:1px 8px;margin-right:4px}
  .pips{display:flex;gap:6px}
  .pips i{width:14px;height:14px;background:#d8c39a;display:block;box-shadow:inset 0 -3px 0 #0001}
  .pips i.ok{background:#7fc24a}.pips i.ng{background:#d0705a}.pips i.cur{background:#f2d27a}
  .dq-prompt{font-size:28px;font-weight:bold;margin:16px 4px 8px;letter-spacing:.03em;min-height:42px;line-height:1.35}
  .dq-vis{display:flex;justify-content:center;margin-bottom:4px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 4px 0}
  .choice{font-size:24px;padding:10px;justify-content:center;min-height:62px}
  .choice.ok{background:#cdeaa8}.choice.ng{background:#f3c2b4}
  .choice:disabled{cursor:default}
  .dfb{min-height:46px;margin-top:12px;font-weight:bold;position:relative}
  .fly{position:absolute;left:50%;top:6px;transform:translateX(-50%);color:#3f7d2c;font-size:22px;animation:fly 1s ease-out forwards;white-space:nowrap}
  @keyframes fly{from{opacity:1;transform:translate(-50%,6px)}to{opacity:0;transform:translate(-50%,-34px)}}
  .spark{position:absolute;left:50%;top:18px;width:6px;height:6px;background:#ffd85a;animation:spark .7s ease-out forwards;pointer-events:none}
  @keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy))}}
  .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.82em;margin:0 3px}
  .fr span:first-child{border-bottom:2px solid currentColor;padding:0 3px 2px}
  .fr span:last-child{padding-top:2px}
  .dres{font-size:18px;font-weight:bold;line-height:2;margin:6px 0 8px}
  .dres img{width:22px;height:22px;vertical-align:middle}
  .dres .big{font-size:30px}
  .sbox{width:min(780px,96vw)}
  .shead{display:flex;gap:18px;justify-content:center;font-weight:bold;margin-bottom:6px;flex-wrap:wrap}
  .shead span{display:flex;align-items:center;gap:4px}
  .shead img{width:20px;height:20px}
  .srow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-top:3px dotted #c9ad7c;text-align:left}
  .srow:first-child{border-top:0}
  .srow > img{width:34px;height:34px}
  .sinfo{flex:1;min-width:170px}
  .sinfo b{font-size:16px}
  .sinfo small{display:block;font-size:12px;color:var(--ink-soft)}
  .sinfo .rush{color:#b8503c;font-weight:bold}
  .sg{height:8px;background:#5a3a22;padding:2px;margin:3px 0}
  .sg i{display:block;height:100%;width:0;background:#f2d27a}
  .sbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:340px}
  .sbtns .tool{padding:4px 10px;font-size:14px;flex-direction:column;gap:0;min-width:66px}
  .sbtns .tool small{font-size:10px;text-align:center}
  .sempty{padding:20px;color:var(--ink-soft)}
  /* レア度の色：C コモン／R レア／SR／UR 激レア */
  :root{--rC:#a89a7c;--rR:#4f86d6;--rSR:#9a63d6;--rUR:#e0a21c}
  .rtag{display:inline-block;font-size:11px;font-weight:bold;color:#fff;padding:0 7px;letter-spacing:.05em;vertical-align:middle}
  .rtag.C{background:var(--rC)}.rtag.R{background:var(--rR)}.rtag.SR{background:var(--rSR)}.rtag.UR{background:linear-gradient(90deg,#e0a21c,#f4cf5a,#e0a21c)}
  .gbox{margin:10px 4px 4px;padding:10px;background:#efe0bd;box-shadow:inset 0 0 0 2px #fff8e4;text-align:center}
  .gbox b{letter-spacing:.1em}
  .gpity{font-size:11px;color:var(--ink-soft);margin:4px 0 8px}
  .gbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .gbtns .tool{flex-direction:column;gap:0;padding:6px 20px;font-size:17px}
  .gbtns .tool small{font-size:11px}
  .gcard{position:relative;background:#fff8e4;border:4px solid var(--rC);padding:10px 8px 8px;text-align:center;animation:gpop .35s ease-out}
  .gcard.r-R{border-color:var(--rR)}.gcard.r-SR{border-color:var(--rSR);background:#f6f0ff}
  .gcard.r-UR{border-color:var(--rUR);background:#fff4cf;animation:gpop .35s ease-out,gglow 1.4s ease-in-out .35s infinite}
  @keyframes gpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes gglow{50%{box-shadow:0 0 14px 3px #ffd85acc}}
  .gcard .gic{width:48px;height:48px;display:block;margin:4px auto}
  .gcard .gname{font-weight:bold}
  .gcard .gfx{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
  .gcard .gcat{font-size:10px;color:var(--ink-soft)}
  .gnew{display:inline-block;background:#d9503a;color:#fff;font-weight:bold;font-size:12px;padding:0 6px;margin-right:4px;animation:gnew 1s ease-in-out infinite}
  @keyframes gnew{50%{transform:scale(1.12)}}
  .gdup{font-size:11px;color:#3f7d2c;font-weight:bold;margin-top:3px}
  .gcard.big{width:min(320px,80vw);margin:12px auto;padding:14px 12px}
  .gcard.big .gic{width:84px;height:84px}
  .gcard.big .gname{font-size:24px}
  .gcard.big .gfx{font-size:14px}
  .gdex{font-size:13px;font-weight:bold;color:#3f7d2c;margin-top:6px}
  .ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
  .ggrid .gcard{padding:6px 3px;border-width:3px}
  .ggrid .gname{font-size:12px}
  .ggrid .gic{width:34px;height:34px}
  .ggrid .gnew{font-size:10px;padding:0 4px;margin:0}
  .gsum{font-size:13px;line-height:1.7;margin:4px 0 6px}
  .dexbox{width:min(820px,96vw)}
  .dexhead{display:flex;justify-content:center;gap:16px;align-items:center;font-weight:bold;margin-bottom:6px;flex-wrap:wrap}
  .dexrate{font-size:22px}
  .dexbar{width:160px;height:12px;background:#5a3a22;padding:2px}
  .dexbar i{display:block;height:100%;background:#7fc24a}
  .dextabs{display:flex;gap:8px;justify-content:center;margin:6px 4px 10px;flex-wrap:wrap}
  .dextabs .tool{padding:4px 14px;font-size:15px;gap:6px}
  .dexgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:46vh;overflow:auto;padding:2px 4px}
  .dexcard{display:flex;align-items:center;gap:10px;background:#fff8e4;border-left:6px solid var(--rC);padding:6px 8px;text-align:left}
  .dexcard.r-R{border-left-color:var(--rR)}.dexcard.r-SR{border-left-color:var(--rSR)}.dexcard.r-UR{border-left-color:var(--rUR)}
  .dexcard img{width:36px;height:36px;flex:none}
  .dexcard.unk{background:#e6dcc3;color:#8a7a5c}
  .dexcard.unk img{filter:brightness(0) opacity(.35)}
  .dexcard .dn{font-weight:bold;font-size:15px}
  .dexcard .df{font-size:11px;color:var(--ink-soft);line-height:1.35}
  .dexcard .dc{font-size:12px;font-weight:bold;color:#3f7d2c}
  .dexcard .dinfo{flex:1;min-width:0}
  .dexcard .tool{padding:3px 10px;font-size:13px}
  .dexfoot{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .rrbtn{padding:3px 8px;font-size:12px;min-width:0}
  #toast{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:12;display:none;padding:8px 18px;
    font-weight:bold;letter-spacing:.06em;pointer-events:none}
</style>
</head>
<body>
<canvas id="world" aria-label="ときの種の町（畑と時計塔）"></canvas>

<div class="hud" style="inset:0">
  <div id="topbar">
    <div id="title" class="pix"><img class="px" data-icon="ic_sprout" alt="">ときの種<span id="fastBadge"></span></div>
    <div id="town" class="pix" title="町レベル"><span id="lvText">町Lv1</span><span id="expBar"><i id="expFill"></i></span><span id="expText">0/30</span></div>
    <div id="gold" class="pix" title="ゴールド"><img class="px" data-icon="ic_gold" alt="ゴールド"><span id="sGold">0</span></div>
    <button id="warehouse" class="pix" aria-label="倉庫（タップで売却パネルを開く）">
      <span class="ttl">倉庫</span>
      <span id="stocks" style="display:contents"></span>
    </button>
  </div>
  <div id="palette" style="position:absolute"></div>
  <div id="variantBar"></div>
  <div id="subHud">
    <button id="drillHud" class="pix" title="時計塔のドリル（時短ストック・カケラ・即完了チケット）">
      <span><img class="px" data-icon="ic_hourglass" alt="時短"><span id="dhStock">0:00</span></span>
      <span><img class="px" data-icon="ic_shard" alt="カケラ"><span id="dhShards">0</span></span>
      <span><img class="px" data-icon="ic_ticket" alt="チケット"><span id="dhTickets">0</span></span>
    </button>
    <button id="dexHud" class="pix" title="図鑑（変種の種・町の飾り・お手伝い・消耗品）">
      <span><img class="px" data-icon="ic_book" alt="図鑑">図鑑 <span id="dexHudNum">0/50</span></span>
    </button>
  </div>
</div>
<div id="popup" class="overlay"><div class="box pix">
  <div class="q">なにを植える？</div>
  <div class="row" id="popupRow"></div>
  <div id="popupVarWrap" style="display:none"><div class="vlabel">変種（ガチャで解放した種）</div><div class="row" id="popupVar"></div></div>
  <button class="cancel" id="popupCancel">やめる</button>
</div></div>
<div id="ordersPanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b>注文掲示板</b><button id="ordersClose" aria-label="閉じる">×</button></div>
  <div id="orderList"></div>
  <div class="hint">納品すると倉庫から作物を消費し、ゴールドと町経験値がもらえます（報酬ゴールド＝単価×個数×1.3）</div>
</div></div>
<div id="warehousePanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b>倉庫</b><button id="warehouseClose" aria-label="閉じる">×</button></div>
  <div id="warehouseList"></div>
  <div class="hint">生のまま売ると単価どおりのゴールドになります</div>
</div></div>
<div id="facPanel" class="overlay"><div class="box pix">
  <div class="panelhd"><b id="facTitle">製粉所</b><button id="facClose" aria-label="閉じる">×</button></div>
  <div id="facBody"></div>
</div></div>
<div id="drillPanel" class="overlay"><div class="box pix dbox">
  <div class="panelhd"><b id="drillTitle">時計塔のドリル</b><button id="drillClose" aria-label="閉じる">×</button></div>
  <div id="drillBody"></div>
</div></div>
<div id="skipPanel" class="overlay"><div class="box pix sbox">
  <div class="panelhd"><b>時短ストックを使う</b><button id="skipClose" aria-label="閉じる">×</button></div>
  <div id="skipHead"></div>
  <div id="skipList"></div>
  <div class="hint">元の所要時間の75%までは ストック1秒＝1秒短縮。残りが25%を切ると追い込み区間で、ストック2秒＝1秒短縮。即完了チケットはストックを使わずに1件を即完了します</div>
</div></div>
<div id="dexPanel" class="overlay"><div class="box pix dexbox">
  <div class="panelhd"><b>図鑑</b><button id="dexClose" aria-label="閉じる">×</button></div>
  <div id="dexBody"></div>
</div></div>
<div id="toast" class="pix"></div>

<script id="drill-engine">
/* ===================================================================
   ときの種：ドリルエンジン（問題の自動生成）
   - DOM・ゲーム状態に触れない純粋な関数だけで書く（window.ClockseedDrill を公開するだけ）
   - 乱数は引数 rng（0以上1未満を返す関数）で受け取る。本体は Math.random、テストは固定シード
   - 検証は tests/drill_engine_test.js が、この <script> だけを取り出して別実装で再計算して行う
   出題 = { type, level, prompt, visual, choices:[{label,key}]×4, answer:正解の位置, params }
     key は「値」を表す正規化文字列（同じ値なら同じ key）。重複・偶然の正解の判定に使う
   =================================================================== */
(function (root) {
  'use strict';
  const ri = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const pick = (rng, a) => a[Math.floor(rng() * a.length)];
  const nz = (rng, lo, hi) => { let v; do { v = ri(rng, lo, hi); } while (v === 0); return v; };
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
  const lcm = (a, b) => a / gcd(a, b) * b;
  const MINUS = '−';
  const sn = n => (n < 0 ? MINUS + (-n) : String(n));             // 負号は全角マイナス
  const par = n => (n < 0 ? '(' + sn(n) + ')' : String(n));        // 負の数はかっこ書き

  // ---- 選択肢の型（label＝表示、key＝値、v＝数値チェック用） ----
  const num = (n, unit = '') => ({ label: sn(n) + unit, key: 'n:' + n, v: n });
  const xeq = n => ({ label: 'x = ' + sn(n), key: 'n:' + n, v: n });
  const frac = (p, q) => {                                          // 常に約分した形で表示・比較
    const g = gcd(p, q) || 1; p /= g; q /= g; if (q < 0) { p = -p; q = -q; }
    return { label: q === 1 ? sn(p) : sn(p) + '/' + q, key: 'f:' + p + '/' + q, v: p / q };
  };
  const hund = h => {                                               // 小数は100倍の整数で持つ
    const neg = h < 0, a = Math.abs(h), i = Math.floor(a / 100), f = a % 100;
    let s = String(i); if (f) s += '.' + String(f).padStart(2, '0').replace(/0$/, '');
    return { label: (neg ? MINUS : '') + s, key: 'd:' + h, v: h };
  };
  const time = (h, m) => ({ label: m === 0 ? h + '時' : h + '時' + m + '分', key: 't:' + h + ':' + m, v: h * 60 + m });
  const word = w => ({ label: w, key: 's:' + w, v: 0 });
  const expr = (c, d) => {                                          // 一次式 cx + d
    let s = c === 1 ? 'x' : c === -1 ? MINUS + 'x' : sn(c) + 'x';
    if (d > 0) s += ' + ' + d; else if (d < 0) s += ' ' + MINUS + ' ' + (-d);
    return { label: s, key: 'e:' + c + ',' + d, v: c, c, d };
  };
  const terms = arr => arr.map(([c, isX], i) => {                   // 項の並びを式の文字列に
    const a = Math.abs(c), body = isX ? (a === 1 ? 'x' : a + 'x') : String(a);
    return i === 0 ? (c < 0 ? MINUS + body : body) : (c < 0 ? ' ' + MINUS + ' ' : ' + ') + body;
  }).join('');
  // 補充用：正解の近くの値（±1, ±2, ±10, …）
  const NEAR = [1, -1, 2, -2, 10, -10, 3, -3, 5, -5, 20, -20, 4, -4];
  const near = k => NEAR[(k - 1) % NEAR.length] * (1 + Math.floor((k - 1) / NEAR.length));

  // 正解1つ＋誤答3つを組み立てる。誤答はまず「典型的なミス」から、足りなければ近い値で補う。
  // 同じ値（key）・同じ表示（label）・正解と同じ値の候補は捨てる。正解の位置は一様に散らす。
  function build(rng, type, level, prompt, ans, mistakes, fill, params, visual, ok) {
    const keys = new Set([ans.key]), labels = new Set([ans.label]), out = [];
    const take = c => {
      if (!c || out.length >= 3 || keys.has(c.key) || labels.has(c.label)) return;
      if (typeof c.v === 'number' && !isFinite(c.v)) return;
      if (ok && !ok(c)) return;
      keys.add(c.key); labels.add(c.label); out.push(c);
    };
    mistakes.forEach(take);
    for (let k = 1; out.length < 3 && k < 400; k++) take(fill(k));
    if (out.length < 3) throw new Error('誤答が作れない: ' + type);
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    const pos = Math.floor(rng() * 4), choices = out.map(c => ({ label: c.label, key: c.key }));
    choices.splice(pos, 0, { label: ans.label, key: ans.key });
    return { type, level, prompt, visual: visual || null, choices, answer: pos, params };
  }
  const pos = c => c.v > 0;

  const T = {};
  // ================= A：算数（低中） =================
  T.A1 = { level: 'A', name: '2けたのたし算', gen(rng) {
    const a = ri(rng, 10, 99), b = ri(rng, 10, 99), s = a + b, carry = (a % 10) + (b % 10) >= 10;
    return build(rng, 'A1', 'A', a + ' + ' + b + ' = ?', num(s),
      [carry ? num(s - 10) : null, num(s + 10), num(s + 1), num(s - 1)],        // 繰り上がり忘れ／余計な繰り上がり／一の位のミス
      k => num(s + near(k)), { a, b }, null, pos);
  } };
  T.A2 = { level: 'A', name: '2けたのひき算', gen(rng) {
    const a = ri(rng, 20, 99), b = ri(rng, 10, a - 1), d = a - b, borrow = (a % 10) < (b % 10);
    const swapDigit = (Math.floor(a / 10) - Math.floor(b / 10)) * 10 + Math.abs(a % 10 - b % 10);   // 一の位を大きい方から引く
    return build(rng, 'A2', 'A', a + ' ' + MINUS + ' ' + b + ' = ?', num(d),
      [borrow ? num(swapDigit) : null, borrow ? num(d + 10) : num(d - 10), num(d + 1), num(d - 1), num(a + b)],
      k => num(d + near(k)), { a, b }, null, pos);
  } };
  T.A3 = { level: 'A', name: '九九・2けた×1けた', gen(rng) {
    const kuku = rng() < 0.5, a = kuku ? ri(rng, 2, 9) : ri(rng, 11, 99), b = ri(rng, 2, 9), p = a * b;
    const noCarry = Math.floor(a / 10) * b * 10 + (a % 10) * b % 10;        // 一の位の繰り上がり忘れ
    return build(rng, 'A3', 'A', a + ' × ' + b + ' = ?', num(p),
      [kuku ? null : num(noCarry), num(a * (b + 1)), num(a * (b - 1)), num(a + b)],   // 段のずれ／たし算と混同
      k => num(p + near(k)), { a, b, kuku }, null, pos);
  } };
  T.A4 = { level: 'A', name: 'わり算（あまりなし）', gen(rng) {
    const d = ri(rng, 2, 9), q = ri(rng, 2, 12), n = d * q;
    return build(rng, 'A4', 'A', n + ' ÷ ' + d + ' = ?', num(q),
      [num(q + 1), num(q - 1), num(d), num(n - d)],                          // 段のずれ／割る数と混同／ひき算と混同
      k => num(q + near(k)), { n, d }, null, pos);
  } };
  T.A5 = { level: 'A', name: 'おつりの計算', gen(rng) {
    const paid = pick(rng, [100, 500, 1000]), price = ri(rng, 1, paid / 10 - 1) * 10, c = paid - price;
    return build(rng, 'A5', 'A', price + '円の品物を' + paid + '円で買いました。おつりはいくら？', num(c, '円'),
      [num(c + 100, '円'), num(c - 100, '円'), num(c + 10, '円'), num(price, '円'), num(c - 10, '円')],   // 繰り下がりミス／代金と取り違え
      k => num(c + near(k) * 10, '円'), { paid, price }, null, x => x.v > 0 && x.v < paid);
  } };
  T.A6 = { level: 'A', name: '時計の読み取り', gen(rng) {
    const h = ri(rng, 1, 12), m = ri(rng, 0, 11) * 5, n = m === 0 ? 12 : m / 5;
    const nextH = h % 12 + 1, prevH = (h + 10) % 12 + 1;
    return build(rng, 'A6', 'A', 'この時計は何時何分？', time(h, m),
      [time(h, n),                                  // 長針の数字をそのまま「分」と読む
       m >= 30 ? time(nextH, m) : time(prevH, m),   // 短針を隣の数字で読む
       time(n, (h * 5) % 60),                       // 長針と短針の取り違え
       time(h, (m + 30) % 60)],
      k => time(h, (m + 5 * k) % 60), { h, m }, { kind: 'clock', h, m }, null);
  } };
  T.A7 = { level: 'A', name: '単位の換算', gen(rng) {
    const f = ri(rng, 1, 6); let q, ans, c, p;
    if (f === 1) { const x = ri(rng, 1, 9); q = x + 'm = □cm'; ans = num(100 * x, 'cm'); c = [num(10 * x, 'cm'), num(1000 * x, 'cm'), num(x + 100, 'cm')]; p = { f, x }; }
    else if (f === 2) { const x = ri(rng, 1, 9), y = ri(rng, 1, 19) * 5; q = x + 'm' + y + 'cm = □cm'; ans = num(100 * x + y, 'cm'); c = [num(1000 * x + y, 'cm'), num(10 * x + y, 'cm'), num(100 * x + 10 * y, 'cm')]; p = { f, x, y }; }
    else if (f === 3) { const x = ri(rng, 1, 9) * 100; q = x + 'cm = □m'; ans = num(x / 100, 'm'); c = [num(x / 10, 'm'), num(x / 1000, 'm'), num(x, 'm')]; p = { f, x }; }
    else if (f === 4) { const x = ri(rng, 1, 9); q = x + 'kg = □g'; ans = num(1000 * x, 'g'); c = [num(100 * x, 'g'), num(10 * x, 'g'), num(10000 * x, 'g')]; p = { f, x }; }
    else if (f === 5) { const x = ri(rng, 1, 5), y = ri(rng, 1, 9) * 100; q = x + 'kg' + y + 'g = □g'; ans = num(1000 * x + y, 'g'); c = [num(100 * x + y, 'g'), num(10 * (1000 * x + y), 'g'), num((1000 * x + y) / 10, 'g')]; p = { f, x, y }; }
    else { const x = ri(rng, 1, 9) * 1000; q = x + 'g = □kg'; ans = num(x / 1000, 'kg'); c = [num(x / 100, 'kg'), num(x / 10, 'kg'), num(x, 'kg')]; p = { f, x }; }
    const unit = ans.label.replace(/^[0-9.]+/, ''), step = ans.v >= 100 ? 100 : 1;   // 係数（10・100・1000）の取り違え
    return build(rng, 'A7', 'A', q, ans, c, k => num(ans.v + near(k) * step, unit), p, null, pos);
  } };
  const SHAPES = [[3, '三角形'], [4, '四角形'], [5, '五角形'], [6, '六角形'], [8, '八角形']];
  T.A8 = { level: 'A', name: '図形の辺の数・名前', gen(rng) {
    const [n, name] = pick(rng, SHAPES), mode = rng() < 0.5 ? 'count' : 'name';
    const others = SHAPES.filter(s => s[0] !== n).sort((x, y) => Math.abs(x[0] - n) - Math.abs(y[0] - n));   // 辺の数が近い図形と混同
    if (mode === 'count') return build(rng, 'A8', 'A', name + 'の辺の数は何本？', num(n, '本'), others.map(s => num(s[0], '本')),
      k => num(n + 5 + k, '本'), { n, mode }, { kind: 'shape', sides: n }, null);
    return build(rng, 'A8', 'A', 'この図形の名前は？', word(name), others.map(s => word(s[1])),
      k => word(['七角形', '九角形', '十角形'][k % 3]), { n, mode }, { kind: 'shape', sides: n }, null);
  } };

  // ================= B：算数（高〜中学） =================
  const PAIRS = [[2, 4], [2, 6], [3, 6], [2, 3], [3, 4], [2, 5], [4, 8], [3, 9], [2, 8], [4, 6], [3, 5], [4, 12], [6, 12]];
  T.B1 = { level: 'B', name: '分数のたし算', gen(rng) {
    let a, b, d1, d2;
    if (rng() < 0.5) { d1 = d2 = ri(rng, 3, 12); a = ri(rng, 1, d1 - 2); b = ri(rng, 1, d1 - 1 - a); }   // 同じ分母（和は1未満）
    else do { [d1, d2] = pick(rng, PAIRS); if (rng() < 0.5) [d1, d2] = [d2, d1]; a = ri(rng, 1, d1 - 1); b = ri(rng, 1, d2 - 1); }
    while (a * d2 + b * d1 >= d1 * d2);                                    // 簡単な通分（和は1未満）
    const L = lcm(d1, d2), top = a * (L / d1) + b * (L / d2);
    // 分子・分母をそれぞれ足す／通分で分子をかけ忘れ／分子どうし・分母どうしをかける
    // （約分忘れは値が正解と同じになるため、誤答には使わない）
    return build(rng, 'B1', 'B', a + '/' + d1 + ' + ' + b + '/' + d2 + ' = ?', frac(top, L),
      [frac(a + b, d1 + d2), frac(a + b, L), frac(a * b, d1 * d2)],
      k => frac(top + near(k), L), { a, b, d1, d2 }, null, x => x.v > 0 && x.v < 2);
  } };
  T.B2 = { level: 'B', name: '小数の計算', gen(rng) {
    const op = pick(rng, ['+', '−', '×']);
    if (op === '+') {
      const x = ri(rng, 11, 99), y = ri(rng, 101, 999), s = x * 10 + y;     // x：小数第1位まで（10倍）、y：第2位まで（100倍）
      return build(rng, 'B2', 'B', hund(x * 10).label + ' + ' + hund(y).label + ' = ?', hund(s),
        [hund(x + y), hund(s * 10), hund(s - 100), hund(s + 100)],          // 位をそろえ忘れ／小数点の位置ミス／繰り上がりミス
        k => hund(s + near(k) * 10), { op, x, y }, null, pos);
    }
    if (op === '−') {
      const x = ri(rng, 21, 99), y = ri(rng, 11, x - 1), d = (x - y) * 10;
      return build(rng, 'B2', 'B', hund(x * 10).label + ' ' + MINUS + ' ' + hund(y * 10).label + ' = ?', hund(d),
        [hund(d + 100), hund(d * 10), hund((x + y) * 10), hund(d - 10)],
        k => hund(d + near(k) * 10), { op, x, y }, null, pos);
    }
    let x; do { x = ri(rng, 2, 49); } while (x % 10 === 0);
    const k2 = ri(rng, 2, 9), p = x * k2 * 10;
    return build(rng, 'B2', 'B', hund(x * 10).label + ' × ' + k2 + ' = ?', hund(p),
      [hund(p * 10), hund(x * k2), hund(x * 10 + k2 * 100)],                 // 小数点の打ち忘れ／位の下げすぎ／たし算と混同
      k => hund(p + near(k) * 10), { op, x, k: k2 }, null, pos);
  } };
  const BASES = [20, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800], PCTS = [10, 20, 25, 30, 40, 50, 60, 75, 80];
  T.B3 = { level: 'B', name: '割合（％）', gen(rng) {
    let b, p; do { b = pick(rng, BASES); p = pick(rng, PCTS); } while ((b * p) % 100);
    const v = b * p / 100;
    if (rng() < 0.6) return build(rng, 'B3', 'B', b + 'の' + p + '%はいくつ？', num(v),
      [num(v * 10), num(b - v), num(p), num(b * p)],                          // 桁ずれ／残りと混同／割合をそのまま／÷100忘れ
      k => num(v + near(k)), { mode: 'of', b, p }, null, pos);
    return build(rng, 'B3', 'B', v + 'は' + b + 'の何%？', num(p, '%'),
      [num(100 - p, '%'), num(p * 10, '%'), num(v, '%'), num(Math.round(b / v), '%')],
      k => num(p + near(k) * 5, '%'), { mode: 'which', b, p }, null, x => x.v > 0 && x.v <= 1000);
  } };
  T.B4 = { level: 'B', name: '面積（長方形・三角形）', gen(rng) {
    const okInt = x => x.v > 0 && Number.isInteger(x.v);
    if (rng() < 0.5) {
      const w = ri(rng, 2, 15), h = ri(rng, 2, 15), A = w * h;
      return build(rng, 'B4', 'B', 'たて' + h + 'cm、よこ' + w + 'cmの長方形の面積は？', num(A, 'cm²'),
        [num(2 * (w + h), 'cm²'), num(A / 2, 'cm²'), num(w + h, 'cm²')],    // 周の長さと混同／三角形の公式と混同
        k => num(A + near(k), 'cm²'), { shape: 'rect', w, h }, { kind: 'rect', w, h }, okInt);
    }
    let b, h; do { b = ri(rng, 2, 20); h = ri(rng, 2, 16); } while ((b * h) % 2);
    const A = b * h / 2;
    return build(rng, 'B4', 'B', '底辺' + b + 'cm、高さ' + h + 'cmの三角形の面積は？', num(A, 'cm²'),
      [num(b * h, 'cm²'), num(b + h, 'cm²'), num(A / 2, 'cm²'), num(2 * (b + h), 'cm²')],   // ÷2忘れ／公式の混同
      k => num(A + near(k), 'cm²'), { shape: 'tri', b, h }, { kind: 'tri', b, h }, okInt);
  } };
  T.B5 = { level: 'B', name: '最大公約数・最小公倍数', gen(rng) {
    let g, m, n; do { g = ri(rng, 2, 9); m = ri(rng, 1, 7); n = ri(rng, 1, 7); } while (m === n || gcd(m, n) !== 1 || g * m > 60 || g * n > 60);
    const a = g * m, b = g * n, L = g * m * n;
    if (rng() < 0.5) return build(rng, 'B5', 'B', a + 'と' + b + 'の最大公約数は？', num(g),
      [num(L), num(Math.min(a, b)), num(a * b), num(1)],                     // 最小公倍数と混同／小さい方の数
      k => num(g + near(k)), { mode: 'gcd', a, b }, null, pos);
    return build(rng, 'B5', 'B', a + 'と' + b + 'の最小公倍数は？', num(L),
      [num(g), num(a * b), num(a + b), num(Math.max(a, b))],                 // 最大公約数と混同／かけただけ
      k => num(L + near(k) * g), { mode: 'lcm', a, b }, null, pos);
  } };
  T.B6 = { level: 'B', name: '正負の数', gen(rng) {
    const op = pick(rng, ['+', '−', '×', '÷']); let a, b, v;
    for (;;) {
      if (op === '+' || op === '−') { a = nz(rng, -20, 20); b = nz(rng, -20, 20); v = op === '+' ? a + b : a - b; }
      else if (op === '×') { a = nz(rng, -12, 12); b = nz(rng, -9, 9); if (Math.abs(a) === 1 || Math.abs(b) === 1) continue; v = a * b; }
      else { const q = nz(rng, -12, 12); b = nz(rng, -9, 9); if (Math.abs(b) === 1) continue; a = q * b; v = q; }
      if (v !== 0 && (a < 0 || b < 0)) break;                                // 負の数を必ず含む・答えは0以外
    }
    const mist = op === '+' ? [num(-v), num(a - b), num(Math.abs(a) + Math.abs(b))]
      : op === '−' ? [num(a + b), num(-v), num(-(a + b))]                    // ひく負の数の扱いミス／符号ミス
      : op === '×' ? [num(-v), num(a + b), num(a - b)]
      : [num(-v), num(b), num(a + b)];
    return build(rng, 'B6', 'B', par(a) + ' ' + (op === '−' ? MINUS : op) + ' ' + par(b) + ' = ?', num(v), mist,
      k => num(v + near(k)), { op, a, b }, null, null);
  } };
  T.B7 = { level: 'B', name: '一次式の計算', gen(rng) {
    const f = ri(rng, 1, 3); let q, C, D, mist, p;
    if (f === 1) {
      let a, b, c, d; do { a = nz(rng, -9, 9); b = nz(rng, -9, 9); c = nz(rng, -9, 9); d = nz(rng, -9, 9); } while (a + c === 0);
      q = terms([[a, 1], [b, 0], [c, 1], [d, 0]]); C = a + c; D = b + d; p = { f, a, b, c, d };
      mist = [expr(C, -D), expr(a - c, D), expr(C + D, 0), expr(C, b - d)];   // 符号ミス／係数と定数をまとめる
    } else if (f === 2) {
      let k, a, b; do { k = nz(rng, -5, 5); a = nz(rng, -6, 6); b = nz(rng, -9, 9); } while (k === 1);
      q = (k === -1 ? MINUS : sn(k)) + '(' + terms([[a, 1], [b, 0]]) + ')'; C = k * a; D = k * b; p = { f, k, a, b };
      mist = [expr(C, b), expr(C, -D), expr(k + a, D), expr(a, D)];           // 分配のし忘れ／符号ミス
    } else {
      let k, a, b, c; do { k = ri(rng, 2, 5); a = nz(rng, -6, 6); b = nz(rng, -9, 9); c = nz(rng, -9, 9); } while (k * a + c === 0);
      q = k + '(' + terms([[a, 1], [b, 0]]) + ')' + terms([[1, 0], [c, 1]]).slice(1); C = k * a + c; D = k * b; p = { f, k, a, b, c };
      mist = [expr(C, b), expr(k * a - c, D), expr(a + c, D), expr(C, -D)];
    }
    return build(rng, 'B7', 'B', q + ' を計算すると？', expr(C, D), mist, k => expr(C, D + near(k)), p, null, x => x.c !== 0);
  } };
  T.B8 = { level: 'B', name: '一次方程式', gen(rng) {
    const x = nz(rng, -9, 9);
    if (rng() < 0.5) {
      const a = ri(rng, 2, 9), b = nz(rng, -20, 20), c = a * x + b;
      return build(rng, 'B8', 'B', a + 'x ' + (b < 0 ? MINUS : '+') + ' ' + Math.abs(b) + ' = ' + sn(c) + '　x = ?', xeq(x),
        [(c + b) % a === 0 ? xeq((c + b) / a) : null, xeq(-x), xeq(c - b)],   // 移項の符号ミス／符号ミス／aで割り忘れ
        k => xeq(x + near(k)), { f: 1, a, b, c }, null, null);
    }
    let a, c; do { a = ri(rng, 2, 9); c = ri(rng, 1, 9); } while (a === c);
    const b = ri(rng, -15, 15), d = (a - c) * x + b;
    const side = (co, k) => (co === 1 ? 'x' : co + 'x') + (k === 0 ? '' : ' ' + (k < 0 ? MINUS : '+') + ' ' + Math.abs(k));
    return build(rng, 'B8', 'B', side(a, b) + ' = ' + side(c, d) + '　x = ?', xeq(x),
      [(d - b) % (a + c) === 0 ? xeq((d - b) / (a + c)) : null, xeq(-x), xeq(d - b), (d + b) % (a - c) === 0 ? xeq((d + b) / (a - c)) : null],
      k => xeq(x + near(k)), { f: 2, a, b, c, d }, null, null);
  } };

  const LEVELS = {
    A: { label: '算数（低中）', ready: true, types: ['A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8'] },
    B: { label: '算数（高〜中学）', ready: true, types: ['B1', 'B2', 'B3', 'B4', 'B5', 'B6', 'B7', 'B8'] },
    C: { label: '準備中', ready: false, types: [] },
    D: { label: '準備中', ready: false, types: [] },
    E: { label: '準備中', ready: false, types: [] },
  };
  const generate = (type, rng) => T[type].gen(rng || Math.random);
  // n問セット：同じタイプが重ならないように選ぶ（8種から5種）
  function makeSet(level, rng, n) {
    rng = rng || Math.random; n = n || 5;
    const ids = LEVELS[level].types.slice();
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    const out = [];
    for (let i = 0; i < n; i++) out.push(generate(ids[i % ids.length], rng));
    return out;
  }
  root.ClockseedDrill = { TYPES: T, LEVELS, generate, makeSet };
})(typeof window !== 'undefined' ? window : globalThis);

    // ---- 消耗品9（C4／R3／SR2／UR0）。units＝1回で増える所持数 ----

    I('cs04', 'cons', '肥料・改x3', 'R', '次の収穫が+2個になる', 3),
    I('cs05', 'cons', '時の砂・30分', 'R', '時短ストックに30分追加'),

    I('cs09', 'cons', '全体時の砂', 'SR', '進行中の全タイマーを10分進める'),
  ];
  const byId = {}, byRarity = { C: [], R: [], SR: [], UR: [] };
  for (const it of ITEMS) { byId[it.id] = it; byRarity[it.r].push(it); }

    const g = { pity: { r: 0, sr: 0, ur: 0 }, total: 0, firstUsed: false, items: {}, dex: {} };
    for (const it of ITEMS) g.items[it.id] = 0;

  };

  // セーブ読み込み用：壊れた値・未知の品目を落として整える。種・お手伝いは0/1、飾り・消耗品は所持数
  function sanitize(d) {
    const g = freshState();
    if (!d || typeof d !== 'object') return g;
    if (d.pity) { g.pity.r = nat(d.pity.r); g.pity.sr = nat(d.pity.sr); g.pity.ur = nat(d.pity.ur); }
    g.total = nat(d.total); g.firstUsed = d.firstUsed === true || g.total > 0;
    for (const it of ITEMS) {
      const v = d.items ? nat(d.items[it.id]) : 0;
      g.items[it.id] = (it.cat === 'seed' || it.cat === 'helper') ? (v > 0 ? 1 : 0) : v;
      if ((d.dex && d.dex[it.id]) || (it.cat !== 'cons' && g.items[it.id] > 0)) g.dex[it.id] = 1;

    const total = list.reduce((a, r) => a + RATES[r], 0);
    let x = rng() * total;
    for (const r of list) { if (x < RATES[r]) return r; x -= RATES[r]; }
    return list[list.length - 1];

    g.pity.r = ri >= 1 ? 0 : g.pity.r + 1;
    g.pity.sr = ri >= 2 ? 0 : g.pity.sr + 1;

})(typeof window !== 'undefined' ? window : globalThis);

  // 品目別の価格修飾（所持しているだけで常時発動。売値と注文報酬の両方に効く。合計の上限は+15%）

  const GARDENER_MOD = 5, MOD_CAP = 15;              // 伝説の庭師（hp09）：全ての変種の生売り価格+5%（上限の計算に含める）
  const ITEM_KEYS = Object.keys(ITEMS);

  // ドリルの報酬（正解1問ごと）。C〜E は後の段階で表のとおりに足す
  const DRILL_REWARD = { A: { sec: 40, shards: 2 }, B: { sec: 80, shards: 3 } };

  const localDay = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const freshDrill = () => ({ stock: 0, shards: 0, shardHalf: 0, tickets: 0, streak: 0, stats: {}, day: '', dayCount: 0 });

  const townLevelOf = exp => { let lv = 1; TOWN_LV_EXP.forEach((need, i) => { if (exp >= need) lv = i + 1; }); return lv; };
  const PLOTS_BY_LV = [6, 9, 12, 14, 16, 18, 20, 24];                     // 町Lvごとの畑の上限
  const plotsForLevel = lv => PLOTS_BY_LV[Math.max(1, Math.min(lv, PLOTS_BY_LV.length)) - 1];
  const buildingBuilt = (bs, key, t = Date.now()) => !!(bs && bs[key] && t >= bs[key].builtAt);
  // 注文・倉庫に出せるか：作物は町Lv。加工品は「施設が完成」「レシピが町Lvで解放済み」「材料が全て手に入る」の3つ
  // （材料までさかのぼって確かめるので、作れない品物の注文は出ない）
  function itemAvailable(k, lv, bs, gs) {
    const it = ITEMS[k];

    const r = RECIPES[it.recipe];
    return buildingBuilt(bs, r.building) && (r.unlockLv || 1) <= lv && Object.keys(r.inputs).every(i => itemAvailable(i, lv, bs, gs));
  }

  // ---------- 町の配置（タイル座標）。描画と隣接ルールの両方で使う ----------
  const PLOT_TILES = [[9, 5], [12, 5], [15, 5], [9, 8], [12, 8], [15, 8], [9, 11], [12, 11], [15, 11],   // Lv1〜2
                      [18, 5], [18, 8], [18, 11],                // Lv3：畑を東へ1列
                      [9, 14], [12, 14],                         // Lv4：畑を南へ
                      [9, 19], [12, 19],                         // Lv5：川沿い
                      [15, 14], [18, 14],                        // Lv6
                      [15, 19], [18, 19],                        // Lv7：川沿い
                      [3, 19], [6, 19], [21, 19], [24, 19]];     // Lv8：川沿い
  const RIVER = { y: 21, h: 2, lv: 5 };                         // 川（Lv5〜）：タイル行21〜22の全幅
  // 施設の敷地（2×2タイルの左上）
  const FACILITY_TILES = { mill: { tx: 15, ty: 2 }, kitchen: { tx: 12, ty: 2 }, bakery: { tx: 22, ty: 4 }, jam: { tx: 24, ty: 4 },
                           restaurant: { tx: 22, ty: 9 }, cake: { tx: 27, ty: 9 }, ranch: { tx: 9, ty: -5 }, dairy: { tx: 13, ty: -5 } };
  // ---------- 隣接ルール（10%短縮）----------
  // 所要時間 × 0.9。ミリ秒未満は切り上げ（＝短縮は10%を超えない）。例：120000 → 108000、?fast=7 の 17142.86 → 15429
  const ADJ_RATE = 0.9;
  const shorten = ms => Math.ceil(ms * ADJ_RATE);
  // 川に隣接する区画：区画（2×2）の上下どちらかの辺が川の行に接する
  const plotNearRiver = (i, lv) => lv >= RIVER.lv && (PLOT_TILES[i][1] + 2 === RIVER.y || PLOT_TILES[i][1] === RIVER.y + RIVER.h);
  // 施設どうしが隣り合う：敷地（2×2）が辺で接する（角だけの接触は含まない）。相手は完成済みの施設に限る
  function tilesTouch(a, b) {
    const ax2 = a.tx + 2, ay2 = a.ty + 2, bx2 = b.tx + 2, by2 = b.ty + 2;
    const ovX = a.tx < bx2 && b.tx < ax2, ovY = a.ty < by2 && b.ty < ay2;
    return (ovY && (ax2 === b.tx || bx2 === a.tx)) || (ovX && (ay2 === b.ty || by2 === a.ty));
  }
  const facNeighbors = (k, bs, t) => BUILDING_KEYS.filter(o => o !== k && buildingBuilt(bs, o, t) && tilesTouch(FACILITY_TILES[k], FACILITY_TILES[o]));

  // ---------- セーブ ----------
  function rollOrder(lv, bs, gs) {
    const open = ITEM_KEYS.filter(k => itemAvailable(k, lv, bs, gs));
    const k = open[Math.floor(Math.random() * open.length)], [lo, hi] = ITEMS[k].orderQty;
    return { crop: k, qty: lo + Math.floor(Math.random() * (hi - lo + 1)) };
  }
  const newOrderId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // 次の注文を取り出す。次の次をすぐ決めておく（st.nextOrder）。注文はすべてここから作る
  function takeOrder(st, lv) {
    const q = st.nextOrder, ok = q && ITEMS[q.crop] && itemAvailable(q.crop, lv, st.buildings, st.gacha);
    const o = ok ? { crop: q.crop, qty: q.qty } : rollOrder(lv, st.buildings, st.gacha);
    st.nextOrder = rollOrder(lv, st.buildings, st.gacha);
    return o;
  }
  const freshBuffs = () => ({ fert: 0, fertPlus: 0, double: 0, boost: 0 });     // 消耗品の予約数
  const freshHelpers = () => ({ keeperDay: '', peddlerDay: '', peddler: null, crowSeen: [] });
  function freshState() {
    const st = { saveVersion: SAVE_VERSION, plots: Array(MAX_PLOTS).fill(null),
                 storage: {}, gold: 0, townExp: 0, orders: [], orderIds: [], nextOrder: null, buildings: {}, drill: freshDrill(), gacha: window.ClockseedGacha.freshState(),
                 buffs: freshBuffs(), helpers: freshHelpers() };
    for (const k of ITEM_KEYS) st.storage[k] = 0;
    for (const k of BUILDING_KEYS) st.buildings[k] = null;

  }
  const nat = n => (Number.isInteger(n) && n >= 0 ? n : 0);
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return freshState();
      const d = JSON.parse(raw);
      if (!d || typeof d.saveVersion !== 'number') return freshState();
      if (d.saveVersion < SAVE_VERSION) {            // 旧セーブからの移行：念のため原本を退避
        try { localStorage.setItem(SAVE_KEY + '.v' + d.saveVersion + '.backup', raw); } catch (e) {}
      }
      const s = freshState();
      s.townExp = nat(d.townExp);
      s.gold = nat(d.gold);
      const lv = townLevelOf(s.townExp), open = plotsForLevel(lv);   // version 6 以前の plots（9要素）はそのまま先頭に入る
      for (let i = 0; i < open; i++) {
        const p = d.plots && d.plots[i];
        if (p && CROPS[p.crop] && CROPS[p.crop].unlockLv <= lv && isFinite(p.plantedAt) && isFinite(p.readyAt)) {
          s.plots[i] = { crop: p.crop, plantedAt: p.plantedAt, readyAt: p.readyAt };
          if (isFinite(p.skipMs) && p.skipMs > 0) s.plots[i].skipMs = p.skipMs;      // 時短で前倒しした量（元の所要時間を保つため）
          if (p.v && VARIANTS[p.v] && VARIANTS[p.v].crop === p.crop) s.plots[i].v = p.v;   // 変種（version 8〜）
        }
      }
      for (const k of ITEM_KEYS) s.storage[k] = nat(d.storage && d.storage[k]);
      for (const k of BUILDING_KEYS) {                // 施設：建設と加工は終了時刻（timestamp）で持つ
        const b = d.buildings && d.buildings[k];
        if (b && isFinite(b.startedAt) && isFinite(b.builtAt)) {
          const j = b.job, okJob = j && RECIPES[j.recipe] && RECIPES[j.recipe].building === k && isFinite(j.startedAt) && isFinite(j.readyAt);
          s.buildings[k] = { startedAt: b.startedAt, builtAt: b.builtAt,
                             job: okJob ? { recipe: j.recipe, startedAt: j.startedAt, readyAt: j.readyAt } : null };
          if (isFinite(b.buildSkipMs) && b.buildSkipMs > 0) s.buildings[k].buildSkipMs = b.buildSkipMs;
          if (okJob && isFinite(j.skipMs) && j.skipMs > 0) s.buildings[k].job.skipMs = j.skipMs;
        }
      }
      s.gacha = window.ClockseedGacha.sanitize(d.gacha);   // ガチャ（version 5 以前には無い → 初期状態）
      const dd = d.drill;                             // ドリル（version 4 以前には無い → 初期値）
      if (dd && typeof dd === 'object') {
        const D = s.drill;
        D.stock = Math.min(DRILL_STOCK_MAX, nat(dd.stock)); D.shards = nat(dd.shards); D.shardHalf = dd.shardHalf === 1 ? 1 : 0;
        D.tickets = nat(dd.tickets); D.streak = nat(dd.streak); D.dayCount = nat(dd.dayCount);
        D.day = typeof dd.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dd.day) ? dd.day : '';
        if (dd.stats && typeof dd.stats === 'object') for (const [id, v] of Object.entries(dd.stats)) {
          if (/^[A-E]\d{1,2}$/.test(id) && v && nat(v.n) >= nat(v.ok)) D.stats[id] = { ok: nat(v.ok), n: nat(v.n) };
        }
      }
      // 消耗品の予約・お手伝いの記録（version 7 以前には無い → 初期値）
      if (d.buffs) for (const k of Object.keys(s.buffs)) s.buffs[k] = nat(d.buffs[k]);
      const dh = d.helpers || {}, isDay = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
      s.helpers.keeperDay = isDay(dh.keeperDay) ? dh.keeperDay : '';
      s.helpers.peddlerDay = isDay(dh.peddlerDay) ? dh.peddlerDay : '';
      const P = dh.peddler;
      s.helpers.peddler = P && CROPS[P.crop] && Number.isInteger(P.qty) && P.qty > 0 && isDay(P.day) && typeof P.id === 'string' ? { crop: P.crop, qty: P.qty, day: P.day, id: P.id } : null;
      s.helpers.crowSeen = Array.isArray(dh.crowSeen) ? dh.crowSeen.filter(x => typeof x === 'string').slice(-20) : [];
      const validOrder = o => o && ITEMS[o.crop] && itemAvailable(o.crop, lv, s.buildings, s.gacha) && Number.isInteger(o.qty) &&
                   o.qty >= ITEMS[o.crop].orderQty[0] && o.qty <= ITEMS[o.crop].orderQty[1];
      s.nextOrder = validOrder(d.nextOrder) ? { crop: d.nextOrder.crop, qty: d.nextOrder.qty } : rollOrder(lv, s.buildings, s.gacha);

      for (let i = 0; i < ORDER_COUNT; i++) {

    } catch (e) { return freshState(); }
  }
  let state = load();
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- ロジック（常に現在時刻との差分で判定） ----------
  const now = () => Date.now();
  const townLevel = () => townLevelOf(state.townExp);
  const activePlots = () => plotsForLevel(townLevel());
  function progress(p, t) {           // 0..1
    const total = p.readyAt - p.plantedAt;
    if (total <= 0) return 1;
    return Math.min(1, Math.max(0, (t - p.plantedAt) / total));
  }
  const isReady = (p, t) => !!p && t >= p.readyAt;
  const ownsHelper = id => !!(state.gacha && state.gacha.items[id]);
  const variantsOf = crop => VARIANT_KEYS.filter(sd => VARIANTS[sd].crop === crop);
  const unlockedVariants = crop => variantsOf(crop).filter(sd => state.gacha.items[sd]);
  function plant(i, crop, v) {
    if (i < 0 || i >= activePlots() || state.plots[i] || !CROPS[crop] || CROPS[crop].unlockLv > townLevel()) return false;
    if (v && !(VARIANTS[v] && VARIANTS[v].crop === crop && state.gacha.items[v])) return false;   // 変種は解放済みのものだけ
    const t = now();
    let dur = CROPS[crop].growMs / FAST;
    if (plotNearRiver(i, townLevel())) dur = shorten(dur);        // 隣接ルール：川沿いは育成時間10%短縮（植え付け時に readyAt へ反映）
    state.plots[i] = { crop, plantedAt: t, readyAt: t + dur };
    if (v) state.plots[i].v = v;                                    // 変種：育成時間・収穫数は通常種と同じ
    save(); return true;
  }
  // 収穫：予約された消耗品を1回分ずつ使う。肥料・改（+2）を先に、なければ肥料（+1）。ダブル収穫は（基本数＋肥料）×2
  function harvest(i) {
    const p = state.plots[i];
    if (!p || !isReady(p, now())) return false;
    const B = state.buffs, fx = [];
    let n = CROPS[p.crop].yield;
    if (B.fertPlus > 0) { n += 2; B.fertPlus -= 1; fx.push('肥料・改 +2'); }
    else if (B.fert > 0) { n += 1; B.fert -= 1; fx.push('肥料 +1'); }
    if (B.double > 0) { n *= 2; B.double -= 1; fx.push('ダブル収穫 ×2'); }
    const key = p.v ? 'v_' + p.v : p.crop;
    state.storage[key] += n;
    state.plots[i] = null;
    save(); return { key, n, fx };
  }
  const stageOf = (p, t) => !p ? 0 : t >= p.readyAt ? 3 : progress(p, t) >= 0.5 ? 2 : 1;

  // ---------- 施設：建設と加工（どちらも終了時刻ベース） ----------
  const bState = (key, t = now()) => { const b = state.buildings[key]; return !b ? 'none' : t >= b.builtAt ? 'built' : 'building'; };
  function startBuild(key) {
    const B = BUILDINGS[key];
    if (!B || townLevel() < B.unlockLv || state.buildings[key] || state.gold < B.cost) return false;
    const t = now();
    state.gold -= B.cost;
    state.buildings[key] = { startedAt: t, builtAt: t + B.buildMs / FAST, job: null };
    save(); return true;
  }
  // 材料の所持数：作物は変種も数える（製品は通常品）
  const haveFor = k => state.storage[k] + (CROPS[k] ? variantsOf(k).reduce((a, sd) => a + state.storage['v_' + sd], 0) : 0);
  const canCraft = rk => Object.entries(RECIPES[rk].inputs).every(([k, n]) => haveFor(k) >= n);
  function consumeInput(k, n) {                      // 通常種を優先し、足りない分を変種から（種の番号順に）充てる
    const a = Math.min(n, state.storage[k]); state.storage[k] -= a; n -= a;
    if (CROPS[k]) for (const sd of variantsOf(k)) { if (!n) break; const b = Math.min(n, state.storage['v_' + sd]); state.storage['v_' + sd] -= b; n -= b; }
  }

    const r = RECIPES[rk], b = state.buildings[key];
    if (!r || r.building !== key || bState(key) !== 'built' || b.job || (r.unlockLv || 1) > townLevel() || !canCraft(rk)) return false;
    for (const [k, n] of Object.entries(r.inputs)) consumeInput(k, n);
    const t = now();
    let ms = r.ms / FAST;
    if (facNeighbors(key, state.buildings, t).length) ms = shorten(ms);   // 隣接ルール：他の施設と隣り合うと加工時間10%短縮（建設には効かない）
    b.job = { recipe: rk, startedAt: t, readyAt: t + ms };
    save(); return true;
  }
  function collectJob(key) {                         // 完了した製品は施設に留まり、受け取ると倉庫へ
    const b = state.buildings[key];
    if (!b || !b.job || now() < b.job.readyAt) return false;
    const r = RECIPES[b.job.recipe];
    state.storage[r.product.key] += r.product.qty;
    b.job = null;
    save(); return true;
  }

  // ---------- ドリルの報酬 ----------
  // 正解1問ごとに時短ストックとカケラ。ストックは上限で切り捨て。カケラはその日の累計120問を超えた分から半分
  // （半分にして端数0.5が出たら shardHalf に繰り越す）。連続正解10ごとに即完了チケット1枚。不正解は連続正解が0に戻るだけ
  function drillAnswer(level, typeId, correct) {
    const D = state.drill, day = localDay();
    if (D.day !== day) { D.day = day; D.dayCount = 0; }       // 日付が変わったら累計をリセット
    D.dayCount += 1;
    const st = D.stats[typeId] || (D.stats[typeId] = { ok: 0, n: 0 });
    st.n += 1;
    const res = { correct, sec: 0, shards: 0, ticket: false, halved: false, capped: false, streakLost: false };
    if (correct) {
      st.ok += 1;
      const R = DRILL_REWARD[level];
      const before = D.stock;
      D.stock = Math.min(DRILL_STOCK_MAX, D.stock + R.sec);
      res.sec = D.stock - before; res.capped = res.sec < R.sec;
      let halves = R.shards * 2;                               // 0.5個単位で数える
      if (D.dayCount > DRILL_DAY_SOFTCAP) { halves = R.shards; res.halved = true; }
      const tot = D.shardHalf + halves;
      D.shards += Math.floor(tot / 2); D.shardHalf = tot % 2;
      res.shards = halves / 2;
      D.streak += 1;
      if (D.streak % DRILL_TICKET_STREAK === 0) { D.tickets += 1; res.ticket = true; }
    } else {
      res.streakLost = D.streak > 0;
      D.streak = 0;
    }
    save(); return res;
  }

  // ---------- ガチャ・消耗品 ----------
  const GA = window.ClockseedGacha;
  let lastGacha = [];                  // 直近の結果（表示・検品用。セーブしない）
  // n回引く（カケラ20個×n）。足りなければ null。被り変換のカケラ（お手伝い）はその場で加算
  function gachaPull(n) {
    const cost = GA.COST * n, D = state.drill;
    if (D.shards < cost) return null;
    D.shards -= cost;
    const out = [];
    for (let i = 0; i < n; i++) { const r = GA.pullOnce(state.gacha, Math.random); D.shards += r.shards; out.push(r); }
    lastGacha = out; save(); return out;
  }
  const ownedCount = id => state.gacha.items[id] || 0;
  // 使える消耗品（今回の範囲）：時の砂は時短ストックに加算（上限で頭打ち）、即完成券は即完了チケット+1
  const CONS_USE = { cs02: { sec: 600 }, cs05: { sec: 1800 }, cs06: { ticket: 1 },
                     cs01: { reserve: 'fert' }, cs04: { reserve: 'fertPlus' }, cs08: { reserve: 'double' }, cs07: { reserve: 'boost' }, cs09: { allSand: true } };
  function canUseCons(id) {
    const u = CONS_USE[id];
    if (u && u.allSand) return ownedCount(id) >= 1 && timers().some(tm => sandAdvance(tm, now()) >= 1000);   // 進められるタイマーが無いときは使わせない
    return !!u && ownedCount(id) >= 1 && !(u.sec && state.drill.stock >= DRILL_STOCK_MAX);   // ストックが満タンの時の砂は使わせない（無駄になる）
  }
  function useConsumable(id) {
    if (!canUseCons(id)) return null;
    const u = CONS_USE[id], D = state.drill;
    state.gacha.items[id] -= 1;
    if (u.reserve) { state.buffs[u.reserve] += 1; save(); return { reserve: u.reserve, count: state.buffs[u.reserve] }; }
    if (u.allSand) { const moved = applyAllSand(); save(); return { allSand: moved }; }
    let sec = 0;
    if (u.sec) { const b = D.stock; D.stock = Math.min(DRILL_STOCK_MAX, D.stock + u.sec); sec = D.stock - b; }
    if (u.ticket) D.tickets += u.ticket;
    save(); return { sec, ticket: u.ticket || 0 };
  }
  // 注文リロール券：注文1件を（今と違う）新しいものに引き直す
  function rerollOrder(i) {
    const o = state.orders[i];
    if (!o || ownedCount('cs03') < 1) return false;
    let n, k = 0;
    do { n = takeOrder(state, townLevel()); } while (n.crop === o.crop && n.qty === o.qty && ++k < 50);
    state.gacha.items.cs03 -= 1; state.orders[i] = n; state.orderIds[i] = newOrderId();
    save(); return true;
  }

  // ---------- 時短：進行中のタイマー（区画・建設・加工）に適用 ----------
  // 元の所要時間 D ＝ readyAt − 開始時刻 ＋ これまでに前倒しした量（skipMs）。
  // 残り R が D の25%より多い部分は ストック1秒＝1秒、25%を切った部分（追い込み区間）は ストック2秒＝1秒
  function timers(t = now()) {
    const out = [];
    for (let i = 0; i < activePlots(); i++) {
      const p = state.plots[i];
      if (p && t < p.readyAt) out.push({ id: 'plot:' + i, kind: 'plot', ref: p, start: p.plantedAt, ready: p.readyAt, skip: p.skipMs || 0,
        label: '区画' + (i + 1) + '：' + CROPS[p.crop].name, icon: CROPS[p.crop].icon });
    }
    for (const k of BUILDING_KEYS) {
      const b = state.buildings[k];
      if (!b) continue;
      if (t < b.builtAt) out.push({ id: 'build:' + k, kind: 'build', ref: b, start: b.startedAt, ready: b.builtAt, skip: b.buildSkipMs || 0,
        label: BUILDINGS[k].name + 'の建設', icon: k + '_wip' });
      else if (b.job && t < b.job.readyAt) {
        const pr = RECIPES[b.job.recipe].product;
        const eff = (k === 'bakery' && ownsHelper('hp03')) || (k === 'ranch' && ownsHelper('hp05')) ? HELPER_SKIP_EFF : 1;
        out.push({ id: 'job:' + k, kind: 'job', ref: b.job, start: b.job.startedAt, ready: b.job.readyAt, skip: b.job.skipMs || 0,
          label: BUILDINGS[k].name + '：' + pr.name, icon: pr.icon, eff });
      }
    }
    return out.sort((a, b) => a.ready - b.ready);
  }
  const origDur = tm => tm.ready - tm.start + tm.skip;
  // 見習いパン職人（パン屋）・乳しぼり上手なおばあさん（牧場の牛乳）：ストック1秒で1.1秒分進む（追い込み区間の2倍消費と併用）
  const HELPER_SKIP_EFF = 1.1;
  function skipCostMs(tm, cut, t) {                  // cut ミリ秒縮めるのに必要なストック（ミリ秒）
    const R = tm.ready - t, normal = Math.max(0, Math.min(cut, R - origDur(tm) * SKIP_RUSH));
    return (normal + 2 * (cut - normal)) / (tm.eff || 1);
  }
  const skipCostSec = (tm, cut, t) => Math.ceil(skipCostMs(tm, cut, t) / 1000 - 1e-9);
  function skipMaxMs(tm, stockMs, t) {               // ストックで縮められる最大量（ミリ秒）
    stockMs *= tm.eff || 1;
    const R = tm.ready - t, normalAvail = Math.max(0, R - origDur(tm) * SKIP_RUSH);
    if (stockMs <= normalAvail) return stockMs;
    return Math.min(R, normalAvail + (stockMs - normalAvail) / 2);
  }
  function shiftTimer(tm, ms) {                      // readyAt（建設は builtAt）を前倒しする
    if (tm.kind === 'build') { tm.ref.builtAt -= ms; tm.ref.buildSkipMs = (tm.ref.buildSkipMs || 0) + ms; }
    else { tm.ref.readyAt -= ms; tm.ref.skipMs = (tm.ref.skipMs || 0) + ms; }
  }
  // cut：縮めたいミリ秒、または 'max'（ストックで届くところまで）
  function applySkip(id, cut) {
    const t = now(), tm = timers(t).find(x => x.id === id);
    if (!tm) return null;
    const R = tm.ready - t, stockMs = state.drill.stock * 1000;
    let ms = cut === 'max' ? skipMaxMs(tm, stockMs, t) : Math.min(cut, R);
    if (R - ms < 1) ms = R;                          // 端数で残らないように、届くなら即完了
    if (ms <= 0) return null;
    const cost = skipCostSec(tm, ms, t);
    if (cost > state.drill.stock) return null;
    state.drill.stock -= cost;
    shiftTimer(tm, ms);
    save(); return { cost, ms, done: ms >= R };
  }
  // 時の番人：1日1回、チケットもストックも使わずに1件を即完了（日付が変わると復活）
  const keeperReady = () => ownsHelper('hp11') && state.helpers.keeperDay !== localDay();
  function useKeeper(id) {
    const t = now(), tm = timers(t).find(x => x.id === id);
    if (!tm || !keeperReady()) return null;
    state.helpers.keeperDay = localDay();
    const ms = tm.ready - t;
    shiftTimer(tm, ms);
    save(); return { ms };
  }
  // 全体時の砂：進行中の全タイマーを10分進める。ただし各タイマーの「元の所要時間の25%」の境界は越えない
  const ALL_SAND_MS = 10 * 60 * 1000;
  const sandAdvance = (tm, t) => Math.max(0, Math.min(ALL_SAND_MS, tm.ready - t - origDur(tm) * SKIP_RUSH));
  function applyAllSand() {
    const t = now(), list = timers(t).map(tm => [tm, sandAdvance(tm, t)]).filter(([, ms]) => ms > 0);
    for (const [tm, ms] of list) shiftTimer(tm, ms);
    return list.map(([tm, ms]) => ({ id: tm.id, ms }));
  }
  function useTicket(id) {                           // 即完了チケット：ストックを使わずに1件を即完了
    const t = now(), tm = timers(t).find(x => x.id === id);
    if (!tm || state.drill.tickets < 1) return null;
    state.drill.tickets -= 1;
    const ms = tm.ready - t;
    shiftTimer(tm, ms);
    save(); return { ms };
  }

  // ---------- 注文・町経験値・売却 ----------
  let onLevelUp = () => {};
  function gainExp(n) {
    const before = townLevel();
    state.townExp += n;
    if (townLevel() > before) onLevelUp(townLevel());
  }
  // 報酬ゴールド＝単価×個数×1.3（端数切り上げ）。小数誤差を避けるため整数で ceil(x*13/10) を計算
  // 単価（売値）＝ 基本価格 ×（1 ＋ 変種の上乗せ ＋ min(15%, 価格修飾の合計)）の切り上げ
  function priceBonus(k) {
    const it = ITEMS[k], g = state.gacha.items;
    let mod = 0;
    for (const [sd, pct] of PRICE_MODS[k] || []) if (g[sd]) mod += pct;
    if (it.seed && g.hp09) mod += GARDENER_MOD;
    return (it.vBonus || 0) + Math.min(MOD_CAP, mod);
  }
  const unitPrice = k => Math.floor((ITEMS[k].price * (100 + priceBonus(k)) + 99) / 100);
  const orderReward = o => ({ gold: Math.floor((unitPrice(o.crop) * o.qty * 13 + 9) / 10), exp: ITEMS[o.crop].orderExp });
  const BOOST_RATE = 1.5;                            // 注文ブースト券：次の納品1件だけ町経験値+50%（端数切り上げ）
  function useBoost(exp) { if (state.buffs.boost > 0) { state.buffs.boost -= 1; return { exp: Math.ceil(exp * BOOST_RATE), boosted: true }; } return { exp, boosted: false }; }
  function deliver(i) {
    const o = state.orders[i];
    if (!o || state.storage[o.crop] < o.qty) return false;
    const r = orderReward(o), b = useBoost(r.exp);
    state.storage[o.crop] -= o.qty;
    state.gold += r.gold;
    gainExp(b.exp);                                  // 先に経験値を加算（Lvが上がれば新作物も注文に出る）
    state.orders[i] = takeOrder(state, townLevel()); state.orderIds[i] = newOrderId();
    save(); return { gold: r.gold, exp: b.exp, boosted: b.boosted };
  }
  // 行商人：1日1回まで、注文パネルを開いたときに40%で特別注文（解放済みの生の作物を単価×1.5で買い取る。町経験値は2倍）
  const PEDDLER_RATE = 0.4;
  function rollPeddler() {
    const H = state.helpers, day = localDay();
    if (!ownsHelper('hp06') || H.peddlerDay === day) return false;
    H.peddlerDay = day;
    if (Math.random() < PEDDLER_RATE) {
      const open = CROP_KEYS.filter(k => CROPS[k].unlockLv <= townLevel());
      H.peddler = { crop: open[Math.floor(Math.random() * open.length)], qty: 3 + Math.floor(Math.random() * 7), day, id: newOrderId() };
    } else H.peddler = null;
    save(); return true;
  }
  const peddlerOrder = () => { const P = state.helpers.peddler; return P && P.day === localDay() ? P : null; };   // その日だけ有効
  const peddlerReward = P => ({ gold: Math.floor((unitPrice(P.crop) * P.qty * 15 + 9) / 10), exp: ITEMS[P.crop].orderExp * 2 });
  function deliverPeddler() {
    const P = peddlerOrder();
    if (!P || state.storage[P.crop] < P.qty) return false;
    const r = peddlerReward(P), b = useBoost(r.exp);
    state.storage[P.crop] -= P.qty; state.gold += r.gold; gainExp(b.exp);
    state.helpers.peddler = null;
    save(); return { gold: r.gold, exp: b.exp, boosted: b.boosted };
  }
  // 配達ねこ：加工が完了した製品を倉庫へ自動で運ぶ
  function autoCollect() {
    if (!ownsHelper('hp02')) return [];
    const got = [];
    for (const k of BUILDING_KEYS) { const b = state.buildings[k]; if (b && b.job && now() >= b.job.readyAt) { const pr = RECIPES[b.job.recipe].product; if (collectJob(k)) got.push(pr.name + '×' + pr.qty); } }
    return got;
  }
  // 郵便カラス：納品できる注文が新しく生まれたら知らせる（同じ注文では1回だけ）
  function crowCheck() {
    if (!ownsHelper('hp07')) return [];
    const H = state.helpers, P = peddlerOrder(), list = state.orders.map((o, i) => [o, state.orderIds[i]]).concat(P ? [[P, P.id]] : []);
    const fresh = list.filter(([o, id]) => state.storage[o.crop] >= o.qty && !H.crowSeen.includes(id));
    if (!fresh.length) return [];
    H.crowSeen = H.crowSeen.concat(fresh.map(([, id]) => id)).filter(id => list.some(([, x]) => x === id)).slice(-20);
    save(); return fresh.map(([o]) => ITEMS[o.crop].name + '×' + o.qty);
  }
  function sell(item, n) {
    const c = ITEMS[item];
    if (!c) return 0;
    n = Math.min(n, state.storage[item]);
    if (n <= 0) return 0;
    state.storage[item] -= n;
    state.gold += unitPrice(item) * n;
    save(); return n;
  }

  function rngFrom(seed) {

      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // ---- 製粉所（風車小屋）：建設予定地／建設中／完成。羽根は別スプライトで回す ----

      for (let x = cx - hw; x < cx + hw; x++) {

  function visualSvg(v) {             // 問題の図（時計・図形・長方形・三角形）
    const S = (w, h, inner) => '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' + inner + '</svg>';
    const ink = '#4a3322', cream = '#fff8e4';
    if (v.kind === 'clock') {
      let s = '<circle cx="60" cy="60" r="52" fill="' + cream + '" stroke="' + ink + '" stroke-width="5"/>';
      for (let k = 1; k <= 12; k++) {
        const a = k * Math.PI / 6, x = 60 + 40 * Math.sin(a), y = 60 - 40 * Math.cos(a);
        s += '<text x="' + x.toFixed(1) + '" y="' + (y + 5).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="bold" fill="' + ink + '">' + k + '</text>';
      }
      const ha = ((v.h % 12) + v.m / 60) * Math.PI / 6, ma = v.m * Math.PI / 30;
      s += '<line x1="60" y1="60" x2="' + (60 + 24 * Math.sin(ha)).toFixed(1) + '" y2="' + (60 - 24 * Math.cos(ha)).toFixed(1) + '" stroke="' + ink + '" stroke-width="6" stroke-linecap="round"/>';
      s += '<line x1="60" y1="60" x2="' + (60 + 36 * Math.sin(ma)).toFixed(1) + '" y2="' + (60 - 36 * Math.cos(ma)).toFixed(1) + '" stroke="#b8503c" stroke-width="3.5" stroke-linecap="round"/>';
      return S(120, 120, s + '<circle cx="60" cy="60" r="4.5" fill="#d9ae55"/>');
    }
    if (v.kind === 'shape') {
      const pts = [];
      for (let k = 0; k < v.sides; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / v.sides; pts.push((55 + 44 * Math.cos(a)).toFixed(1) + ',' + (55 + 44 * Math.sin(a)).toFixed(1)); }
      return S(110, 110, '<polygon points="' + pts.join(' ') + '" fill="#cfe6a8" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>');
    }
    const sc = Math.min(150 / Math.max(v.kind === 'rect' ? v.w : v.b, 1), 90 / Math.max(v.h, 1), 14);
    if (v.kind === 'rect') {
      const w = v.w * sc, h = v.h * sc;
      return S(w + 70, h + 40, '<rect x="35" y="8" width="' + w + '" height="' + h + '" fill="#cfe6a8" stroke="' + ink + '" stroke-width="3"/>' +
        '<text x="' + (35 + w / 2) + '" y="' + (h + 30) + '" text-anchor="middle" font-size="14" fill="' + ink + '">' + v.w + 'cm</text>' +
        '<text x="30" y="' + (12 + h / 2) + '" text-anchor="end" font-size="14" fill="' + ink + '">' + v.h + 'cm</text>');
    }
    const w = v.b * sc, h = v.h * sc, apex = 35 + w * 0.3;
    return S(w + 70, h + 40, '<polygon points="35,' + (h + 8) + ' ' + (35 + w) + ',' + (h + 8) + ' ' + apex + ',8" fill="#cfe6a8" stroke="' + ink + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<line x1="' + apex + '" y1="8" x2="' + apex + '" y2="' + (h + 8) + '" stroke="' + ink + '" stroke-width="2" stroke-dasharray="4 3"/>' +
      '<text x="' + (35 + w / 2) + '" y="' + (h + 30) + '" text-anchor="middle" font-size="14" fill="' + ink + '">' + v.b + 'cm</text>' +
      '<text x="' + (apex + 6) + '" y="' + (12 + h / 2) + '" font-size="14" fill="' + ink + '">' + v.h + 'cm</text>');
  }

      r.row.querySelector('.rush').textContent = rush ? '追い込み区間（ストック2秒＝1秒）' : '';
      r.row.querySelector('.sg i').style.width = (100 * Math.min(1, Math.max(0, 1 - R / Dur))).toFixed(1) + '%';
      const mx = skipMaxMs(tm, stockMs, t), full = R - mx < 1, mxCost = skipCostSec(tm, full ? R : mx, t);
      r.row.querySelector('.smax').textContent = mx >= 1000
        ? '最大 −' + fmtTime(full ? R : mx) + (full ? '（即完了）' : '') + '：ストック ' + fmtStock(mxCost) + ' 消費'
        : 'ストックが足りません';
      const setB = (b, cut) => { const c = skipCostSec(tm, cut, t); b.disabled = c > D.stock; b.lastChild.textContent = 'ストック' + fmtStock(c); };
      setB(r.b1, Math.min(60000, R)); setB(r.b10, Math.min(600000, R));
      r.b10.style.display = R > 60000 ? '' : 'none';
      r.bmax.disabled = mx < 1000; r.bmax.lastChild.textContent = mx >= 1000 ? 'ストック' + fmtStock(mxCost) : '';
      r.btk.disabled = D.tickets < 1; r.btk.lastChild.textContent = '即完了';
      if (r.bkp) { r.bkp.disabled = !keeperReady(); r.bkp.lastChild.textContent = keeperReady() ? '無料' : '今日は使用済み'; }
    }
  }
  $('skipClose').onclick = () => { $('skipPanel').style.display = 'none'; };

  for (const id of ['popup', 'ordersPanel', 'warehousePanel', 'facPanel', 'drillPanel', 'skipPanel', 'dexPanel']) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { if (e.target === el) { el.style.display = 'none'; if (id === 'popup') popupPlot = -1; if (id === 'drillPanel') ds = null; } });
  }

  const REGION_TEXT = { 3: '東の加工エリア', 4: '北の丘', 5: '南の川', 8: '祭り広場' };
  function levelUpText(lv) {
    const names = a => a.join('・');
    const crops = CROP_KEYS.filter(k => CROPS[k].unlockLv === lv).map(k => CROPS[k].name);
    const facs = BUILDING_KEYS.filter(k => BUILDINGS[k].unlockLv === lv).map(k => BUILDINGS[k].name);
    const recs = Object.values(RECIPES).filter(r => r.unlockLv === lv).map(r => r.product.name);
    const plots = plotsForLevel(lv) - plotsForLevel(lv - 1), houses = LAYOUT.houses.filter(h => h.lv === lv).length;
    const parts = [];
    if (crops.length) parts.push('作物：' + names(crops));
    if (facs.length) parts.push('施設：' + names(facs));
    if (recs.length) parts.push('レシピ：' + names(recs));
    if (plots) parts.push('畑 +' + plots + '区画（計' + plotsForLevel(lv) + '）');
    if (REGION_TEXT[lv]) parts.push(REGION_TEXT[lv] + 'が広がりました');
    if (houses) parts.push('家が' + houses + '軒ふえました');
    return '町Lv' + lv + '！ ' + parts.join('／');
  }
  onLevelUp = lv => {
    hudSig = '';
    buildPalette(); buildPopupRow();
    rebuildWorld(); camTarget = framing();
    toast(levelUpText(lv), 7000);
  };

  // ---------- 操作：区画のなぞり／カメラ移動／ズーム ----------
  function plotAt(sx, sy) {
    const w = toWorld(sx, sy);
    for (let i = 0, n = activePlots(); i < n; i++) {
      const R = plotRect(i);   // 背の高い穂も押せるよう上に少し広げる
      if (w.x >= R.x - 1 && w.x < R.x + R.w + 1 && w.y >= R.y - 6 && w.y < R.y + R.h + 1) return i;
    }
    return -1;
  }
  let mode = null, touched = new Set();
  function apply(i) {
    if (i < 0 || touched.has(i)) return;
    touched.add(i);
    const p = state.plots[i];
    if (mode === 'plant' && !p && selected) plant(i, selected, selectedV);
    else if (mode === 'harvest' && p) { const r = harvest(i); if (r && r.fx.length) toast(ITEMS[r.key].name + ' ×' + r.n + '（' + r.fx.join('・') + '）'); }
  }
  const ptrs = new Map();
  let gesture = null;          // 'farm' | 'pan' | 'pinch'
  let pan = null, pinch = null;
  const mid = () => { const a = [...ptrs.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
  function startPan(x, y, tap = false) { gesture = 'pan'; pan = { sx: x, sy: y, cx: cam.x, cy: cam.y, moved: 0, tap }; canvas.classList.add('grabbing'); }
  function hitTower(sx, sy) {        // 時計塔（タップでドリル）
    const w = toWorld(sx, sy), x0 = LAYOUT.tower.x - 16, y0 = LAYOUT.tower.y - SPR.tower.height - 3;
    return w.x >= x0 && w.x < x0 + 32 && w.y >= y0 && w.y < LAYOUT.tower.y + 2;
  }
  function hitFac(sx, sy) {         // タップした施設のキー（なければ null）
    const w = toWorld(sx, sy);
    for (const k of BUILDING_KEYS) {
      if (!facUnlocked(k)) continue;
      const R = facRect(k);
      if (w.x >= R.x && w.x < R.x + R.w && w.y >= R.y && w.y < R.y + R.h) return k;
    }
    return null;
  }
  function hitBoard(sx, sy) { const w = toWorld(sx, sy); return w.x >= BOARD.x && w.x < BOARD.x + BOARD.w && w.y >= BOARD.y && w.y < BOARD.y + BOARD.h; }
  function startPinch() {
    mode = null; gesture = 'pinch';
    const m = mid(); pinch = { d0: Math.max(10, m.d), z0: cam.zoom, w: toWorld(m.x, m.y) };
  }
  function zoomAround(sx, sy, w, z) {
    cam.zoom = Math.min(ZOOM_MAX, Math.max(zoomMin(), z));
    cam.x = w.x - (sx - VW / 2) / scale(); cam.y = w.y - (sy - VH / 2) / scale();
    clampCam();
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); camTarget = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { startPinch(); return; }
    if (ptrs.size > 2) return;
    const i = plotAt(e.clientX, e.clientY);
    if (i < 0) { startPan(e.clientX, e.clientY, hitBoard(e.clientX, e.clientY) ? 'board' : (hitFac(e.clientX, e.clientY) ? 'fac:' + hitFac(e.clientX, e.clientY) : hitTower(e.clientX, e.clientY) ? 'tower' : false)); return; }   // 区画の外 → カメラ（掲示板の上のタップは注文パネル）
    gesture = 'farm';                                         // 区画の上 → なぞり優先（カメラは動かさない）
    touched = new Set();
    const p = state.plots[i];
    if (!p) {
      if (!selected) { openPopup(i); mode = null; return; }
      mode = 'plant';
    } else if (isReady(p, now())) mode = 'harvest';
    else { mode = null; return; }
    apply(i);
  });
  canvas.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture === 'pinch' && ptrs.size >= 2) {
      const m = mid(); zoomAround(m.x, m.y, pinch.w, pinch.z0 * m.d / pinch.d0);
    } else if (gesture === 'pan') {
      pan.moved = Math.max(pan.moved, Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy));
      cam.x = pan.cx - (e.clientX - pan.sx) / scale(); cam.y = pan.cy - (e.clientY - pan.sy) / scale(); clampCam();
    } else if (gesture === 'farm' && mode) {
      apply(plotAt(e.clientX, e.clientY));
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {
      const tapped = e.type === 'pointerup' && gesture === 'pan' && pan && pan.tap && pan.moved < 8 ? pan.tap : null;
      gesture = null; mode = null; touched = new Set(); canvas.classList.remove('grabbing');
      if (tapped === 'board') openOrders(); else if (tapped === 'tower') openDrill(); else if (tapped && tapped.startsWith('fac:')) openFac(tapped.slice(4));
    }
    else if (gesture === 'pinch' && ptrs.size === 1) { const [q] = ptrs.values(); startPan(q.x, q.y); }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); camTarget = null;
    zoomAround(e.clientX, e.clientY, toWorld(e.clientX, e.clientY), cam.zoom * Math.exp(-e.deltaY * .0015));
  }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', resize);

  // 検品用（読み取り専用の座標変換。ゲーム状態は触らない）
  window.__clockseed = {
    plotCenter: i => { const R = plotRect(i); return toScreen(R.x + R.w / 2, R.y + R.h / 2); },
    worldToScreen: toScreen,
    boardCenter: () => toScreen(BOARD.cx, BOARD.top + 10),
    facCenter: k => toScreen(FAC[k].x, FAC[k].y - (bState(k) === 'none' ? 8 : 20)),
    millCenter: () => window.__clockseed.facCenter('mill'),
    kitchenCenter: () => window.__clockseed.facCenter('kitchen'),
    lastGacha: () => JSON.parse(JSON.stringify(lastGacha)),
    towerCenter: () => toScreen(LAYOUT.tower.x, LAYOUT.tower.y - 30),
    overview: () => { const b = curBounds(), padT = 110, padB = 70; camTarget = null; cam.zoom = Math.min(VW / (b.x1 - b.x0), (VH - padT - padB) / (b.y1 - b.y0)) / BASE; cam.x = (b.x0 + b.x1) / 2; cam.y = (b.y0 + b.y1) / 2 - (padT - padB) / 2 / scale(); },   // 検品用：表示範囲全体を映す（見た目だけ）
    lookAt: (x, y, z) => { camTarget = null; cam.zoom = z; cam.x = x; cam.y = y; },                                                                                                          // 検品用：指定の位置を映す（見た目だけ）
    mapInfo: () => ({ level: townLevel(), bounds: curBounds(), plots: activePlots(), houses: visStatics.filter(o => o.house).length, festival: builtLevel >= LAYOUT.festLv, river: builtLevel >= RIVER.lv, hill: builtLevel >= LAYOUT.hill.lv,
      riverPlots: LAYOUT.plots.map((_, i) => i).filter(i => i < activePlots() && plotNearRiver(i, townLevel())), facilities: BUILDING_KEYS.filter(k => facUnlocked(k)), crops: paletteCrops().filter(k => CROPS[k].unlockLv <= townLevel()) }),
    facPos: k => ({ x: FAC[k].x, y: FAC[k].y, top: FAC[k].top }),
    plotRectW: i => plotRect(i),
    drillAnswerIndex: () => (ds && ds.set[ds.i] ? ds.set[ds.i].answer : -1),
    timers: () => timers().map(x => ({ id: x.id, remaining: x.ready - now(), dur: origDur(x) })),
    viewport: () => { const b = curBounds(); return { w: VW, h: VH, mapX0: b.x0, mapY0: b.y0, mapW: b.x1, mapH: b.y1, zoomMin: zoomMin() }; },
    camera: () => ({ x: cam.x, y: cam.y, zoom: cam.zoom }),
    spriteSizes: () => Object.fromEntries(Object.entries(SPR).map(([k, v]) => [k, [v.width, v.height]])),
  };

  resize();
  initialCamera();
  save();
  requestAnimationFrame(frame);
})();
</script>
</body>
