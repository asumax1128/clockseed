    px(ctx, x - 1, y - 1, 'rgba(40,25,15,.75)', w + 2, 4); px(ctx, x, y, '#7a5a3a', w, 2);
    px(ctx, x, y, '#f2d27a', Math.round(w * Math.min(1, Math.max(0, frac))), 2);
  }
  function drawSmoke(x, y, ts) {                                  // 煙突の煙（加工中）
    for (let i = 0; i < 4; i++) {
      const ph = (ts * 0.45 + i / 4) % 1, a = (1 - ph) * .75, r = 1 + Math.round(ph * 2);
      ctx.fillStyle = 'rgba(245,242,235,' + a.toFixed(2) + ')';
      ctx.fillRect(Math.round(x + Math.sin(ts * 1.5 + i * 2) * 1.5 + ph * 4), Math.round(y - ph * 16), r + 1, r);
    }
  }
  function drawFacilityMarkers(ts, t) {
    const bob = Math.round(Math.sin(ts * 4) * 1.5);
    for (const k of BUILDING_KEYS) {
      if (!facUnlocked(k)) continue;
      const f = FAC[k], st = bState(k, t), b = state.buildings[k];
      if (st === 'none') {                                       // 建設予定地：金貨が跳ねる（足りないときは薄く）
        ctx.globalAlpha = state.gold >= BUILDINGS[k].cost ? 1 : .5;
        ctx.drawImage(SPR.ic_gold, f.x - 6, f.y - 28 + bob);
        ctx.globalAlpha = 1;
      } else if (st === 'building') {
        gaugeBar(f.x - 14, f.y + 4, 28, (t - b.startedAt) / (b.builtAt - b.startedAt));
      } else if (b.job) {
        if (t >= b.job.readyAt) {                                // 完成品が待っている：製品アイコンの吹き出し
          const bx = f.bubble > 0 ? f.x + 15 : f.x - 31, by = f.y - 36 + bob;
          px(ctx, bx, by, '#5a3a22', 16, 16); px(ctx, bx + 1, by + 1, '#fff6e0', 14, 14);
          ctx.drawImage(SPR[RECIPES[b.job.recipe].product.icon], bx + 2, by + 2);
          const tx = f.bubble > 0 ? bx + 2 : bx + 10;
          px(ctx, tx, by + 16, '#5a3a22', 4, 1); px(ctx, tx + 1, by + 17, '#5a3a22', 2, 1);
        } else {
          gaugeBar(f.x - 14, f.y + 4, 28, (t - b.job.startedAt) / (b.job.readyAt - b.job.startedAt));
          if (k === 'kitchen') drawSmoke(f.left + KITCHEN_CHIMNEY.x, f.top + KITCHEN_CHIMNEY.y, ts);
        }
      }
    }
  }

  // ---------- 描画 ----------
  let GROUND = null, builtLevel = 0;
  function rebuildWorld() {            // 町レベルが変わったとき：地面・柵を作り直す
    const lv = townLevel();
    layoutGround(lv);
    GROUND = bakeGround();
    fenceObjs = buildFence(lv);
    builtLevel = lv;
  }
  rebuildWorld();
  const shadow = (c, x, y, rx, ry, a = .26) => {
    c.fillStyle = `rgba(48,30,20,${a})`; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill();
  };
  function setWorldTransform() {
    const S = scale() * DPR;
    const tx = Math.round((VW / 2 - cam.x * scale()) * DPR), ty = Math.round((VH / 2 - cam.y * scale()) * DPR);
    ctx.setTransform(S, 0, 0, S, tx, ty);
    ctx.imageSmoothingEnabled = false;
  }
  let lastT = performance.now();
  function frame(tms) {
    const dt = Math.min(.1, (tms - lastT) / 1000); lastT = tms;
    const t = now(), ts = tms / 1000;
    if (townLevel() !== builtLevel) rebuildWorld();
    const AP = activePlots();
    if (facRunning('mill', t)) millAngle += dt * 0.55;
    stepParticles(dt, ts);
    if (camTarget) {
      const k = 1 - Math.exp(-dt * 4);
      cam.x += (camTarget.x - cam.x) * k; cam.y += (camTarget.y - cam.y) * k; cam.zoom += (camTarget.zoom - cam.zoom) * k;
      clampCam();
      if (Math.abs(camTarget.x - cam.x) + Math.abs(camTarget.y - cam.y) + Math.abs(camTarget.zoom - cam.zoom) * 100 < 0.3) camTarget = null;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#2f4a2c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    setWorldTransform();
    ctx.drawImage(GROUND, 0, 0);

    // 区画の土
    const objs = statics.concat(fenceObjs);
    pushFacilities(objs, t);
    state.plots.forEach((p, i) => {
      if (i >= AP) return;
      const R = plotRect(i), st = stageOf(p, t);
      ctx.drawImage(p ? PLOT_IMG[i].wet : PLOT_IMG[i].dry, R.x, R.y);
      if (!p) return;
      const s = SPR[p.crop + st];
      SLOTS.forEach(([bx, by], k) => {
        const fx = R.x + bx + SLOT_JIT[i][k], fy = R.y + by;
        objs.push({ y: fy, shadow: [fx, fy, st === 1 ? 3 : 5, st === 1 ? 1 : 1.6],
          draw: c => c.drawImage(s, fx - (s.width >> 1), fy - s.height + 1) });
      });
    });
    // 足元の影 → y ソートで立つ物
    for (const o of objs) if (o.shadow) shadow(ctx, ...o.shadow);
    objs.sort((a, b) => a.y - b.y);
    for (const o of objs) o.draw(ctx);

    // 納品できる注文があれば掲示板の上に「！」
    if (state.orders.some(o => state.storage[o.crop] >= o.qty)) {
      const bob = Math.round(Math.sin(ts * 4) * 1.5), bx = BOARD.cx - 4, by = BOARD.top - 14 + bob;
      px(ctx, bx, by, '#5a3a22', 9, 11); px(ctx, bx + 1, by + 1, '#fff6e0', 7, 9);
      px(ctx, bx + 4, by + 2, '#c8503a', 1, 4); px(ctx, bx + 4, by + 7, '#c8503a', 1, 1);
      px(ctx, bx + 3, by + 11, '#5a3a22', 3, 1); px(ctx, bx + 4, by + 12, '#5a3a22', 1, 1);
    }
    drawFacilityMarkers(ts, t);
    if (state.drill.day !== localDay() || state.drill.dayCount === 0) {      // 時計塔：今日まだドリルをしていなければ砂時計の吹き出し
      const bob = Math.round(Math.sin(ts * 3 + 1) * 1.5), bx = LAYOUT.tower.x + 16, by = 56 + bob;
      px(ctx, bx, by, '#5a3a22', 16, 16); px(ctx, bx + 1, by + 1, '#fff6e0', 14, 14);
      ctx.drawImage(SPR.ic_hourglass, bx + 2, by + 2);
      px(ctx, bx, by + 16, '#5a3a22', 1, 3); px(ctx, bx - 1, by + 18, '#5a3a22', 2, 1);
    }

    // 区画の上のしるし（空き：＋、育成中：ゲージ、収穫可：きらめき）
    state.plots.forEach((p, i) => {
      if (i >= AP) return;
      const R = plotRect(i), st = stageOf(p, t);
      if (!p) {
        ctx.globalAlpha = .55 + .25 * Math.sin(ts * 2.4 + i);
        const cx = R.x + 16, cy = R.y + 16;
        px(ctx, cx - 3, cy - 1, '#5e3c24', 7, 3); px(ctx, cx - 1, cy - 3, '#5e3c24', 3, 7);
        px(ctx, cx - 2, cy, '#fff3d6', 5, 1); px(ctx, cx, cy - 2, '#fff3d6', 1, 5);
        ctx.globalAlpha = 1;
      } else if (st < 3) {
        px(ctx, R.x + 3, R.y + PLOT_PX - 5, 'rgba(40,25,15,.75)', 26, 4);
        px(ctx, R.x + 4, R.y + PLOT_PX - 4, '#7a5a3a', 24, 2);
        px(ctx, R.x + 4, R.y + PLOT_PX - 4, '#f2d27a', Math.round(24 * progress(p, t)), 2);
      } else {
        for (let k = 0; k < 4; k++) {
          const r = hash2(i, k, 5), ph = r() * 6.28;
          if (Math.sin(ts * 3 + ph) < .55) continue;
          const sx = R.x + 3 + Math.floor(r() * 26), sy = R.y - 4 + Math.floor(r() * 30);
          px(ctx, sx - 1, sy, '#fff6c8', 3, 1); px(ctx, sx, sy - 1, '#fff6c8', 1, 3);
        }
      }
    });
    // 花びら
    for (const p of particles) if (p.kind === 'petal') {
      const flip = Math.sin(ts * 3 + p.ph) > 0;
      px(ctx, Math.round(p.x), Math.round(p.y), p.col, flip ? 2 : 1, flip ? 1 : 2);
    }

    // 光の演出（画面空間）
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = LIGHT.warm; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = LIGHT.sun; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = LIGHT.haze; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = LIGHT.vig; ctx.fillRect(0, 0, VW, VH);
    // 光の粒（ふんわり発光）
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) if (p.kind === 'mote') {
      const s = toScreen(p.x, p.y), a = .18 + .14 * Math.sin(ts * 1.7 + p.ph), rr = 1.6 * scale();
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr * 2.2);
      g.addColorStop(0, `rgba(255,236,180,${a})`); g.addColorStop(1, 'rgba(255,236,180,0)');
      ctx.fillStyle = g; ctx.fillRect(s.x - rr * 2.2, s.y - rr * 2.2, rr * 4.4, rr * 4.4);
    }
    ctx.globalCompositeOperation = 'source-over';

    updateHud();
    tickFac();
    tickSkip();
    requestAnimationFrame(frame);
  }

  if (FAST !== 1) { const b = $('fastBadge'); b.style.display = 'inline'; b.textContent = '×' + FAST + ' DEBUG'; }

  // ---------- HUD（ゴールド・町Lv・経験値ゲージ・倉庫） ----------
  let hudSig = '';
  const fmtStock = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');   // 時短ストック（分:秒。上限は180:00）
  const stockEls = {};                  // 倉庫表示（品目定義から生成。旧テスト互換のID：sWheat / stockPotato など）
  for (const k of ITEM_KEYS) {
    const cap = k[0].toUpperCase() + k.slice(1), wrap = document.createElement('span');
    wrap.className = 'stock'; wrap.id = 'stock' + cap; wrap.title = ITEMS[k].name;
    wrap.innerHTML = '<img class="px" src="' + iconURL(ITEMS[k].icon) + '" alt="' + ITEMS[k].name + '"><span id="s' + cap + '">0</span>';
    $('stocks').appendChild(wrap); stockEls[k] = { wrap, num: wrap.lastChild };
  }
  const itemVisible = k => ITEMS[k].building ? (bState(ITEMS[k].building) === 'built' || state.storage[k] > 0) : ITEMS[k].unlockLv <= townLevel();
  function updateHud() {
    const lv = townLevel(), exp = state.townExp, st = state.storage;
    const D = state.drill;
    const sig = [lv, exp, state.gold, ITEM_KEYS.map(k => st[k] + ':' + itemVisible(k)).join(), D.stock, D.shards, D.tickets].join('|');
    if (sig === hudSig) return;
    hudSig = sig;
    $('lvText').textContent = '町Lv' + lv;
    const need = TOWN_LV_EXP[lv];                 // 次のLvに必要な累計経験値（最大Lvなら undefined）
    if (need === undefined) { $('expFill').style.width = '100%'; $('expText').textContent = 'MAX'; }
    else {
      const base = TOWN_LV_EXP[lv - 1];
      $('expFill').style.width = (100 * (exp - base) / (need - base)).toFixed(1) + '%';
      $('expText').textContent = exp + '/' + need;
    }
    $('sGold').textContent = state.gold;
    for (const k of ITEM_KEYS) { stockEls[k].num.textContent = st[k]; stockEls[k].wrap.style.display = itemVisible(k) ? '' : 'none'; }
    $('dhStock').textContent = fmtStock(D.stock); $('dhShards').textContent = D.shards; $('dhTickets').textContent = D.tickets;
  }
  let toastTimer = 0;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4200);
  }

  // ---------- 作物パレット／作物選択ポップアップ ----------
  let selected = null;
  const pal = $('palette');
  const iconImg = k => `<img class="px" src="${iconURL(ITEMS[k].icon)}" alt="">`;
  function cropBtn(k, onclick, isSel) {
    const c = CROPS[k], locked = c.unlockLv > townLevel();
    const b = document.createElement('button');
    b.className = 'tool pix' + (isSel ? ' sel' : '') + (locked ? ' locked' : '');
    b.disabled = locked;
    b.innerHTML = iconImg(k) + '<span>' + c.name + '<small>' +
      (locked ? '町Lv' + c.unlockLv + 'で解放' : (c.growMs / 60000) + '分 / ' + c.yield + '個') + '</small></span>';
    if (!locked) b.onclick = onclick;
    return b;
  }
  function buildPalette() {
    pal.innerHTML = '';
    for (const k of CROP_KEYS) pal.appendChild(cropBtn(k, () => { selected = selected === k ? null : k; buildPalette(); }, selected === k));
  }
  const popup = $('popup');
  let popupPlot = -1;
  function buildPopupRow() {
    const row = $('popupRow'); row.innerHTML = '';
    for (const k of CROP_KEYS) row.appendChild(cropBtn(k, () => {
      const i = popupPlot; closePopup();
      selected = k; buildPalette();
      if (i >= 0) plant(i, k);
    }, false));
  }
  buildPalette(); buildPopupRow();
  function openPopup(i) { popupPlot = i; buildPopupRow(); popup.style.display = 'flex'; }
  function closePopup() { popup.style.display = 'none'; popupPlot = -1; }
  $('popupCancel').onclick = closePopup;

  // ---------- 注文パネル ----------
  const goldImg = `<img class="px" src="${iconURL('ic_gold')}" alt="G">`;
  function renderOrders() {
    const list = $('orderList'); list.innerHTML = '';
    state.orders.forEach((o, i) => {
      const have = state.storage[o.crop], r = orderReward(o), short = o.qty - have;
      const row = document.createElement('div'); row.className = 'orow';
      row.innerHTML = '<div class="ocrop">' + iconImg(o.crop) + '<span>' + ITEMS[o.crop].name + ' ×' + o.qty +
        '<small>倉庫に ' + have + '個</small></span></div>' +
        '<div class="orew"><span>' + goldImg + r.gold + '</span><span class="xp">町経験値 +' + r.exp + '</span></div>';
      const b = document.createElement('button'); b.className = 'tool pix act';
      if (short > 0) { b.textContent = 'あと' + short + '個'; b.disabled = true; }
      else { b.textContent = '納品'; b.onclick = () => { if (deliver(i)) renderOrders(); }; }
      row.appendChild(b); list.appendChild(row);
    });
  }
  function openOrders() { renderOrders(); $('ordersPanel').style.display = 'flex'; }
  $('ordersClose').onclick = () => { $('ordersPanel').style.display = 'none'; };

  // ---------- 倉庫パネル（生売り・加工品も同じ） ----------
  function renderWarehouse() {
    const list = $('warehouseList'); list.innerHTML = '';
    for (const k of ITEM_KEYS) {
      const c = ITEMS[k];
      if (!itemVisible(k)) continue;
      const n = state.storage[k];
      const row = document.createElement('div'); row.className = 'wrow';
      row.innerHTML = '<div class="nm">' + iconImg(k) + '<span>' + c.name + '<small>単価 ' + c.price + 'G</small></span></div>' +
        '<div class="cnt">' + n + '個</div>';
      const b1 = document.createElement('button'); b1.className = 'tool pix small';
      b1.textContent = '1個売る +' + c.price + 'G'; b1.disabled = n < 1;
      b1.onclick = () => { sell(k, 1); renderWarehouse(); };
      const b2 = document.createElement('button'); b2.className = 'tool pix small';
      b2.textContent = '全部売る +' + (c.price * n) + 'G'; b2.disabled = n < 1;
      b2.onclick = () => { sell(k, n); renderWarehouse(); };
      row.appendChild(b1); row.appendChild(b2); list.appendChild(row);
    }
  }
  $('warehouse').onclick = () => { renderWarehouse(); $('warehousePanel').style.display = 'flex'; };
  $('warehouseClose').onclick = () => { $('warehousePanel').style.display = 'none'; };

  // ---------- 施設パネル（建設予定地／建設中／加工）。建物・レシピ定義から生成 ----------
  const fmtTime = ms => { const sec = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const facRecipes = k => Object.keys(RECIPES).filter(rk => RECIPES[rk].building === k);
  let curFac = 'mill', facRenderedSig = '';
  function facSig(k) {
    const st = bState(k), b = state.buildings[k], t = now();
    const job = b && b.job ? (t >= b.job.readyAt ? 'done' : 'run') : 'none';
    return [k, st, job, state.gold >= BUILDINGS[k].cost, facRecipes(k).map(canCraft).join()].join('|');
  }
  function mkBtn(label, disabled, onclick) {
    const b = document.createElement('button'); b.className = 'tool pix act'; b.textContent = label; b.disabled = disabled;
    if (!disabled) b.onclick = onclick; return b;
  }
  function renderFac() {
    const k = curFac, body = $('facBody'), B = BUILDINGS[k], st = bState(k), b = state.buildings[k];
    facRenderedSig = facSig(k);
    body.innerHTML = '';
    const add = (html, cls) => { const d = document.createElement('div'); d.className = cls || 'mline'; d.innerHTML = html; body.appendChild(d); return d; };
    const gauge = '<div class="pgauge"><i id="mFill"></i></div><div class="mline sub" id="mTime"></div>';
    if (st === 'none') {
      $('facTitle').textContent = '建設予定地';
      add('<b>' + B.name + '</b>を建てますか？');
      add('建設費 ' + goldImg + B.cost + 'G ／ 建設時間 ' + (B.buildMs / 60000) + '分');
      add('所持金 ' + goldImg + state.gold + 'G', 'mline sub');
      const act = add('', 'mact');
      act.appendChild(state.gold >= B.cost ? mkBtn('建設開始', false, () => { if (startBuild(k)) renderFac(); })
                                           : mkBtn('あと' + (B.cost - state.gold) + 'G 必要', true));
    } else if (st === 'building') {
      $('facTitle').textContent = B.name + '（建設中）';
      add(B.buildText);
      add(gauge, 'mline');
      add('', 'mact').appendChild(mkBtn('時短を使う', false, () => { $('facPanel').style.display = 'none'; openSkip(); }));
    } else {
      $('facTitle').textContent = B.name;
      if (b.job) {
        const r = RECIPES[b.job.recipe], pr = r.product, done = now() >= b.job.readyAt;
        add((done ? '完成！ ' : '加工中： ') + iconImg(pr.key) + ' ' + pr.name + ' ×' + pr.qty);
        if (done) add('', 'mact').appendChild(mkBtn('受け取る', false, () => { if (collectJob(k)) renderFac(); }));
        else { add(gauge, 'mline'); add('', 'mact').appendChild(mkBtn('時短を使う', false, () => { $('facPanel').style.display = 'none'; openSkip(); })); }
      }
      for (const rk of facRecipes(k)) {
        const r = RECIPES[rk], pr = r.product, ok = canCraft(rk), busy = !!b.job;
        const ins = Object.entries(r.inputs).map(([ik, n]) => iconImg(ik) + ITEMS[ik].name + ' <span class="' +
          (state.storage[ik] >= n ? '' : 'short') + '">' + state.storage[ik] + '/' + n + '</span>').join(' ＋ ');
        const row = document.createElement('div'); row.className = 'mrow';
        row.innerHTML = '<div class="recipe">' + ins + ' → ' + iconImg(pr.key) + '<span>' + pr.name + ' ×' + pr.qty +
          '<small>加工 ' + (r.ms / 60000) + '分 ／ 単価 ' + pr.price + 'G</small></span></div>';
        row.appendChild(mkBtn(busy ? (now() >= b.job.readyAt ? '受け取り待ち' : '加工中') : ok ? '加工開始' : '材料が足りません', busy || !ok, () => { if (startJob(k, rk)) renderFac(); }));
        body.appendChild(row);
      }
    }
    tickFac(true);
  }
  function tickFac(force) {             // パネルの表示だけを更新（状態は時刻との差分で計算）
    if ($('facPanel').style.display !== 'flex') return;
    if (!force && facSig(curFac) !== facRenderedSig) { renderFac(); return; }
    const b = state.buildings[curFac], t = now(), f = $('mFill');
    if (!f || !b) return;
    let from, to;
    if (t < b.builtAt) { from = b.startedAt; to = b.builtAt; }
    else if (b.job && t < b.job.readyAt) { from = b.job.startedAt; to = b.job.readyAt; }
    else return;
    f.style.width = (100 * Math.min(1, (t - from) / (to - from))).toFixed(1) + '%';
    $('mTime').textContent = 'あと ' + fmtTime(to - t);
  }
  function openFac(k) { curFac = k; renderFac(); $('facPanel').style.display = 'flex'; }
  $('facClose').onclick = () => { $('facPanel').style.display = 'none'; };

  // ---------- ドリル（時計塔のパネル） ----------
  const DRILL = window.ClockseedDrill;
  const LV_KEYS = ['A', 'B', 'C', 'D', 'E'];
  const fmtMath = str => String(str).replace(/(−?\d+)\/(\d+)/g, '<span class="fr"><span>$1</span><span>$2</span></span>');
  const icon = k => '<img class="px" src="' + iconURL(k) + '" alt="">';
  const fmtShard = x => (Number.isInteger(x) ? String(x) : x.toFixed(1));
  let drillLevel = 'A', ds = null;                   // ds：進行中のセット（セーブしない）
  const drillOpen = () => $('drillPanel').style.display === 'flex';
  function statusHtml() {
    const D = state.drill;
    return '<div class="dstat"><span title="時短ストック">' + icon('ic_hourglass') + fmtStock(D.stock) + ' / ' + fmtStock(DRILL_STOCK_MAX) + '</span>' +
      '<span title="ガチャのカケラ">' + icon('ic_shard') + 'カケラ ' + D.shards + '</span>' +
      '<span title="即完了チケット">' + icon('ic_ticket') + 'チケット ' + D.tickets + '枚</span>' +
      '<span>連続正解 ' + D.streak + '</span><span>今日 ' + (D.day === localDay() ? D.dayCount : 0) + '問</span></div>';
  }
  function renderDrillMenu() {
    ds = null;
    $('drillTitle').textContent = '時計塔のドリル';
    const body = $('drillBody'); body.innerHTML = statusHtml();
    const grid = document.createElement('div'); grid.className = 'lvgrid';
    for (const L of LV_KEYS) {
      const lv = DRILL.LEVELS[L], R = DRILL_REWARD[L], ready = !!(lv.ready && R);
      const b = document.createElement('button');
      b.className = 'tool pix lvbtn' + (drillLevel === L ? ' sel' : '') + (ready ? '' : ' locked');
      b.disabled = !ready;
      b.innerHTML = '<b>' + L + '</b><span>' + (ready ? lv.label : '準備中') + '</span><small>' + (ready ? '1問 +' + R.sec + '秒・カケラ' + R.shards : '&nbsp;') + '</small>';
      if (ready) b.onclick = () => { drillLevel = L; renderDrillMenu(); };
      grid.appendChild(b);
    }
    body.appendChild(grid);
    const ts = document.createElement('div'); ts.className = 'tstats';
    ts.innerHTML = DRILL.LEVELS[drillLevel].types.map(id => {
      const r = state.drill.stats[id] || { ok: 0, n: 0 };
      return '<span>' + DRILL.TYPES[id].name + '<b>' + r.ok + ' / ' + r.n + '</b></span>';
    }).join('');
    body.appendChild(ts);
    const acts = document.createElement('div'); acts.className = 'dacts';
    acts.appendChild(mkBtn('5問セットを始める', false, startDrillSet));
    acts.appendChild(mkBtn('時短を使う', false, openSkip));
    body.appendChild(acts);
  }
  function startDrillSet() {
    ds = { level: drillLevel, set: DRILL.makeSet(drillLevel, Math.random, 5), i: 0, results: [], locked: false };
    renderDrillQ();
  }
  function visualSvg(v) {             // 問題の図（時計・図形・長方形・三角形）
    const S = (w, h, inner) => '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' + inner + '</svg>';
    const ink = '#4a3322', cream = '#fff8e4';
    if (v.kind === 'clock') {
      let s = '<circle cx="60" cy="60" r="52" fill="' + cream + '" stroke="' + ink + '" stroke-width="5"/>';
      for (let k = 1; k <= 12; k++) {
        const a = k * Math.PI / 6, x = 60 + 40 * Math.sin(a), y = 60 - 40 * Math.cos(a);
        s += '<text x="' + x.toFixed(1) + '" y="' + (y + 5).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="bold" fill="' + ink + '">' + k + '</text>';
      }
      const ha = ((v.h % 12) + v.m / 60) * Math.PI / 6, ma = v.m * Math.PI / 30;
      s += '<line x1="60" y1="60" x2="' + (60 + 24 * Math.sin(ha)).toFixed(1) + '" y2="' + (60 - 24 * Math.cos(ha)).toFixed(1) + '" stroke="' + ink + '" stroke-width="6" stroke-linecap="round"/>';
      s += '<line x1="60" y1="60" x2="' + (60 + 36 * Math.sin(ma)).toFixed(1) + '" y2="' + (60 - 36 * Math.cos(ma)).toFixed(1) + '" stroke="#b8503c" stroke-width="3.5" stroke-linecap="round"/>';
      return S(120, 120, s + '<circle cx="60" cy="60" r="4.5" fill="#d9ae55"/>');
    }
    if (v.kind === 'shape') {
      const pts = [];
      for (let k = 0; k < v.sides; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / v.sides; pts.push((55 + 44 * Math.cos(a)).toFixed(1) + ',' + (55 + 44 * Math.sin(a)).toFixed(1)); }
      return S(110, 110, '<polygon points="' + pts.join(' ') + '" fill="#cfe6a8" stroke="' + ink + '" stroke-width="4" stroke-linejoin="round"/>');
    }
    const sc = Math.min(150 / Math.max(v.kind === 'rect' ? v.w : v.b, 1), 90 / Math.max(v.h, 1), 14);
    if (v.kind === 'rect') {
      const w = v.w * sc, h = v.h * sc;
      return S(w + 70, h + 40, '<rect x="35" y="8" width="' + w + '" height="' + h + '" fill="#cfe6a8" stroke="' + ink + '" stroke-width="3"/>' +
        '<text x="' + (35 + w / 2) + '" y="' + (h + 30) + '" text-anchor="middle" font-size="14" fill="' + ink + '">' + v.w + 'cm</text>' +
        '<text x="30" y="' + (12 + h / 2) + '" text-anchor="end" font-size="14" fill="' + ink + '">' + v.h + 'cm</text>');
    }
    const w = v.b * sc, h = v.h * sc, apex = 35 + w * 0.3;
    return S(w + 70, h + 40, '<polygon points="35,' + (h + 8) + ' ' + (35 + w) + ',' + (h + 8) + ' ' + apex + ',8" fill="#cfe6a8" stroke="' + ink + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<line x1="' + apex + '" y1="8" x2="' + apex + '" y2="' + (h + 8) + '" stroke="' + ink + '" stroke-width="2" stroke-dasharray="4 3"/>' +
      '<text x="' + (35 + w / 2) + '" y="' + (h + 30) + '" text-anchor="middle" font-size="14" fill="' + ink + '">' + v.b + 'cm</text>' +
      '<text x="' + (apex + 6) + '" y="' + (12 + h / 2) + '" font-size="14" fill="' + ink + '">' + v.h + 'cm</text>');
  }
  function renderDrillQ() {
    const pb = ds.set[ds.i], L = ds.level;
    $('drillTitle').textContent = '時計塔のドリル';
    const pips = ds.set.map((_, k) => '<i class="' + (k < ds.results.length ? (ds.results[k].correct ? 'ok' : 'ng') : k === ds.i ? 'cur' : '') + '"></i>').join('');
    const body = $('drillBody');
    body.innerHTML = '<div class="dq-head"><span><span class="lvtag">' + L + '</span>' + DRILL.TYPES[pb.type].name + '</span>' +
      '<span class="pips">' + pips + '</span><span>' + (ds.i + 1) + ' / ' + ds.set.length + '問</span></div>' +
      '<div class="dq-prompt">' + fmtMath(pb.prompt) + '</div>' + (pb.visual ? '<div class="dq-vis">' + visualSvg(pb.visual) + '</div>' : '');
    const grid = document.createElement('div'); grid.className = 'choices';
    pb.choices.forEach((c, k) => {
      const b = document.createElement('button'); b.className = 'tool pix choice'; b.innerHTML = fmtMath(c.label);
      b.onclick = () => answerDrill(k); grid.appendChild(b);
    });
    body.appendChild(grid);
    const fb = document.createElement('div'); fb.className = 'dfb'; fb.id = 'dqFb'; body.appendChild(fb);
  }
  function sparkle(el) {              // 正解の小さな演出（効果音の代わり）
    for (let k = 0; k < 10; k++) {
      const d = document.createElement('i'), a = k / 10 * Math.PI * 2, r = 40 + (k % 3) * 14;
      d.className = 'spark'; d.style.setProperty('--dx', (Math.cos(a) * r).toFixed(0) + 'px'); d.style.setProperty('--dy', (Math.sin(a) * r * .6).toFixed(0) + 'px');
      if (k % 2) d.style.background = '#c7b8ff';
      el.appendChild(d); setTimeout(() => d.remove(), 800);
    }
    const hud = $('drillHud'); hud.classList.remove('pulse'); void hud.offsetWidth; hud.classList.add('pulse');
  }
  function answerDrill(k) {
    if (!ds || ds.locked) return;
    ds.locked = true;
    const pb = ds.set[ds.i], ok = k === pb.answer, res = drillAnswer(ds.level, pb.type, ok);
    ds.results.push(res);
    $('drillBody').querySelectorAll('.choice').forEach((b, j) => {
      b.disabled = true;
      if (j === pb.answer) b.classList.add('ok'); else if (j === k) b.classList.add('ng');
    });
    const fb = $('dqFb'), cur = ds;
    if (ok) {
      fb.innerHTML = '<span class="fly">せいかい！ +' + res.sec + '秒　カケラ+' + fmtShard(res.shards) + (res.ticket ? '　チケット+1' : '') + '</span>';
      sparkle(fb);
      if (res.ticket) toast('10問連続正解！ 即完了チケットを1枚手に入れました');
      setTimeout(() => { if (ds === cur && drillOpen()) nextDrill(); }, 950);
    } else {
      fb.innerHTML = 'ざんねん… こたえは「' + fmtMath(pb.choices[pb.answer].label) + '」' + (res.streakLost ? '<br><small>連続正解が0に戻りました</small>' : '') + '<br>';
      const nb = mkBtn('つぎへ', false, nextDrill); nb.style.marginTop = '6px'; fb.appendChild(nb);
    }
  }
  function nextDrill() {
    if (!ds) return;
    ds.i += 1; ds.locked = false;
    if (ds.i >= ds.set.length) renderDrillResult(); else renderDrillQ();
  }
  function renderDrillResult() {
    const r = ds.results, okN = r.filter(x => x.correct).length, sec = r.reduce((a, x) => a + x.sec, 0);
    const sh = r.reduce((a, x) => a + x.shards, 0), tk = r.filter(x => x.ticket).length;
    $('drillTitle').textContent = 'けっか';
    const body = $('drillBody');
    body.innerHTML = '<div class="dres"><span class="big">' + ds.set.length + '問中 ' + okN + '問 正解</span><br>' +
      icon('ic_hourglass') + ' 時短ストック +' + fmtStock(sec) + (r.some(x => x.capped) ? '（上限180分で頭打ち）' : '') + '<br>' +
      icon('ic_shard') + ' カケラ +' + fmtShard(sh) + (r.some(x => x.halved) ? '（今日は120問をこえたので半分）' : '') + '<br>' +
      (tk ? icon('ic_ticket') + ' 即完了チケット +' + tk + '枚<br>' : '') +
      '連続正解 ' + state.drill.streak + '問</div>' + statusHtml();
    const acts = document.createElement('div'); acts.className = 'dacts';
    acts.appendChild(mkBtn('もう一度（5問）', false, startDrillSet));
    acts.appendChild(mkBtn('時短を使う', false, openSkip));
    acts.appendChild(mkBtn('メニューへ', false, renderDrillMenu));
    body.appendChild(acts);
  }
  function openDrill() { renderDrillMenu(); $('drillPanel').style.display = 'flex'; }
  $('drillClose').onclick = () => { $('drillPanel').style.display = 'none'; ds = null; };
  $('drillHud').onclick = openDrill;

  // ---------- 時短の適用パネル（進行中のタイマーの一覧） ----------
  let skipSig = '', skipRows = {}, skipTickAt = 0;
  const skipOpen = () => $('skipPanel').style.display === 'flex';
  const listSig = list => list.map(x => x.id).join() + '|' + state.drill.tickets;
  function openSkip() {
    $('drillPanel').style.display = 'none'; ds = null;
    renderSkip(); $('skipPanel').style.display = 'flex';
  }
  function renderSkip() {
    const list = timers();
    skipSig = listSig(list); skipRows = {};
    const box = $('skipList'); box.innerHTML = '';
    if (!list.length) box.innerHTML = '<div class="sempty">進行中のタイマー（育成中の区画・建設中の建物・加工中の品）はありません</div>';
    for (const tm of list) {
      const row = document.createElement('div'); row.className = 'srow'; row.dataset.id = tm.id;
      row.innerHTML = icon(tm.icon) + '<div class="sinfo"><b>' + tm.label + '</b><small>残り <span class="rem"></span>　<span class="rush"></span></small>' +
        '<div class="sg"><i></i></div><small class="smax"></small></div>';
      const bx = document.createElement('div'); bx.className = 'sbtns';
      const mk = (label, fn) => { const b = document.createElement('button'); b.className = 'tool pix'; b.innerHTML = label + '<small></small>'; b.onclick = fn; bx.appendChild(b); return b; };
      const done = (r, what) => { if (r) toast(tm.label + '：' + what); renderSkip(); };
      skipRows[tm.id] = {
        row,
        b1: mk('−1分', () => { const r = applySkip(tm.id, 60000); done(r, r && ('−' + fmtTime(r.ms) + '（ストック ' + fmtStock(r.cost) + ' 消費）' + (r.done ? ' 完了！' : ''))); }),
        b10: mk('−10分', () => { const r = applySkip(tm.id, 600000); done(r, r && ('−' + fmtTime(r.ms) + '（ストック ' + fmtStock(r.cost) + ' 消費）' + (r.done ? ' 完了！' : ''))); }),
        bmax: mk('最大まで', () => { const r = applySkip(tm.id, 'max'); done(r, r && ('−' + fmtTime(r.ms) + '（ストック ' + fmtStock(r.cost) + ' 消費）' + (r.done ? ' 完了！' : ''))); }),
        btk: mk('チケット', () => { const r = useTicket(tm.id); done(r, 'チケットで即完了！'); }),
      };
      row.appendChild(bx); box.appendChild(row);
    }
    tickSkip(true);
  }
  function tickSkip(force) {          // 表示だけを更新（状態は時刻との差分で計算）
    if (!skipOpen()) return;
    const t = now(), list = timers(t);
    if (listSig(list) !== skipSig) { renderSkip(); return; }
    if (!force && t - skipTickAt < 250) return;
    skipTickAt = t;
    const D = state.drill, stockMs = D.stock * 1000;
    $('skipHead').innerHTML = '<div class="shead"><span>' + icon('ic_hourglass') + 'ストック ' + fmtStock(D.stock) + ' / ' + fmtStock(DRILL_STOCK_MAX) + '</span>' +
      '<span>' + icon('ic_ticket') + '即完了チケット ' + D.tickets + '枚</span></div>';
    for (const tm of list) {
      const r = skipRows[tm.id]; if (!r) continue;
      const R = tm.ready - t, Dur = origDur(tm), rush = R < Dur * SKIP_RUSH;
      r.row.querySelector('.rem').textContent = fmtTime(R);
      r.row.querySelector('.rush').textContent = rush ? '追い込み区間（ストック2秒＝1秒）' : '';
      r.row.querySelector('.sg i').style.width = (100 * Math.min(1, Math.max(0, 1 - R / Dur))).toFixed(1) + '%';
      const mx = skipMaxMs(tm, stockMs, t), full = R - mx < 1, mxCost = skipCostSec(tm, full ? R : mx, t);
      r.row.querySelector('.smax').textContent = mx >= 1000
        ? '最大 −' + fmtTime(full ? R : mx) + (full ? '（即完了）' : '') + '：ストック ' + fmtStock(mxCost) + ' 消費'
        : 'ストックが足りません';
      const setB = (b, cut) => { const c = skipCostSec(tm, cut, t); b.disabled = c > D.stock; b.lastChild.textContent = 'ストック' + fmtStock(c); };
      setB(r.b1, Math.min(60000, R)); setB(r.b10, Math.min(600000, R));
      r.b10.style.display = R > 60000 ? '' : 'none';
      r.bmax.disabled = mx < 1000; r.bmax.lastChild.textContent = mx >= 1000 ? 'ストック' + fmtStock(mxCost) : '';
      r.btk.disabled = D.tickets < 1; r.btk.lastChild.textContent = '即完了';
    }
  }
  $('skipClose').onclick = () => { $('skipPanel').style.display = 'none'; };

  for (const id of ['popup', 'ordersPanel', 'warehousePanel', 'facPanel', 'drillPanel', 'skipPanel']) {
    const el = $(id);
    el.addEventListener('pointerdown', e => { if (e.target === el) { el.style.display = 'none'; if (id === 'popup') popupPlot = -1; if (id === 'drillPanel') ds = null; } });
  }

  onLevelUp = lv => {
    hudSig = '';
    buildPalette(); buildPopupRow();
    rebuildWorld(); camTarget = framing();
    toast('町Lv' + lv + '！ じゃがいも・畑の3区画・製粉所とキッチンの建設予定地が解放されました');
  };

  // ---------- 操作：区画のなぞり／カメラ移動／ズーム ----------
  function plotAt(sx, sy) {
    const w = toWorld(sx, sy);
    for (let i = 0, n = activePlots(); i < n; i++) {
      const R = plotRect(i);   // 背の高い穂も押せるよう上に少し広げる
      if (w.x >= R.x - 1 && w.x < R.x + R.w + 1 && w.y >= R.y - 6 && w.y < R.y + R.h + 1) return i;
    }
    return -1;
  }
  let mode = null, touched = new Set();
  function apply(i) {
    if (i < 0 || touched.has(i)) return;
    touched.add(i);
    const p = state.plots[i];
    if (mode === 'plant' && !p && selected) plant(i, selected);
    else if (mode === 'harvest' && p) harvest(i);
  }
  const ptrs = new Map();
  let gesture = null;          // 'farm' | 'pan' | 'pinch'
  let pan = null, pinch = null;
  const mid = () => { const a = [...ptrs.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) }; };
  function startPan(x, y, tap = false) { gesture = 'pan'; pan = { sx: x, sy: y, cx: cam.x, cy: cam.y, moved: 0, tap }; canvas.classList.add('grabbing'); }
  function hitTower(sx, sy) {        // 時計塔（タップでドリル）
    const w = toWorld(sx, sy), x0 = LAYOUT.tower.x - 16, y0 = LAYOUT.tower.y - SPR.tower.height - 3;
    return w.x >= x0 && w.x < x0 + 32 && w.y >= y0 && w.y < LAYOUT.tower.y + 2;
  }
  function hitFac(sx, sy) {         // タップした施設のキー（なければ null）
    const w = toWorld(sx, sy);
    for (const k of BUILDING_KEYS) {
      if (!facUnlocked(k)) continue;
      const R = facRect(k);
      if (w.x >= R.x && w.x < R.x + R.w && w.y >= R.y && w.y < R.y + R.h) return k;
    }
    return null;
  }
  function hitBoard(sx, sy) { const w = toWorld(sx, sy); return w.x >= BOARD.x && w.x < BOARD.x + BOARD.w && w.y >= BOARD.y && w.y < BOARD.y + BOARD.h; }
  function startPinch() {
    mode = null; gesture = 'pinch';
    const m = mid(); pinch = { d0: Math.max(10, m.d), z0: cam.zoom, w: toWorld(m.x, m.y) };
  }
  function zoomAround(sx, sy, w, z) {
    cam.zoom = Math.min(ZOOM_MAX, Math.max(zoomMin(), z));
    cam.x = w.x - (sx - VW / 2) / scale(); cam.y = w.y - (sy - VH / 2) / scale();
    clampCam();
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); camTarget = null;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { startPinch(); return; }
    if (ptrs.size > 2) return;
    const i = plotAt(e.clientX, e.clientY);
    if (i < 0) { startPan(e.clientX, e.clientY, hitBoard(e.clientX, e.clientY) ? 'board' : (hitFac(e.clientX, e.clientY) ? 'fac:' + hitFac(e.clientX, e.clientY) : hitTower(e.clientX, e.clientY) ? 'tower' : false)); return; }   // 区画の外 → カメラ（掲示板の上のタップは注文パネル）
    gesture = 'farm';                                         // 区画の上 → なぞり優先（カメラは動かさない）
    touched = new Set();
    const p = state.plots[i];
    if (!p) {
      if (!selected) { openPopup(i); mode = null; return; }
      mode = 'plant';
    } else if (isReady(p, now())) mode = 'harvest';
    else { mode = null; return; }
    apply(i);
  });
  canvas.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture === 'pinch' && ptrs.size >= 2) {
      const m = mid(); zoomAround(m.x, m.y, pinch.w, pinch.z0 * m.d / pinch.d0);
    } else if (gesture === 'pan') {
      pan.moved = Math.max(pan.moved, Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy));
      cam.x = pan.cx - (e.clientX - pan.sx) / scale(); cam.y = pan.cy - (e.clientY - pan.sy) / scale(); clampCam();
    } else if (gesture === 'farm' && mode) {
      apply(plotAt(e.clientX, e.clientY));
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0) {
      const tapped = e.type === 'pointerup' && gesture === 'pan' && pan && pan.tap && pan.moved < 8 ? pan.tap : null;
      gesture = null; mode = null; touched = new Set(); canvas.classList.remove('grabbing');
      if (tapped === 'board') openOrders(); else if (tapped === 'tower') openDrill(); else if (tapped && tapped.startsWith('fac:')) openFac(tapped.slice(4));
    }
    else if (gesture === 'pinch' && ptrs.size === 1) { const [q] = ptrs.values(); startPan(q.x, q.y); }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); camTarget = null;
    zoomAround(e.clientX, e.clientY, toWorld(e.clientX, e.clientY), cam.zoom * Math.exp(-e.deltaY * .0015));
  }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('resize', resize);

  // 検品用（読み取り専用の座標変換。ゲーム状態は触らない）
  window.__clockseed = {
    plotCenter: i => { const R = plotRect(i); return toScreen(R.x + R.w / 2, R.y + R.h / 2); },
    worldToScreen: toScreen,
    boardCenter: () => toScreen(BOARD.cx, BOARD.top + 10),
    facCenter: k => toScreen(FAC[k].x, FAC[k].y - (bState(k) === 'none' ? 8 : 20)),
    millCenter: () => window.__clockseed.facCenter('mill'),
    kitchenCenter: () => window.__clockseed.facCenter('kitchen'),
    towerCenter: () => toScreen(LAYOUT.tower.x, LAYOUT.tower.y - 30),
    drillAnswerIndex: () => (ds && ds.set[ds.i] ? ds.set[ds.i].answer : -1),
    timers: () => timers().map(x => ({ id: x.id, remaining: x.ready - now(), dur: origDur(x) })),
    viewport: () => ({ w: VW, h: VH, mapW: MAP.w * T, mapH: MAP.h * T, zoomMin: zoomMin() }),
    camera: () => ({ x: cam.x, y: cam.y, zoom: cam.zoom }),
    spriteSizes: () => Object.fromEntries(Object.entries(SPR).map(([k, v]) => [k, [v.width, v.height]])),
  };

  resize();
  initialCamera();
  save();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
